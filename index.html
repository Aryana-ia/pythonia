/* ZIP sin compresión (método store), suficiente para archivos de texto */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipear(archivos){
  const enc = new TextEncoder(), partes = [], central = []; let offset = 0;
  const d = new Date(), hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        fecha = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  archivos.forEach(([nombre, texto]) => {
    const nb = enc.encode(nombre), datos = enc.encode(texto), crc = crc32(datos);
    const lh = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, hora, 2], [12, fecha, 2], [14, crc, 4], [18, datos.length, 4], [22, datos.length, 4], [26, nb.length, 2], [28, 0, 2]]
      .forEach(([o, v, n]) => n === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
    partes.push(new Uint8Array(lh.buffer), nb, datos);
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, hora, 2], [14, fecha, 2], [16, crc, 4], [20, datos.length, 4], [24, datos.length, 4], [28, nb.length, 2],
     [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]].forEach(([o, v, n]) => n === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    central.push(new Uint8Array(ch.buffer), nb);
    offset += 30 + nb.length + datos.length;
  });
  const tamCentral = central.reduce((s, a) => s + a.length, 0), fin = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, archivos.length, 2], [10, archivos.length, 2], [12, tamCentral, 4], [16, offset, 4], [20, 0, 2]]
    .forEach(([o, v, n]) => n === 4 ? fin.setUint32(o, v, true) : fin.setUint16(o, v, true));
  return new Blob([...partes, ...central, new Uint8Array(fin.buffer)], {type: "application/zip"});
}
async function descargar(nombre, blob){
  const dl = await usarCapacidad("downloads");
  if (dl) {
    try { await dl.save({filename: nombre, data: blob}); toast("Archivo guardado ✔"); return true; }
    catch (e) { if (e && e.code === "declined") { toast("Descarga cancelada"); return false; } }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Descarga iniciada"); return true;
  } catch (e) { toast("No se pudo descargar aquí: usa Copiar código"); return false; }
}

function proyectoCard(lv){
  const P = lv.proyecto_app, h = piezasHechas(lv), n = piezas(lv).length;
  return `<div class="proj" style="--lc:${lv.color}"><span class="ic">${h === n ? "🏆" : "🏗️"}</span><div style="flex:1">
    <b>Tu proyecto: ${esc(P.titulo)}</b><br><span class="muted">${esc(lv.proyecto.desc)}</span>
    <div class="bar mini" aria-hidden="true"><i style="width:${n ? h / n * 100 : 0}%;background:${lv.color}"></i></div>
    <span class="muted" style="font-size:13.5px">${h} de ${n} piezas · cada práctica aprobada suma una</span><br>
    <button class="btn ghost" data-proy="${lv.id}" style="margin-top:8px">Ver mi proyecto</button></div></div>`;
}

function openProyecto(id){
  const lv = D.levels.find(l => l.id === id), P = lv.proyecto_app, ps = piezas(lv), h = piezasHechas(lv), completo = h === ps.length;
  const codigo = ensamblar(lv);
  sheet(lv.color, `Proyecto del Nivel ${lv.id}`, `
    <div class="big" aria-hidden="true">${completo ? "🏆" : "🏗️"}</div><h1 id="sheet-title">${esc(P.titulo)}</h1>
    <p>${esc(P.intro)}</p>
    <div class="bar" aria-hidden="true"><i style="width:${h / ps.length * 100}%;background:${lv.color}"></i></div>
    <p class="muted">${h} de ${ps.length} piezas · archivo <code>${esc(P.archivo)}</code> · ${codigo.split("\n").length} líneas</p>
    <div class="blk"><h3>Piezas</h3><div class="mods">${ps.map(o => { const ok = S.prac[o.key] && S.prac[o.key].ok;
      return `<button class="mod ${ok ? "done" : ""}" style="--rc:${lv.color}" data-open="${o.key}"><span class="ic">${ok ? "✔" : "○"}</span>
        <span class="tx"><b>${esc(o.p.pieza)}</b><small>Lección ${lv.id}.${o.i + 1} · ${esc(o.l.t)}</small></span><span class="st">${ok ? "Lista" : "Pendiente"}</span></button>`; }).join("")}</div></div>
    <div class="blk"><h3>Tu código hasta ahora</h3>
      <p class="muted" style="font-size:13.5px">Las piezas aprobadas son tu propio código. ${completo ? "" : "Las pendientes llevan una versión provisional, así puedes descargarlo y seguir en tu IDE cuando quieras."}</p>
      <div class="code proyecto"><pre>${hl(codigo, "python")}</pre></div></div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn sun" id="demo" ${completo ? "" : "disabled"}>${completo ? "Ejecutar la demo" : "Demo: completa todas las piezas"}</button>
      <button class="btn" id="zip">Descargar .zip para tu IDE</button>
      <button class="btn ghost" id="copiar">Copiar código</button></div>
    <p class="muted motor-msg" style="font-size:13px;margin-top:8px">${motorTexto()}</p>
    <div id="demo-out"></div>`,
  sh => {
    sh.querySelector("#zip").onclick = async () => {
      const carpeta = P.archivo.replace(/\.py$/, "");
      await descargar(carpeta + ".zip", zipear([[carpeta + "/" + P.archivo, codigo], [carpeta + "/README.md", readmeProyecto(lv)]]));
    };
    sh.querySelector("#copiar").onclick = async () => {
      try { await navigator.clipboard.writeText(codigo); toast("Código copiado"); } catch (e) { toast("No se pudo copiar en este navegador"); }
    };
    const db = sh.querySelector("#demo");
    if (db) db.onclick = async () => {
      const out = sh.querySelector("#demo-out"); db.disabled = true; db.textContent = "Ejecutando…";
      out.innerHTML = `<p class="muted">Preparando el motor de Python…</p>`;
      try {
        await cargarMotor();
        const r = JSON.parse(window.pyEvaluar(codigo + "\n\ndemo()\n", "", ""));
        if (r.error) out.innerHTML = `<div class="errbox"><b>✘ La demo se detuvo</b><p><code>${esc(r.error[0])}</code>: ${esc(r.error[1])}</p><p>${esc(EXPLICA[r.error[0]] || "")}</p></div>`;
        else {
          out.innerHTML = `<p class="muted" style="margin:10px 0 4px">Salida de tu proyecto:</p><div class="out"><pre>${esc(r.salida.replace(/\s+$/, ""))}</pre></div>
            <div class="cuaderno" style="margin-top:10px">📓 ¡Tu proyecto funciona! Completa la <i>Plantilla de proyecto</i> del Cuadernillo: qué hace, qué aprendiste y qué le agregarías.</div>`;
          if (!S.demo[lv.id]) { S.demo[lv.id] = true; gain(50, "proyecto funcionando"); }
        }
      } catch (e) {
        out.innerHTML = `<div class="errbox"><b>El motor de Python no está disponible en este navegador.</b><p>Descarga el .zip y ejecuta el proyecto en tu IDE con <code>python ${esc(P.archivo)}</code>.</p></div>`;
      }
      db.disabled = false; db.textContent = "Ejecutar la demo";
    };
  });
}

/* ───────── eventos de las vistas ───────── */
function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openLesson(b.dataset.open));
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  v.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => { const [s, m] = b.dataset.mod.split("|"); openModule(s, +m); });
  v.querySelectorAll("[data-route]").forEach(b => b.onclick = () => openRoute(b.dataset.route));
  v.querySelectorAll("[data-proy]").forEach(b => b.onclick = () => openProyecto(+b.dataset.proy));
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = () => b.dataset.act === "deg" ? openDeg() : openTest());
  v.querySelectorAll("[data-fus]").forEach(b => b.onclick = () => { S.fus[b.dataset.fus] = true; gain(50, "fusión lograda"); render(); });
  if (tab === "inicio"){
    const dp = dailyPick();
    v.querySelectorAll("[data-daily]").forEach(b => b.onclick = () => { const ok = +b.dataset.daily === dp.l.quiz.a;
      S.daily[today()] = ok ? "ok" : "no";
      v.querySelectorAll("[data-daily]").forEach(o => { o.disabled = true; if (+o.dataset.daily === dp.l.quiz.a) o.classList.add("ok"); });
      if (!ok) b.classList.add("bad"); $("#daily-fb").innerHTML = (ok ? "<b>¡Bien!</b> " : "<b>Esta vez no.</b> ") + esc(dp.l.quiz.x);
      ok ? gain(30, "reto del día") : (touchDay(), save()); });
    $("#nm-save").onclick = () => { S.name = $("#nm").value.trim(); save(); render(); };
    bindTarjetaApp();
    $("#reset").onclick = () => { if (confirm("Se borrarán tu XP, lecciones, rutas, insignias y diario de este navegador. ¿Continuar?")) { S = fresh(); save(); render(); toast("Progreso reiniciado"); } };
  }
  if (tab === "rutas"){
    $("#total").onclick = () => { S.total = !S.total; save(); render(); toast(S.total ? "Modo Pythonista Total activado" : "Modo Total desactivado"); };
    const pr = $("#pr"), sc = $("#sc");
    if (pr) pr.onchange = () => { if (pr.value && pr.value === S.secundaria) { $("#pick-msg").textContent = "La ruta principal y la secundaria deben ser distintas."; pr.value = S.principal; return; }
      S.principal = pr.value; save(); toast(pr.value ? `${ROUTE[pr.value].t} es tu ruta principal` : "Ruta principal quitada"); render(); };
    if (sc) sc.onchange = () => { if (sc.value && sc.value === S.principal) { $("#pick-msg").textContent = "La ruta secundaria debe ser distinta de la principal."; sc.value = S.secundaria; return; }
      S.secundaria = sc.value; save(); render(); };
  }
  if (tab === "diario"){
    $("#d-save").onclick = () => { const g = id => $("#"+id).value.trim();
      if (!g("d-code") && !g("d-goal")) { $("#d-msg").textContent = "Escribe al menos el objetivo o el código para guardar la entrada."; return; }
      S.diary.push({date: g("d-date") || today(), lesson: g("d-les"), goal: g("d-goal"), code: $("#d-code").value.replace(/\s+$/, ""), exp: g("d-exp"), real: g("d-real"),
        res: (document.querySelector('input[name="d-res"]:checked') || {}).value || "1", err: g("d-err"), fix: g("d-fix"), learn: g("d-learn")});
      gain(10, "entrada en el diario"); render(); };
    v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (confirm("¿Borrar esta entrada?")) { S.diary.splice(+b.dataset.del, 1); save(); render(); } });
    v.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { const e = S.diary[+b.dataset.copy];
      const txt = `Fecha: ${e.date}\nObjetivo: ${e.goal}\n\n${e.code}\n\nSalida esperada: ${e.exp}\nSalida real: ${e.real}\nError: ${e.err}\nSolución: ${e.fix}\nAprendí: ${e.learn}`;
      try { await navigator.clipboard.writeText(txt); toast("Entrada copiada"); } catch(err) { toast("No se pudo copiar en este navegador"); } });
  }
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
go("inicio");
</script>
