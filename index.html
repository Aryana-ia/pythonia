<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pythonia: aprende Python jugando</title>
<meta name="description" content="Aprende Python desde cero en español: lecciones, prácticas que se corrigen solas y un proyecto real por nivel.">
<meta name="theme-color" content="#0E3B43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pythonia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --selva:#0E3B43; --hoja:#2F8F6B; --sol:#F2C14E; --coral:#E4572E;
  --bg:#FBFCF8; --surface:#FFFFFF; --surface2:#EEF3F0; --ink:#13232B; --muted:#5B6B73; --line:#D6DFDA;
  --code-bg:#F1F4F2; --out-bg:#1E2D35; --out-ink:#E8F1EC;
  --k:#7B2CBF; --s:#2A7A4F; --c:#8A9A92; --n:#C2410C; --b:#2A6F97;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --text:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A2A30; --surface:#0F363D; --surface2:#14424A; --ink:#E9F2EE; --muted:#9DB3AE; --line:#24525A;
    --code-bg:#0C3036; --out-bg:#06191C; --k:#C9A2F0; --s:#7FD6A4; --c:#7E9A95; --n:#F4A261; --b:#86C5F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0A2A30; --surface:#0F363D; --surface2:#14424A; --ink:#E9F2EE; --muted:#9DB3AE; --line:#24525A;
  --code-bg:#0C3036; --out-bg:#06191C; --k:#C9A2F0; --s:#7FD6A4; --c:#7E9A95; --n:#F4A261; --b:#86C5F0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px;border-radius:6px}
main{max-width:720px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:.4em 0 .8em}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:.08em .35em;border-radius:4px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--selva);color:#fff}
.btn.sun{background:var(--sol);color:#13232B}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] .ic{transform:translateY(-1px)}

/* inicio */
.hello{margin:6px 0 18px}
.rank{background:var(--selva);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.rank::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--sol);opacity:.95}
.rank .lvl{font-family:var(--display);font-size:26px;font-weight:800;position:relative;z-index:1}
.rank .sub{opacity:.85;position:relative;z-index:1}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:14px 0 6px;position:relative;z-index:1}
.bar>i{display:block;height:100%;background:var(--sol);border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card.daily{border:2px solid var(--sol)}
.section-t{margin:26px 0 10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.badge .ic{font-size:28px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border-style:solid;color:var(--ink)}
.badge.on .ic{filter:none;opacity:1}
.res li{margin:6px 0}

/* mapa serpiente */
.lvl-head{border-radius:18px;padding:16px 18px;color:#fff;margin:26px 0 4px}
.lvl-head h2{font-size:24px}
.lvl-head .meta{opacity:.9;font-size:14px}
.trail{position:relative;margin:0 auto 10px}
.trail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:150px;padding:0}
.node .dot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);
  border:4px solid var(--lc);box-shadow:0 5px 0 var(--lc);position:relative}
.node.done .dot{background:var(--lc)}
.node.done .dot::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--sol);
  color:#13232B;font-size:14px;font-weight:700;display:grid;place-items:center}
.node .lab{margin-top:8px;background:var(--bg);padding:3px 10px 4px;border-radius:10px;font-size:13.5px;line-height:1.25;text-align:center;font-weight:700}
.node .lab small{display:block;font-weight:400;color:var(--muted)}
.node.next .dot::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--sol);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.proj{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px dashed var(--lc);border-radius:16px;padding:14px;margin:6px 0 10px}
.proj .ic{font-size:26px}

/* lección */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet header{position:sticky;top:0;z-index:2;background:var(--lc);color:#fff;padding:12px 18px}
.sheet header .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sheet header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
.sheet .body{max-width:720px;margin:0 auto;padding:22px 18px 60px}
.sheet .big{font-size:44px}
.sheet h1{font-size:clamp(26px,6.5vw,36px);margin:4px 0 14px}
.blk{margin:22px 0}
.blk h3{margin-bottom:8px}
pre{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre;overflow-x:auto}
.code{background:var(--code-bg);border-radius:14px;padding:14px 16px;overflow-x:auto;border:1px solid var(--line)}
.code .k{color:var(--k);font-weight:600}.code .s{color:var(--s)}.code .c{color:var(--c);font-style:italic}.code .n{color:var(--n)}.code .b{color:var(--b)}
.out{background:var(--out-bg);color:var(--out-ink);border-radius:14px;padding:14px 16px;overflow-x:auto}
.predict{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.tips{background:color-mix(in srgb,var(--sol) 22%,var(--surface));border-left:5px solid var(--sol);border-radius:12px;padding:12px 16px}
.tips ul{margin:6px 0 0;padding-left:20px}
.ex{border-left:5px solid var(--lc);background:var(--surface);border-radius:12px;padding:12px 16px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:var(--mono);font-size:14px}
.opt.ok{border-color:var(--hoja);background:color-mix(in srgb,var(--hoja) 16%,var(--surface))}
.opt.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surface))}
.qtext{white-space:pre-wrap;font-weight:700}
.fb{margin-top:10px;font-size:15px}
.finish{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}

/* rutas */
details.track{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.track summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.track summary::-webkit-details-marker{display:none}
details.track .ic{font-size:28px}
details.track .tbody{padding:0 16px 16px}
details.track ol{margin:6px 0 10px;padding-left:22px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-left:auto;white-space:nowrap}

/* diario */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
textarea.mono{font-family:var(--mono);font-size:13.5px;min-height:130px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{font-weight:400;margin:0;display:flex;gap:6px;align-items:center;background:var(--surface2);padding:8px 12px;border-radius:99px;cursor:pointer}
.radios input{width:auto}
.entry{border-left:5px solid var(--hoja)}
.entry.r2{border-left-color:var(--sol)}.entry.r3{border-left-color:var(--coral)}
.entry pre{background:var(--code-bg);padding:10px;border-radius:10px;margin:8px 0;font-size:12.5px}
.empty{text-align:center;padding:26px;border:2px dashed var(--line);border-radius:18px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--sol);color:#13232B;font-weight:700;padding:10px 18px;border-radius:99px;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<style>
/* ── v2: árbol, ramas, módulos, degustación, test ── */
.branch-t{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--display);font-weight:700;font-size:18px}
.branch-t::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--lc,var(--hoja))}
.mods{display:grid;gap:10px;margin-bottom:8px}
.mod{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);
  border-left:6px solid var(--rc);border-radius:14px;padding:12px 14px;cursor:pointer}
.mod .ic{font-size:24px}
.mod .tx{flex:1;min-width:0}
.mod .tx b{display:block}
.mod .tx small{color:var(--muted);font-size:13px}
.mod.locked{opacity:.72;border-style:dashed;border-left-style:solid}
.mod .st{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.mod.done .st{background:var(--sol);color:#13232B}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.ok{border-color:var(--hoja);background:color-mix(in srgb,var(--hoja) 14%,var(--surface))}
.lens{border:2px solid var(--rc);border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--rc) 9%,var(--surface));margin-bottom:10px}
.lens .who{font-weight:700;font-size:14px;color:var(--rc)}
:root[data-theme="dark"] .lens .who{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lens .who{color:var(--ink)}}
.discover{border:2px solid var(--sol);background:color-mix(in srgb,var(--sol) 14%,var(--surface))}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--hoja)}.dots i.no{background:var(--coral)}.dots i.cur{outline:2px solid var(--sol);outline-offset:2px}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:12px 0}
.score .b{grid-column:1 / -1}
.score .b{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.score .b>i{display:block;height:100%;background:var(--rc)}
.season{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--surface)}
.season.now{border:2px solid var(--sol)}
.rchip{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:5px 11px;font-size:13px;margin:3px 4px 3px 0;
  background:color-mix(in srgb,var(--rc) 14%,var(--surface));border:1.5px solid var(--rc)}
.rchip.soon{border-style:dashed;opacity:.7}
.toggle{display:flex;gap:12px;align-items:center;justify-content:space-between}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--hoja)}.switch[aria-checked="true"]::after{left:25px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.pick{grid-template-columns:1fr}}
.boss{border:2px solid var(--rc);border-radius:16px;padding:14px;background:var(--surface);margin-bottom:10px}
.req{list-style:none;padding:0;margin:6px 0}
.req li{margin:4px 0}

/* ── prácticas evaluables y proyecto ── */
.prac{border:2px solid var(--lc,var(--hoja));border-radius:18px;padding:16px;background:var(--surface)}
.prac h3{margin-top:0}
.pill.pieza{display:inline-block;margin:0 0 8px}
.enun ul{padding-left:20px;margin:6px 0}
.editor{font-family:var(--mono);font-size:16px;line-height:1.5;min-height:240px;tab-size:4;background:var(--code-bg);white-space:pre;overflow:auto}
@media (min-width:700px){.editor{font-size:14px}}
details.ctx,details.fondo{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;background:var(--surface)}
details.ctx summary,details.fondo summary{cursor:pointer;font-weight:700}
details.fondo h4{margin:14px 0 6px}
ul.errs{padding-left:18px}ul.errs li{margin:6px 0}
.pista{background:color-mix(in srgb,var(--sol) 16%,var(--surface));border-radius:12px;padding:10px 12px;margin-top:8px}
.okbox{border:2px solid var(--hoja);background:color-mix(in srgb,var(--hoja) 10%,var(--surface));border-radius:14px;padding:12px 14px;margin-top:12px}
.errbox{border:2px solid var(--coral);background:color-mix(in srgb,var(--coral) 9%,var(--surface));border-radius:14px;padding:12px 14px;margin-top:12px}
.errbox p{margin:.4em 0}
.solbox{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.casos{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.casos ul{list-style:none;padding:0;margin:10px 0 0}
.casos li{padding:6px 0;border-top:1px solid var(--line)}
.casos li.ok{color:var(--muted)}
.casos li.no{font-weight:700}
.casos .det{font-weight:400;color:var(--muted);font-size:14px;margin:2px 0 0 18px}
.bar.mini{height:8px;margin:8px 0 4px}
.cuaderno{background:color-mix(in srgb,var(--sol) 14%,var(--surface));border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer}
.code.proyecto{max-height:420px;overflow:auto}
.btn:disabled{opacity:.55;cursor:not-allowed}
.res a{color:var(--hoja);text-decoration-thickness:1.5px;text-underline-offset:2px}
.sheet header button{white-space:nowrap;flex:none}
.sheet header span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<main id="view" tabindex="-1"></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="inicio"><span class="ic" aria-hidden="true">🏠</span>Inicio</button>
    <button data-tab="arbol"><span class="ic" aria-hidden="true">🌳</span>Árbol</button>
    <button data-tab="rutas"><span class="ic" aria-hidden="true">🧭</span>Rutas</button>
    <button data-tab="diario"><span class="ic" aria-hidden="true">📓</span>Diario</button>
  </div>
</nav>

<script>
const D = {"levels": [{"id": 1, "nombre": "Explorador", "nivel": "Principiante", "semanas": 6, "color": "#2F8F6B", "lema": "De cero a tu primer programa útil.", "objetivo": "Entender cómo piensa Python: valores, decisiones, repeticiones y funciones. Al terminar podrás escribir programas pequeños que conversan con el usuario.", "proyecto": {"t": "Adivina el número", "desc": "Un juego de consola donde la computadora elige un número secreto y el jugador intenta adivinarlo con pistas.", "pasos": ["Importa random y genera un número entre 1 y 100 con random.randint.", "Usa un bucle while para pedir intentos con input() y conviértelos a int dentro de try/except.", "Da pistas: 'más alto' o 'más bajo'. Cuenta los intentos.", "Al acertar, muestra los intentos usados y pregunta si quiere jugar otra vez.", "Extra: niveles de dificultad (rango y número máximo de intentos)."]}, "proyecto_app": {"archivo": "adivina_el_numero.py", "titulo": "Adivina el número", "intro": "Tu primer programa completo. Cada lección del Nivel 1 agrega un capítulo: primero la bienvenida, luego los cálculos, las pistas, una computadora que juega sola y, al final, las funciones y la protección contra errores que hacen funcionar el juego de verdad.", "final": "\n# ═══════════════ Motor del juego (escrito por Pythonia, usa tus funciones) ═══════════════\nimport random\n\n\ndef demo():\n    \"\"\"Partida automática: muestra tu juego funcionando sin usar el teclado.\"\"\"\n    print(\"── Tus capítulos ──\")\n    for capitulo in CAPITULOS:\n        print(\"\\n▶\", capitulo.__doc__)\n        capitulo()\n    print(\"\\n── Partida de demostración (el secreto es 37) ──\")\n    intentos = 0\n    for texto in [\"50\", \"hola\", \"200\", \"25\", \"37\"]:\n        numero = pedir_numero(texto)\n        if numero is None:\n            print(f\"'{texto}' no vale: escribe un número del 1 al 100\")\n            continue\n        intentos += 1\n        pista = evaluar(37, numero)\n        print(f\"{numero} -> {pista}\")\n        if pista == \"¡Correcto!\":\n            print(mensaje_final(intentos))\n            break\n\n\ndef jugar():\n    \"\"\"Partida real con teclado: ejecútala en tu IDE.\"\"\"\n    secreto = random.randint(1, 100)\n    print(\"=== ADIVINA EL NÚMERO ===\")\n    intentos = 0\n    while intentos < 7:\n        numero = pedir_numero(input(\"Tu número: \"))\n        if numero is None:\n            print(\"Escribe un número entero del 1 al 100.\")\n            continue\n        intentos += 1\n        pista = evaluar(secreto, numero)\n        print(pista)\n        if pista == \"¡Correcto!\":\n            print(mensaje_final(intentos))\n            return\n    print(f\"Se acabaron los intentos. Era el {secreto}.\")\n\n\nif __name__ == \"__main__\":\n    opcion = input(\"¿Ver la demo (d) o jugar (j)? \").strip().lower()\n    if opcion == \"d\":\n        demo()\n    else:\n        jugar()\n"}, "lecciones": [{"t": "Tu primer programa", "e": "👋", "teoria": ["Un programa es una lista de instrucciones que la computadora ejecuta de arriba hacia abajo. En Python, la instrucción más básica es `print()`, que muestra en pantalla lo que le pases.", "Los comentarios empiezan con `#` y Python los ignora: sirven para explicarle a otras personas (y a tu yo del futuro) qué hace el código.", "`print()` acepta varios valores separados por comas. Por defecto los une con un espacio, pero puedes cambiar el separador con `sep` y el final de línea con `end`."], "code": "# Mi primer programa\nprint(\"¡Hola, Pythonia!\")\nprint(\"Python\", \"es\", \"genial\", sep=\"-\")\nprint(\"Sin salto\", end=\" ... \")\nprint(\"¡y sigo en la misma línea!\")", "tips": ["Escribe y ejecuta código todos los días, aunque sean 10 minutos.", "Si algo falla, lee el mensaje de error completo: casi siempre te dice qué pasó y en qué línea."], "ejercicio": "Escribe un programa que imprima tu nombre, tu ciudad y tu comida favorita, cada uno en una línea, y luego los tres juntos separados por ' | '.", "quiz": {"q": "print(\"A\", \"B\", sep=\"\") muestra…", "o": ["AB", "A,B", "A B", "Error"], "a": 0, "x": "sep define qué va entre los valores. Con sep=\"\" no se pone nada."}, "out": "¡Hola, Pythonia!\nPython-es-genial\nSin salto ... ¡y sigo en la misma línea!", "a_fondo": ["Python lee tu archivo de arriba hacia abajo, una línea a la vez. Cada línea es una instrucción. Si una línea tiene un error, el programa se detiene ahí y te avisa en qué línea fue: por eso conviene escribir poco, ejecutar y seguir.", "`print()` es una función: un nombre seguido de paréntesis. Lo que va dentro de los paréntesis son sus argumentos. Puedes pasarle varios valores separados por comas y los imprime separados por un espacio. Ese espacio se puede cambiar con `sep`, y el salto de línea final con `end`.", "Los textos van entre comillas, dobles o simples, siempre del mismo tipo al abrir y al cerrar. Lo que está entre comillas Python no lo interpreta: lo muestra tal cual. Todo lo que va después de `#` es un comentario: Python lo ignora y sirve para explicar tu código a otras personas (y a ti dentro de un mes)."], "paso": ["`# Mi primer programa` es un comentario: no se ejecuta.", "`print(\"¡Hola, Pythonia!\")` muestra el texto y salta a la línea siguiente.", "`sep=\"-\"` cambia el separador entre los tres textos: el espacio pasa a ser un guion.", "`end=\" ... \"` reemplaza el salto de línea final, así que el siguiente `print` continúa en la misma línea."], "errores": [["SyntaxError: unterminated string literal", "Abriste comillas y no las cerraste. Revisa que cada texto tenga sus dos comillas."], ["NameError: name 'Print' is not defined", "Python distingue mayúsculas de minúsculas: la función se llama `print`, en minúscula."]], "practica": {"titulo": "La bienvenida del juego", "pieza": "Capítulo 1: la bienvenida", "modo": "capitulo", "contexto": "", "mostrar": [], "enunciado": "Tu proyecto del Nivel 1 es el juego **Adivina el número**. Empieza por la pantalla de bienvenida: imprime exactamente estas cuatro líneas. La última debe hacerse con UN solo `print` que use `sep=\" | \"`.\n\n=== ADIVINA EL NÚMERO ===\nPensé un número del 1 al 100.\n¿Podrás descubrirlo?\nMás alto | Más bajo | ¡Correcto!", "plantilla": "# Capítulo 1 de tu proyecto: la bienvenida del juego.\n# 1) El título (ya está hecho como ejemplo):\nprint(\"=== ADIVINA EL NÚMERO ===\")\n# 2) Imprime:  Pensé un número del 1 al 100.\n\n# 3) Imprime:  ¿Podrás descubrirlo?\n\n# 4) Imprime las tres pistas en UNA línea usando sep=\" | \"\n", "pruebas": "\nL = lineas(SALIDA)\ncaso(\"La línea 1 es el título\", lambda: L[0] if L else \"(nada)\", \"=== ADIVINA EL NÚMERO ===\", \"Copia el título tal cual, con tres signos = a cada lado.\")\ncaso(\"La línea 2 presenta el desafío\", lambda: L[1] if len(L) > 1 else \"(nada)\", \"Pensé un número del 1 al 100.\", \"Revisa tildes, espacios y el punto final.\")\ncaso(\"La línea 3 hace la pregunta\", lambda: L[2] if len(L) > 2 else \"(nada)\", \"¿Podrás descubrirlo?\", \"No olvides los dos signos de pregunta: ¿ al inicio y ? al final.\")\ncaso(\"La línea 4 muestra las pistas separadas por ' | '\", lambda: L[3] if len(L) > 3 else \"(nada)\", \"Más alto | Más bajo | ¡Correcto!\", \"Pasa los tres textos separados por comas y agrega sep=\\\" | \\\".\")\ncaso(\"Usaste el parámetro sep\", lambda: \"sep\" in CODIGO, True, \"La cuarta línea debe salir de un solo print con sep=\\\" | \\\", no escribiendo las barras a mano.\")\ncaso(\"El programa imprime exactamente 4 líneas\", lambda: len(L), 4, \"Sobra o falta algún print.\")\n", "solucion": "print(\"=== ADIVINA EL NÚMERO ===\")\nprint(\"Pensé un número del 1 al 100.\")\nprint(\"¿Podrás descubrirlo?\")\nprint(\"Más alto\", \"Más bajo\", \"¡Correcto!\", sep=\" | \")\n", "pistas": ["Cada `print` produce una línea nueva.", "Para la línea 4: `print(\"Más alto\", \"Más bajo\", \"¡Correcto!\", sep=\" | \")`."], "explicacion": "Tres `print` simples y uno con tres argumentos. Por defecto `print` separa los argumentos con un espacio; con `sep=\" | \"` usa la barra rodeada de espacios."}}, {"t": "Variables y tipos de datos", "e": "📦", "teoria": ["Una variable es un nombre que apunta a un valor. Se crea con `=`: `edad = 30`. No hace falta declarar el tipo; Python lo deduce.", "Los tipos básicos son: `int` (enteros), `float` (decimales), `str` (texto) y `bool` (`True`/`False`). Con `type()` puedes preguntar el tipo de cualquier valor.", "Las f-strings (`f\"...\"`) permiten insertar variables dentro de un texto usando llaves: es la forma moderna y más legible de armar mensajes."], "code": "nombre = \"Luna\"\nedad = 30\naltura = 1.65\nestudia = True\n\nprint(type(edad), type(altura), type(nombre), type(estudia))\nprint(f\"{nombre} tiene {edad} años y mide {altura} m\")", "tips": ["Usa nombres descriptivos en minúsculas con guion bajo: `precio_total`, no `pt`.", "Python distingue mayúsculas: `Edad` y `edad` son variables distintas."], "ejercicio": "Crea variables para un producto (nombre, precio, cantidad, disponible) e imprime una ficha usando una f-string.", "quiz": {"q": "¿Qué tipo devuelve type(3 / 2)?", "o": ["str", "int", "bool", "float"], "a": 3, "x": "La división con / siempre devuelve float en Python 3, aunque el resultado sea exacto."}, "out": "<class 'int'> <class 'float'> <class 'str'> <class 'bool'>\nLuna tiene 30 años y mide 1.65 m", "a_fondo": ["Una variable es una etiqueta que pegas a un valor. `edad = 30` no significa \"edad es igual a 30\" como en matemática, sino \"guarda 30 y llámalo edad\". Si después escribes `edad = 31`, la etiqueta se mueve al nuevo valor.", "Cada valor tiene un tipo: `int` (enteros), `float` (con decimales), `str` (texto) y `bool` (`True` o `False`). El tipo decide qué puedes hacer: sumar dos `int` da un número, pero sumar dos `str` las pega. `type(x)` te dice el tipo de cualquier valor.", "Las f-strings son la forma moderna de mezclar texto y variables: pon una `f` antes de las comillas y escribe las variables entre llaves, `f\"Tengo {edad} años\"`. Dentro de las llaves puede ir cualquier expresión, como `{edad + 1}`.", "Elige nombres que expliquen qué guardan: `precio_total` es mejor que `pt` o `x`. En Python se usa snake_case: minúsculas y palabras separadas por guion bajo. Un nombre no puede empezar con un número ni tener espacios."], "paso": ["Se crean cuatro variables, una de cada tipo básico.", "`type(edad)` devuelve `<class 'int'>`: el tipo del valor guardado.", "La f-string reemplaza `{nombre}`, `{edad}` y `{altura}` por sus valores."], "errores": [["NameError: name 'edda' is not defined", "Escribiste mal el nombre de una variable o la usaste antes de crearla."], ["TypeError: can only concatenate str (not \"int\") to str", "Intentaste sumar texto y número con `+`. Usa una f-string o convierte con `str()`."]], "practica": {"titulo": "La configuración del juego", "pieza": "Capítulo 2: la configuración", "modo": "capitulo", "contexto": "", "mostrar": [], "enunciado": "Crea las variables de configuración del juego: `nombre_juego` con el texto \"Adivina el número\", `minimo` con 1, `maximo` con 100, `intentos_max` con 7 y `con_pistas` con `True`. Después imprime, usando una f-string con esas variables:\n\nAdivina el número: del 1 al 100 en 7 intentos", "plantilla": "# Capítulo 2: la configuración del juego.\nnombre_juego = \"Adivina el número\"\n# Crea minimo, maximo e intentos_max (números enteros, sin comillas)\n\n# Crea con_pistas (un booleano)\n\n# Imprime con una f-string:  Adivina el número: del 1 al 100 en 7 intentos\n", "pruebas": "\ncaso(\"nombre_juego guarda el texto correcto\", lambda: var(NS, \"nombre_juego\"), \"Adivina el número\")\ncaso(\"minimo vale 1 y es un número entero\", lambda: (var(NS, \"minimo\"), type(NS[\"minimo\"]).__name__), (1, \"int\"), \"Escribe 1 sin comillas: con comillas sería texto (str).\")\ncaso(\"maximo vale 100 y es entero\", lambda: (var(NS, \"maximo\"), type(NS[\"maximo\"]).__name__), (100, \"int\"), \"Sin comillas: maximo = 100.\")\ncaso(\"intentos_max vale 7 y es entero\", lambda: (var(NS, \"intentos_max\"), type(NS[\"intentos_max\"]).__name__), (7, \"int\"))\ncaso(\"con_pistas es el booleano True\", lambda: var(NS, \"con_pistas\") is True, True, \"True va sin comillas y con T mayúscula.\")\ncaso(\"Imprime la frase de configuración\", lambda: lineas(SALIDA)[-1] if SALIDA.strip() else \"(nada)\", \"Adivina el número: del 1 al 100 en 7 intentos\", \"Usa las variables dentro de llaves: {minimo}, {maximo}...\")\ncaso(\"Usaste una f-string\", lambda: 'f\"' in CODIGO or \"f'\" in CODIGO, True, \"Pon una f antes de las comillas del texto.\")\n", "solucion": "nombre_juego = \"Adivina el número\"\nminimo = 1\nmaximo = 100\nintentos_max = 7\ncon_pistas = True\nprint(f\"{nombre_juego}: del {minimo} al {maximo} en {intentos_max} intentos\")\n", "pistas": ["Un número entero se escribe sin comillas: `minimo = 1`.", "`print(f\"{nombre_juego}: del {minimo} al ...\")`"], "explicacion": "Cada variable guarda un valor con su tipo natural. La f-string arma la frase leyendo las variables, así que si mañana cambias `maximo = 500`, el mensaje se actualiza solo."}}, {"t": "Operadores", "e": "➗", "teoria": ["Aritméticos: `+ - * /`, más tres muy útiles: `//` (división entera), `%` (resto o módulo) y `**` (potencia).", "Comparación: `== != > < >= <=` devuelven siempre un `bool`. Ojo: `=` asigna y `==` compara.", "Lógicos: `and`, `or`, `not` combinan condiciones. Python evalúa en cortocircuito: en `a and b`, si `a` es falso, ni mira `b`."], "code": "print(7 / 2, 7 // 2, 7 % 2, 2 ** 3)\nprint(5 > 3 and 2 > 4)\nprint(5 > 3 or 2 > 4)\nprint(not False)\nprint(10 == 10.0)", "tips": ["`n % 2 == 0` es la forma clásica de saber si un número es par.", "Usa paréntesis para dejar clara la prioridad, aunque no sean obligatorios."], "ejercicio": "Dado un total de 125 minutos, calcula cuántas horas y minutos son usando // y %.", "quiz": {"q": "¿Cuánto vale 10 % 3?", "o": ["3.33", "1", "3", "0"], "a": 1, "x": "% devuelve el resto: 10 = 3×3 + 1."}, "out": "3.5 3 1 8\nFalse\nTrue\nTrue\nTrue", "a_fondo": ["Python respeta el orden matemático: primero `**`, después `*`, `/`, `//` y `%`, y al final `+` y `-`. Ante la duda, usa paréntesis: hacen el código más claro y nunca están de más.", "Hay dos divisiones. `/` siempre devuelve un `float` (`10 / 2` da `5.0`). `//` devuelve la parte entera (`7 // 2` da `3`). Y `%` devuelve el resto (`7 % 2` da `1`): es la herramienta para saber si un número es par (`n % 2 == 0`) o para convertir minutos en horas.", "Los operadores de comparación (`==`, `!=`, `<`, `>`, `<=`, `>=`) no calculan números: responden preguntas y devuelven `True` o `False`. Cuidado: `=` guarda un valor y `==` compara dos valores.", "Los operadores lógicos combinan respuestas: `and` es verdadero solo si ambas partes lo son, `or` si al menos una lo es, y `not` invierte. `abs(x)` es una función integrada que devuelve el valor sin signo: `abs(-5)` da `5`."], "paso": ["`7 / 2` da 3.5; `7 // 2` da 3; `7 % 2` da 1; `2 ** 3` da 8.", "`5 > 3 and 2 > 4` es False porque la segunda parte es falsa.", "`5 > 3 or 2 > 4` es True porque basta una parte verdadera.", "`10 == 10.0` es True: compara valores, no tipos."], "errores": [["ZeroDivisionError: division by zero", "Dividiste por cero. Revisa que el divisor no pueda valer 0, o protégelo con un `if`."], ["SyntaxError al escribir if x = 5", "Para comparar se usa `==`. Un solo `=` es para asignar."]], "practica": {"titulo": "Los cálculos del juego", "pieza": "Capítulo 3: los cálculos", "modo": "capitulo", "contexto": "minimo = 1\nmaximo = 100\nsecreto = 42\nintento = 30", "mostrar": ["cantidad", "mitad", "distancia", "es_par", "acerto"], "enunciado": "Ya existen las variables `minimo`, `maximo`, `secreto` e `intento` (el evaluador probará varios valores distintos). Calcula:\n\n• `cantidad`: cuántos números posibles hay entre minimo y maximo, ambos incluidos.\n• `mitad`: el número del medio, con división entera.\n• `distancia`: qué tan lejos está el intento del secreto, sin signo.\n• `es_par`: True si el secreto es par.\n• `acerto`: True si el intento es igual al secreto.", "plantilla": "# Capítulo 3: los cálculos del juego.\n# Ya existen: minimo, maximo, secreto e intento.\n# 1) cantidad (ya está hecho como ejemplo):\ncantidad = maximo - minimo + 1\n# 2) mitad: (minimo + maximo) dividido con división entera //\n\n# 3) distancia: usa abs() para quitar el signo a secreto - intento\n\n# 4) es_par: el resto de dividir secreto por 2 es 0\n\n# 5) acerto: compara intento con secreto usando ==\n", "pruebas": "\nns, s = probar(minimo=1, maximo=100, secreto=42, intento=30)\ncaso(\"cantidad entre 1 y 100 es 100\", lambda: var(ns, \"cantidad\"), 100)\ncaso(\"mitad entre 1 y 100 es 50 (entero)\", lambda: var(ns, \"mitad\"), 50, \"Usa // para obtener un número entero.\")\ncaso(\"mitad es un int, no un float\", lambda: type(var(ns, \"mitad\")).__name__, \"int\", \"Con / el resultado es 50.0 (float); con // es 50.\")\ncaso(\"distancia entre 42 y 30 es 12\", lambda: var(ns, \"distancia\"), 12)\ncaso(\"42 es par\", lambda: var(ns, \"es_par\"), True, \"es_par = secreto % 2 == 0\")\ncaso(\"30 no acierta a 42\", lambda: var(ns, \"acerto\"), False)\nns, s = probar(minimo=10, maximo=20, secreto=13, intento=19)\ncaso(\"Entre 10 y 20 hay 11 números\", lambda: var(ns, \"cantidad\"), 11, \"Recuerda el + 1: ambos extremos cuentan.\")\ncaso(\"La mitad entre 10 y 20 es 15\", lambda: var(ns, \"mitad\"), 15)\ncaso(\"distancia entre 13 y 19 es 6\", lambda: var(ns, \"distancia\"), 6)\ncaso(\"13 no es par\", lambda: var(ns, \"es_par\"), False)\nns, s = probar(secreto=40, intento=55)\ncaso(\"distancia sin signo cuando el intento es mayor: 15\", lambda: var(ns, \"distancia\"), 15, \"abs(secreto - intento) devuelve 15, no -15.\")\nns, s = probar(secreto=7, intento=7)\ncaso(\"Si intento y secreto son iguales, acerto es True\", lambda: var(ns, \"acerto\"), True)\ncaso(\"... y la distancia es 0\", lambda: var(ns, \"distancia\"), 0)\n", "solucion": "cantidad = maximo - minimo + 1\nmitad = (minimo + maximo) // 2\ndistancia = abs(secreto - intento)\nes_par = secreto % 2 == 0\nacerto = intento == secreto\n", "pistas": ["Los paréntesis importan: `(minimo + maximo) // 2`.", "Una comparación ya es un booleano: `acerto = intento == secreto` guarda True o False."], "explicacion": "`//` da la mitad entera; `abs` elimina el signo, así la distancia es la misma si el intento se pasa o se queda corto. `secreto % 2 == 0` y `intento == secreto` son comparaciones: su resultado es directamente True o False."}}, {"t": "Cadenas de texto (strings)", "e": "🔤", "teoria": ["Un string es una secuencia de caracteres. Cada carácter tiene un índice que empieza en 0; los índices negativos cuentan desde el final (`-1` es el último).", "El slicing `s[inicio:fin]` extrae un trozo: incluye `inicio` y excluye `fin`. `s[::-1]` invierte el texto.", "Los strings tienen métodos: `.upper()`, `.lower()`, `.strip()`, `.replace()`, `.split()`, `.startswith()`… Son inmutables: los métodos devuelven un string nuevo, no modifican el original."], "code": "s = \"Pythonia\"\nprint(s[0], s[-1], s[0:3])\nprint(s.upper(), len(s))\nprint(s.replace(\"ia\", \"!\"))\nprint(s[::-1])\nprint(\"a,b,c\".split(\",\"))", "tips": ["`.strip()` es tu amigo al leer datos: elimina espacios y saltos de línea sobrantes.", "Para unir una lista de textos usa `\", \".join(lista)`."], "ejercicio": "Pide una frase y muestra: cantidad de caracteres, la frase en mayúsculas, la frase al revés y cuántas palabras tiene.", "quiz": {"q": "¿Qué devuelve \"hola\"[1:3]?", "o": ["\"ola\"", "\"ho\"", "\"ol\"", "\"hol\""], "a": 2, "x": "Incluye el índice 1 (o) y excluye el 3, así que toma o y l."}, "out": "P a Pyt\nPYTHONIA 8\nPython!\nainohtyP\n['a', 'b', 'c']", "a_fondo": ["Un string es una secuencia de caracteres, y cada carácter tiene una posición (índice) que empieza en 0. `s[0]` es el primero y `s[-1]` el último. Un rebanado (slice) `s[inicio:fin]` toma desde `inicio` hasta antes de `fin`; si omites uno de los dos, llega hasta el borde.", "Los strings son inmutables: ningún método los modifica, todos devuelven un string nuevo. Por eso `nombre.upper()` no cambia `nombre`; si quieres conservar el resultado, guárdalo: `nombre = nombre.upper()`.", "Los métodos más útiles para limpiar datos que escribe una persona: `strip()` quita espacios de los bordes, `lower()` y `upper()` cambian a minúsculas y mayúsculas, `title()` pone mayúscula inicial en cada palabra, `replace(a, b)` reemplaza y `split()` corta en una lista de palabras.", "Puedes encadenar métodos, porque cada uno devuelve un string: `\"  ana  \".strip().title()` primero limpia los espacios y luego da `\"Ana\"`. `len(s)` cuenta los caracteres, incluidos los espacios."], "paso": ["`s[0]` es 'P', `s[-1]` es 'a' y `s[0:3]` es 'Pyt' (posiciones 0, 1 y 2).", "`upper()` devuelve una copia en mayúsculas; `len(s)` cuenta 8 caracteres.", "`replace(\"ia\", \"!\")` cambia 'ia' por '!'.", "`s[::-1]` recorre al revés con paso -1.", "`split(\",\")` corta el texto en cada coma."], "errores": [["IndexError: string index out of range", "Pediste una posición que no existe. Un texto de 5 letras tiene índices del 0 al 4."], ["AttributeError: 'int' object has no attribute 'upper'", "Usaste un método de texto sobre un número. Revisa el tipo de la variable."]], "practica": {"titulo": "Los mensajes del juego", "pieza": "Capítulo 4: los mensajes", "modo": "capitulo", "contexto": "jugador_crudo = \"  ana  \"\nnumero_intento = 3\nintentos_max = 7", "mostrar": ["jugador", "mensaje", "inicial", "grito", "largo"], "enunciado": "El nombre llega desprolijo, con espacios y mayúsculas mezcladas, en `jugador_crudo`. Ya existen también `numero_intento` e `intentos_max`. Crea:\n\n• `jugador`: el nombre sin espacios en los bordes y con mayúscula inicial en cada palabra.\n• `mensaje`: \"Ana, intento 3 de 7\" (con los valores reales).\n• `inicial`: la primera letra de `jugador`.\n• `grito`: el mensaje en mayúsculas.\n• `largo`: la cantidad de caracteres de `jugador`.", "plantilla": "# Capítulo 4: los mensajes. Ya existen jugador_crudo, numero_intento e intentos_max.\n# 1) jugador: limpia con strip() y luego title()\njugador = jugador_crudo.strip()\n# 2) mensaje: una f-string como \"Ana, intento 3 de 7\"\n\n# 3) inicial: la letra en la posición 0 de jugador\n\n# 4) grito: el mensaje con upper()\n\n# 5) largo: usa len()\n", "pruebas": "\ncaso(\"jugador queda limpio: 'Ana'\", lambda: var(NS, \"jugador\"), \"Ana\", \"Encadena: jugador_crudo.strip().title()\")\ncaso(\"mensaje con los valores reales\", lambda: var(NS, \"mensaje\"), \"Ana, intento 3 de 7\", \"Respeta la coma y los espacios: f\\\"{jugador}, intento {numero_intento} de {intentos_max}\\\"\")\ncaso(\"inicial es 'A'\", lambda: var(NS, \"inicial\"), \"A\")\ncaso(\"grito está en mayúsculas\", lambda: var(NS, \"grito\"), \"ANA, INTENTO 3 DE 7\")\ncaso(\"largo de 'Ana' es 3\", lambda: var(NS, \"largo\"), 3, \"Si te dio 7, mediste jugador_crudo (con espacios) en lugar de jugador.\")\nns, s = probar(jugador_crudo=\"   luis PÉREZ \", numero_intento=5, intentos_max=10)\ncaso(\"Con '   luis PÉREZ ' el jugador es 'Luis Pérez'\", lambda: var(ns, \"jugador\"), \"Luis Pérez\", \"title() pone mayúscula inicial y minúsculas en el resto de cada palabra.\")\ncaso(\"... y el mensaje usa los valores nuevos\", lambda: var(ns, \"mensaje\"), \"Luis Pérez, intento 5 de 10\", \"No escribas números fijos: usa las variables.\")\ncaso(\"... la inicial es 'L'\", lambda: var(ns, \"inicial\"), \"L\")\ncaso(\"... y el largo es 10\", lambda: var(ns, \"largo\"), 10)\n", "solucion": "jugador = jugador_crudo.strip().title()\nmensaje = f\"{jugador}, intento {numero_intento} de {intentos_max}\"\ninicial = jugador[0]\ngrito = mensaje.upper()\nlargo = len(jugador)\n", "pistas": ["Los métodos se encadenan: `texto.strip().title()`.", "La primera posición es la 0: `jugador[0]`."], "explicacion": "Primero se limpia el dato (`strip` y `title`) y recién después se usa: así todo lo demás, incluido `largo`, trabaja sobre el nombre correcto. Es un hábito clave al procesar lo que escribe una persona."}}, {"t": "Entrada del usuario y conversiones", "e": "⌨️", "teoria": ["`input(\"mensaje\")` muestra un mensaje, espera a que el usuario escriba y devuelve lo escrito como `str`, siempre.", "Para hacer cuentas necesitas convertir: `int()`, `float()`. Para volver a texto: `str()`.", "Si el usuario escribe algo que no es número, `int()` lanza un error. En la lección de errores verás cómo manejarlo con elegancia."], "code": "edad = int(input(\"¿Tu edad? \"))   # el usuario escribe 20\nprint(f\"En 5 años tendrás {edad + 5}\")", "tips": ["Valida siempre la entrada del usuario: nunca confíes en que escribirá lo esperado.", "`input().strip()` evita problemas con espacios accidentales."], "ejercicio": "Crea una calculadora de propinas: pide el monto de la cuenta y el porcentaje, y muestra la propina y el total.", "quiz": {"q": "¿Qué tipo de dato devuelve input()?", "o": ["float", "depende de lo que escriba", "str", "int"], "a": 2, "x": "input() siempre devuelve str. Convertir es tu responsabilidad."}, "out": "¿Tu edad? 20\nEn 5 años tendrás 25", "a_fondo": ["`input()` siempre devuelve texto, aunque la persona escriba un número. Para hacer cuentas hay que convertir: `int(\"57\")` da el entero 57 y `float(\"3.5\")` da el decimal 3.5. Al revés, `str(57)` convierte un número en texto.", "Si olvidas convertir, Python no siempre da error: `\"57\" * 2` da `\"5757\"` (repite el texto) y `\"57\" + \"1\"` da `\"571\"` (los pega). Estos errores silenciosos son de los más difíciles de detectar, por eso conviene convertir apenas recibes el dato.", "`int()` tolera espacios en los bordes (`int(\" 57 \")` funciona), pero no acepta letras ni decimales: `int(\"hola\")` y `int(\"3.5\")` lanzan `ValueError`. En el Capítulo 11 aprenderás a atrapar ese error para que el programa no se caiga.", "En la práctica de esta lección el texto ya viene preparado en una variable, como si la persona lo hubiera escrito. En tu IDE lo reemplazarás por `texto = input(\"Tu número: \")`: la conversión es exactamente la misma."], "paso": ["`input(\"¿Tu edad? \")` muestra la pregunta y espera; devuelve lo escrito como texto.", "`int(...)` convierte ese texto en número entero.", "La f-string calcula `edad + 5` dentro de las llaves."], "errores": [["ValueError: invalid literal for int() with base 10: 'hola'", "Intentaste convertir algo que no es un número entero. Valida antes o usa try/except (lección 11)."], ["Resultado '5757' en lugar de 114", "Multiplicaste un texto. Convierte con `int()` antes de operar."]], "practica": {"titulo": "Convertir lo que escribe el jugador", "pieza": "Capítulo 5: la entrada del jugador", "modo": "capitulo", "contexto": "texto = \" 57 \"", "mostrar": ["intento", "doble", "siguiente", "resumen"], "enunciado": "En el juego real, el número llega desde `input()` y por eso es texto. Aquí ya existe la variable `texto` (por ejemplo \" 57 \"). Crea:\n\n• `intento`: el texto convertido a número entero.\n• `doble`: el intento multiplicado por 2.\n• `siguiente`: el intento más 1.\n• `resumen`: el texto \"Elegiste el 57\" (con el número real), uniendo con `+` y `str()`.", "plantilla": "# Capítulo 5: lo que escribe el jugador llega como TEXTO.\n# Ya existe la variable texto, por ejemplo \" 57 \".\n# 1) intento: convierte texto a entero con int()\n\n# 2) doble: intento por 2\n\n# 3) siguiente: intento más 1\n\n# 4) resumen: \"Elegiste el \" + el número convertido con str()\n", "pruebas": "\ncaso(\"intento es el número 57\", lambda: var(NS, \"intento\"), 57, \"intento = int(texto)\")\ncaso(\"intento es un int, no un texto\", lambda: type(var(NS, \"intento\")).__name__, \"int\", \"Si es str, te faltó int().\")\ncaso(\"doble de 57 es 114\", lambda: var(NS, \"doble\"), 114, \"Si obtuviste un texto repetido como ' 57  57 ', multiplicaste el texto en lugar del número.\")\ncaso(\"siguiente de 57 es 58\", lambda: var(NS, \"siguiente\"), 58)\ncaso(\"resumen dice 'Elegiste el 57'\", lambda: var(NS, \"resumen\"), \"Elegiste el 57\", \"\\\"Elegiste el \\\" + str(intento): fíjate en el espacio antes de cerrar las comillas.\")\nns, s = probar(texto=\"8\")\ncaso(\"Con '8': intento 8, doble 16, siguiente 9\", lambda: (var(ns, \"intento\"), var(ns, \"doble\"), var(ns, \"siguiente\")), (8, 16, 9))\nns, s = probar(texto=\"  100\")\ncaso(\"Con '  100' el resumen es 'Elegiste el 100'\", lambda: var(ns, \"resumen\"), \"Elegiste el 100\", \"Usa la variable, no un número fijo.\")\n", "solucion": "intento = int(texto)\ndoble = intento * 2\nsiguiente = intento + 1\nresumen = \"Elegiste el \" + str(intento)\n", "pistas": ["`int()` ignora los espacios de los bordes.", "Para unir texto y número con `+`, convierte el número: `str(intento)`."], "explicacion": "Convertir una sola vez, al principio, deja todo el resto del código trabajando con números de verdad. `str()` hace el camino inverso cuando necesitas pegar el número a un texto con `+` (con una f-string no haría falta)."}}, {"t": "Condicionales", "e": "🔀", "teoria": ["`if` ejecuta un bloque solo si la condición es verdadera. `elif` agrega más casos y `else` cubre todo lo demás. Python solo ejecuta el primer bloque cuya condición se cumpla.", "La indentación (4 espacios) no es estética: define qué líneas pertenecen a cada bloque.", "Valores 'falsy': `0`, `0.0`, `\"\"`, `[]`, `{}`, `None` y `False` se comportan como falso en un `if`. Todo lo demás es 'truthy'."], "code": "nota = 78\nif nota >= 90:\n    print(\"Excelente\")\nelif nota >= 70:\n    print(\"Aprobado\")\nelse:\n    print(\"A repasar\")\n\nmensaje = \"par\" if nota % 2 == 0 else \"impar\"\nprint(mensaje)", "tips": ["Ordena los `elif` del caso más específico al más general.", "El operador ternario `x if cond else y` es ideal para asignaciones cortas."], "ejercicio": "Clasifica una temperatura: menos de 10 'frío', de 10 a 25 'templado', más de 25 'calor'.", "quiz": {"q": "x = 0\nif x: print(\"A\")\nelse: print(\"B\")\n¿Qué imprime?", "o": ["A", "Error", "Nada", "B"], "a": 3, "x": "0 es falsy, por eso entra al else."}, "out": "Aprobado\npar", "a_fondo": ["Un `if` evalúa una condición y ejecuta su bloque solo si es verdadera. El bloque se reconoce por la sangría (cuatro espacios): todo lo que está indentado debajo del `if` le pertenece. Los dos puntos al final de la línea del `if` son obligatorios.", "Con `elif` agregas más casos, que se revisan en orden: apenas uno se cumple, los siguientes se saltean. `else` atrapa todo lo que no cumplió ninguna condición. Por eso el orden importa: pon primero los casos más específicos.", "Las condiciones se pueden combinar con `and`, `or` y `not`, y Python permite comparaciones encadenadas como `0 < x <= 5`, que se lee igual que en matemática.", "Para decisiones cortas existe la expresión condicional: `valor = \"par\" if n % 2 == 0 else \"impar\"`. Úsala solo cuando sea fácil de leer; si la condición es compleja, un `if` normal es más claro."], "paso": ["`nota >= 90` es falso, así que se pasa al `elif`.", "`nota >= 70` es verdadero: imprime 'Aprobado' y saltea el `else`.", "La expresión condicional elige 'par' o 'impar' según el resto de dividir por 2."], "errores": [["IndentationError: expected an indented block", "Después de los dos puntos del `if` el bloque debe ir indentado con 4 espacios."], ["Siempre entra al primer caso", "Revisa el orden: si pones `nota >= 70` antes que `nota >= 90`, el 95 nunca llegará a 'Excelente'."]], "practica": {"titulo": "Las pistas del juego", "pieza": "Capítulo 6: las pistas", "modo": "capitulo", "contexto": "secreto = 42\nintento = 30", "mostrar": ["pista", "cerca"], "enunciado": "Ya existen `secreto` e `intento`. Crea:\n\n• `pista`: \"Más alto\" si el intento es menor que el secreto, \"Más bajo\" si es mayor, y \"¡Correcto!\" si son iguales.\n• `cerca`: True si el intento NO es el secreto pero está a 5 o menos de distancia; False en cualquier otro caso.", "plantilla": "# Capítulo 6: las pistas. Ya existen secreto e intento.\nif intento < secreto:\n    pista = \"Más alto\"\n# Completa con elif (\"Más bajo\") y else (\"¡Correcto!\")\n\n\n# cerca: True si la distancia está entre 1 y 5 (incluidos)\ndistancia = abs(secreto - intento)\n", "pruebas": "\nfor s_, i_, esperada in [(42, 30, \"Más alto\"), (42, 50, \"Más bajo\"), (42, 42, \"¡Correcto!\"), (10, 9, \"Más alto\"), (10, 11, \"Más bajo\")]:\n    ns, s = probar(secreto=s_, intento=i_)\n    caso(f\"Secreto {s_}, intento {i_}: '{esperada}'\", lambda: var(ns, \"pista\"), esperada, \"Revisa la dirección: si el intento es MENOR, el jugador debe ir MÁS ALTO.\")\nfor s_, i_, esperado in [(42, 40, True), (42, 47, True), (42, 48, False), (42, 30, False), (42, 42, False)]:\n    ns, s = probar(secreto=s_, intento=i_)\n    caso(f\"cerca con secreto {s_} e intento {i_} es {esperado}\", lambda: var(ns, \"cerca\"), esperado, \"cerca es True solo si 0 < distancia <= 5. Si acertó, no está 'cerca': ¡ganó!\")\n", "solucion": "if intento < secreto:\n    pista = \"Más alto\"\nelif intento > secreto:\n    pista = \"Más bajo\"\nelse:\n    pista = \"¡Correcto!\"\n\ndistancia = abs(secreto - intento)\ncerca = 0 < distancia <= 5\n", "pistas": ["Con dos comparaciones (`<` y `>`) el `else` queda para cuando son iguales.", "`cerca = distancia > 0 and distancia <= 5` también funciona."], "explicacion": "Tres caminos excluyentes: menor, mayor o igual. Para `cerca` hay dos condiciones a la vez (no acertó y está a 5 o menos), que la comparación encadenada `0 < distancia <= 5` expresa en una sola línea."}}, {"t": "Bucles for y while", "e": "🔁", "teoria": ["`for` recorre cualquier secuencia (listas, strings, rangos). `range(inicio, fin, paso)` genera números sin incluir `fin`.", "`while` repite mientras una condición sea verdadera. Asegúrate de que algo cambie dentro del bucle o se volverá infinito.", "`break` sale del bucle inmediatamente; `continue` salta a la siguiente vuelta."], "code": "for i in range(1, 6):\n    if i == 3:\n        continue\n    print(i, end=\" \")\nprint()\n\nn = 3\nwhile n > 0:\n    print(\"Despegue en\", n)\n    n -= 1\nprint(\"¡Despegue!\")", "tips": ["`enumerate(lista)` te da índice y valor a la vez: `for i, x in enumerate(lista)`.", "Si un programa no termina, detenlo con Ctrl + C."], "ejercicio": "Imprime la tabla de multiplicar de un número que elija el usuario, del 1 al 10.", "quiz": {"q": "¿Cuántos números genera range(2, 10, 2)?", "o": ["8", "5", "3", "4"], "a": 3, "x": "Genera 2, 4, 6, 8. El 10 no se incluye."}, "out": "1 2 4 5 \nDespegue en 3\nDespegue en 2\nDespegue en 1\n¡Despegue!", "a_fondo": ["Un bucle repite un bloque. `for` recorre una secuencia elemento por elemento: una lista, un texto o un `range`. `range(inicio, fin, paso)` genera números desde `inicio` hasta antes de `fin`; `range(5)` da 0, 1, 2, 3 y 4.", "`while` repite mientras una condición sea verdadera. Es ideal cuando no sabes de antemano cuántas vueltas harán falta, como en un juego que termina cuando se acierta. Dentro del bloque algo debe cambiar para que la condición alguna vez sea falsa; si no, el bucle es infinito.", "`break` sale del bucle inmediatamente y `continue` saltea el resto de la vuelta actual y pasa a la siguiente. Úsalos con moderación: un bucle con una condición clara suele leerse mejor.", "Patrón muy común: un acumulador o contador que se crea antes del bucle (`pasos = 0`) y se actualiza en cada vuelta (`pasos += 1`). `x += 1` es un atajo de `x = x + 1`."], "paso": ["`range(1, 6)` genera del 1 al 5.", "Cuando `i` vale 3, `continue` saltea el `print` de esa vuelta.", "`end=\" \"` mantiene los números en una línea; el `print()` vacío cierra la línea.", "El `while` descuenta `n` hasta que `n > 0` deja de cumplirse."], "errores": [["El programa no termina", "Bucle infinito: la variable de la condición nunca cambia. En la app, el evaluador lo corta a las 100.000 vueltas; en tu IDE, detenlo con Ctrl+C."], ["Faltan o sobran vueltas", "Recuerda que `range(1, 10)` llega hasta el 9: el valor final no se incluye."]], "practica": {"titulo": "La computadora adivina", "pieza": "Capítulo 7: la computadora juega", "modo": "capitulo", "contexto": "secreto = 42\nminimo = 1\nmaximo = 100", "mostrar": ["pasos", "adivinado"], "enunciado": "¡Ahora la computadora juega a tu juego! Usará la mejor estrategia: probar siempre el número del medio del rango posible y descartar la mitad que no sirve. Ya existen `secreto`, `minimo` y `maximo`.\n\nCompleta el bucle `while` para que en cada vuelta imprima \"Pruebo N\" y actualice `bajo`, `alto` o `adivinado`. Al terminar, `pasos` debe tener la cantidad de intentos y `adivinado` el secreto.\n\n(Con esta estrategia, cualquier número del 1 al 100 se encuentra en 7 pasos o menos.)", "plantilla": "# Capítulo 7: ¡la computadora juega! Estrategia: partir el rango por la mitad.\nbajo = minimo\nalto = maximo\npasos = 0\nadivinado = None\nwhile adivinado != secreto:\n    medio = (bajo + alto) // 2\n    pasos = pasos + 1\n    print(\"Pruebo\", medio)\n    # Si medio es MENOR que el secreto, el secreto está arriba:  bajo = medio + 1\n    # Si medio es MAYOR, está abajo:  alto = medio - 1\n    # Si es IGUAL, ¡lo encontró!:  adivinado = medio\n", "pruebas": "\ncaso(\"Con secreto 42 lo encuentra\", lambda: var(NS, \"adivinado\"), 42)\ncaso(\"... en 7 pasos\", lambda: var(NS, \"pasos\"), 7, \"Revisa bajo = medio + 1 y alto = medio - 1.\")\ncaso(\"El primer intento es 'Pruebo 50'\", lambda: lineas(SALIDA)[0] if SALIDA.strip() else \"(nada)\", \"Pruebo 50\")\ncaso(\"Imprime un 'Pruebo' por cada paso\", lambda: len(lineas(SALIDA)), var(NS, \"pasos\"))\nns, s = probar(secreto=50)\ncaso(\"Si el secreto es 50, acierta en 1 paso\", lambda: var(ns, \"pasos\"), 1)\nns, s = probar(secreto=1)\ncaso(\"Si el secreto es 1, lo encuentra en 6 pasos\", lambda: (var(ns, \"adivinado\"), var(ns, \"pasos\")), (1, 6))\nns, s = probar(secreto=100)\ncaso(\"Si el secreto es 100, lo encuentra en 7 pasos\", lambda: (var(ns, \"adivinado\"), var(ns, \"pasos\")), (100, 7))\ndef todos_en_7():\n    for n in range(1, 101):\n        ns_, s_ = probar(secreto=n)\n        if ns_[\"adivinado\"] != n or ns_[\"pasos\"] > 7:\n            return n\n    return \"todos\"\ncaso(\"Encuentra los 100 números posibles en 7 pasos o menos\", todos_en_7, \"todos\", \"Si falla con algún número, revisa los bordes: medio + 1 y medio - 1.\")\n", "solucion": "bajo = minimo\nalto = maximo\npasos = 0\nadivinado = None\nwhile adivinado != secreto:\n    medio = (bajo + alto) // 2\n    pasos = pasos + 1\n    print(\"Pruebo\", medio)\n    if medio < secreto:\n        bajo = medio + 1\n    elif medio > secreto:\n        alto = medio - 1\n    else:\n        adivinado = medio\n", "pistas": ["Necesitas un `if / elif / else` dentro del `while`, con la misma sangría que el `print`.", "Si te sale \"más de 100.000 vueltas\", es que `adivinado` nunca cambia: falta el `else: adivinado = medio`."], "explicacion": "Cada vuelta descarta la mitad de los números que quedan: 100, 50, 25, 12, 6, 3, 1. Por eso 7 intentos alcanzan siempre. Esta idea se llama búsqueda binaria y es uno de los algoritmos más importantes de la informática."}}, {"t": "Listas y tuplas", "e": "📋", "teoria": ["Una lista guarda varios valores en orden y es mutable: puedes agregar (`append`, `insert`), quitar (`remove`, `pop`) y ordenar (`sort`).", "Las listas usan los mismos índices y slicing que los strings.", "Una tupla es como una lista pero inmutable: `(3, 4)`. Se usan para datos que no deben cambiar y permiten desempaquetar: `x, y = punto`."], "code": "frutas = [\"mango\", \"pera\"]\nfrutas.append(\"kiwi\")\nfrutas.insert(0, \"uva\")\nprint(frutas, len(frutas))\nprint(frutas[1:])\nprint(sorted(frutas))\n\npunto = (3, 4)\nx, y = punto\nprint(x + y)", "tips": ["`lista.sort()` ordena la lista original; `sorted(lista)` devuelve una nueva.", "`x in lista` verifica si un elemento existe."], "ejercicio": "Crea una lista de compras, agrega 3 productos, elimina uno, muéstrala ordenada y numerada con enumerate.", "quiz": {"q": "t = (1, 2)\nt[0] = 9\n¿Qué pasa?", "o": ["Nada", "t queda (1, 2, 9)", "TypeError", "t queda (9, 2)"], "a": 2, "x": "Las tuplas son inmutables: no admiten asignación por índice."}, "out": "['uva', 'mango', 'pera', 'kiwi'] 4\n['mango', 'pera', 'kiwi']\n['kiwi', 'mango', 'pera', 'uva']\n7", "a_fondo": ["Una lista guarda varios valores en orden, entre corchetes: `[50, 25, 37]`. Se accede con índices igual que en los strings, y también admite rebanados: `lista[-3:]` son los tres últimos.", "A diferencia de los strings, las listas son mutables: `append` agrega al final, `insert` en una posición, `remove` quita por valor y `pop` por posición. `lista.sort()` ordena la propia lista; `sorted(lista)` devuelve una copia ordenada y deja la original intacta.", "Funciones integradas que trabajan con listas: `len`, `min`, `max`, `sum` y `sorted`. `enumerate(lista)` entrega pares (posición, valor) y es la forma pythónica de numerar elementos.", "Una tupla es como una lista pero inmutable, y se escribe con paréntesis: `(25, 50)`. Se usa para datos que van juntos y no deben cambiar, como coordenadas o un mínimo y un máximo. Se puede desempaquetar: `x, y = punto`."], "paso": ["`append` agrega 'kiwi' al final e `insert(0, ...)` pone 'uva' al principio.", "`frutas[1:]` es la lista desde la posición 1.", "`sorted` devuelve una copia ordenada alfabéticamente.", "`x, y = punto` desempaqueta la tupla en dos variables."], "errores": [["IndexError: list index out of range", "La lista tiene menos elementos de los que crees. Revisa `len(lista)`."], ["La lista original quedó desordenada", "Usaste `lista.sort()`, que modifica la lista. Si necesitas conservarla, usa `sorted(lista)`."]], "practica": {"titulo": "El historial de intentos", "pieza": "Capítulo 8: el historial", "modo": "capitulo", "contexto": "historial = [50, 25, 37, 31, 34]", "mostrar": ["cantidad", "primero", "ultimo", "ultimos_tres", "ordenados", "extremos"], "enunciado": "La lista `historial` guarda los intentos de una partida, en orden. Crea:\n\n• `cantidad`: cuántos intentos hubo.\n• `primero` y `ultimo`: el primer y el último intento.\n• `ultimos_tres`: una lista con los tres últimos.\n• `ordenados`: los intentos de menor a mayor, SIN modificar `historial`.\n• `extremos`: una tupla (mínimo, máximo).", "plantilla": "# Capítulo 8: el historial. Ya existe la lista historial.\ncantidad = len(historial)\n# primero y ultimo: posiciones 0 y -1\n\n# ultimos_tres: un rebanado con índice negativo\n\n# ordenados: usa sorted() para no tocar historial\n\n# extremos: una tupla con min() y max()\n", "pruebas": "\ncaso(\"cantidad es 5\", lambda: var(NS, \"cantidad\"), 5)\ncaso(\"primero es 50 y ultimo es 34\", lambda: (var(NS, \"primero\"), var(NS, \"ultimo\")), (50, 34), \"El último se obtiene con el índice -1.\")\ncaso(\"ultimos_tres es [37, 31, 34]\", lambda: var(NS, \"ultimos_tres\"), [37, 31, 34], \"Un rebanado desde -3 hasta el final: historial[-3:]\")\ncaso(\"ordenados es [25, 31, 34, 37, 50]\", lambda: var(NS, \"ordenados\"), [25, 31, 34, 37, 50])\ncaso(\"historial no se modificó\", lambda: NS[\"historial\"], [50, 25, 37, 31, 34], \"historial.sort() desordena el original; usa sorted(historial).\")\ncaso(\"extremos es la tupla (25, 50)\", lambda: var(NS, \"extremos\"), (25, 50), \"Una tupla va entre paréntesis: (min(historial), max(historial)).\")\nns, s = probar(historial=[10, 90, 60])\ncaso(\"Con [10, 90, 60]: cantidad 3, primero 10, ultimo 60\", lambda: (var(ns, \"cantidad\"), var(ns, \"primero\"), var(ns, \"ultimo\")), (3, 10, 60), \"Usa siempre la variable historial, no números fijos.\")\ncaso(\"... ordenados [10, 60, 90] y extremos (10, 90)\", lambda: (var(ns, \"ordenados\"), var(ns, \"extremos\")), ([10, 60, 90], (10, 90)))\n", "solucion": "cantidad = len(historial)\nprimero = historial[0]\nultimo = historial[-1]\nultimos_tres = historial[-3:]\nordenados = sorted(historial)\nextremos = (min(historial), max(historial))\n", "pistas": ["Los índices negativos cuentan desde el final: -1 es el último.", "`sorted()` devuelve una lista nueva; `.sort()` cambia la original."], "explicacion": "Todo se resuelve con índices, rebanados y funciones integradas, sin bucles. `sorted` protege los datos originales, algo que vas a agradecer cuando un mismo dato se use en varios lugares del programa."}}, {"t": "Diccionarios y conjuntos", "e": "🗂️", "teoria": ["Un diccionario asocia claves con valores: `{\"cafe\": 2.5}`. Se accede con `d[clave]` y se recorre con `.items()`, `.keys()` o `.values()`.", "`d.get(clave, defecto)` evita errores si la clave no existe.", "Un conjunto (`set`) guarda elementos únicos sin orden. Es perfecto para eliminar duplicados y hacer operaciones como unión `|` e intersección `&`."], "code": "precios = {\"cafe\": 2.5, \"te\": 1.8}\nprecios[\"jugo\"] = 3.0\nfor prod, p in precios.items():\n    print(prod, p)\nprint(precios.get(\"agua\", \"no hay\"))\n\ncolores = {\"rojo\", \"azul\", \"rojo\"}\nprint(len(colores))\nprint({1, 2, 3} & {2, 3, 4})", "tips": ["Las claves deben ser inmutables (str, int, tuplas).", "Desde Python 3.7 los diccionarios conservan el orden de inserción."], "ejercicio": "Cuenta cuántas veces aparece cada palabra en una frase usando un diccionario.", "quiz": {"q": "¿Cuánto vale len({1, 1, 2, 3, 3})?", "o": ["2", "3", "5", "Error"], "a": 1, "x": "Un set elimina duplicados: queda {1, 2, 3}."}, "out": "cafe 2.5\nte 1.8\njugo 3.0\nno hay\n2\n{2, 3}", "a_fondo": ["Un diccionario asocia claves con valores: `{\"Ana\": 5}`. Buscar por clave es instantáneo, aunque tenga millones de entradas. `d[clave] = valor` crea o actualiza; `d[clave]` lee y falla con `KeyError` si no existe, mientras que `d.get(clave, defecto)` devuelve un valor por defecto.", "`clave in d` pregunta si la clave existe. Para recorrer: `for clave in d` da las claves, `d.values()` los valores y `d.items()` los pares (clave, valor), que se desempaquetan en el `for`.", "Un conjunto (`set`) guarda valores únicos y sin orden: `{10, 20, 10}` queda como `{10, 20}`. Es perfecto para eliminar repetidos y para operaciones de conjuntos: unión `|`, intersección `&` y diferencia `-`.", "Truco útil: para saber si una lista tiene repetidos, compara `len(set(lista))` con `len(lista)`. Si el conjunto es más chico, algo se repetía."], "paso": ["Se agrega la clave 'jugo' con su precio.", "`.items()` entrega cada par producto, precio.", "`get(\"agua\", \"no hay\")` evita el error si la clave no existe.", "El set elimina el 'rojo' repetido; `&` da los elementos comunes."], "errores": [["KeyError: 'Eva'", "Leíste una clave que no existe. Pregunta antes con `in` o usa `.get()`."], ["TypeError: unhashable type: 'list'", "Una lista no puede ser clave de diccionario ni elemento de un set. Usa una tupla."]], "practica": {"titulo": "Récords y repetidos", "pieza": "Capítulo 9: los récords", "modo": "capitulo", "contexto": "records = {\"Ana\": 5, \"Luis\": 3}\njugador = \"Eva\"\nintentos = 4\nhistorial = [10, 20, 10, 30]", "mostrar": ["records", "mejor", "repetidos", "unicos"], "enunciado": "`records` guarda cuántos intentos necesitó cada jugador en su mejor partida. Acaba de jugar `jugador` y necesitó `intentos`. Además, `historial` tiene los números que probó.\n\n• Actualiza `records`: guarda el resultado si el jugador es nuevo o si mejoró (menos intentos que antes).\n• `mejor`: el nombre con menos intentos (recorre con un `for`).\n• `repetidos`: True si en `historial` hay algún número repetido.\n• `unicos`: los números de `historial` sin repetir, ordenados.", "plantilla": "# Capítulo 9: récords. Ya existen records, jugador, intentos e historial.\n# 1) Guarda si es nuevo O si mejoró\nif jugador not in records or intentos < records[jugador]:\n    records[jugador] = intentos\n\n# 2) mejor: recorre records.items() buscando el menor número de intentos\nmejor = None\nfor nombre, n in records.items():\n    pass  # reemplaza pass por un if que actualice mejor\n\n# 3) repetidos: compara len(set(historial)) con len(historial)\n\n# 4) unicos: sorted(set(...))\n", "pruebas": "\ncaso(\"Eva se agrega con 4 intentos\", lambda: var(NS, \"records\"), {\"Ana\": 5, \"Luis\": 3, \"Eva\": 4})\ncaso(\"mejor es 'Luis' (3 intentos)\", lambda: var(NS, \"mejor\"), \"Luis\", \"Dentro del for: if mejor is None or n < records[mejor]: mejor = nombre\")\ncaso(\"historial [10, 20, 10, 30] tiene repetidos\", lambda: var(NS, \"repetidos\"), True)\ncaso(\"unicos es [10, 20, 30]\", lambda: var(NS, \"unicos\"), [10, 20, 30])\nns, s = probar(jugador=\"Ana\", intentos=2)\ncaso(\"Si Ana mejora a 2, se actualiza\", lambda: var(ns, \"records\")[\"Ana\"], 2)\ncaso(\"... y pasa a ser la mejor\", lambda: var(ns, \"mejor\"), \"Ana\")\nns, s = probar(jugador=\"Luis\", intentos=9)\ncaso(\"Si Luis empeora (9), conserva su récord de 3\", lambda: var(ns, \"records\")[\"Luis\"], 3, \"Solo se guarda si es nuevo o si intentos es menor que su récord.\")\nns, s = probar(historial=[1, 2, 3])\ncaso(\"[1, 2, 3] no tiene repetidos\", lambda: var(ns, \"repetidos\"), False)\n", "solucion": "if jugador not in records or intentos < records[jugador]:\n    records[jugador] = intentos\n\nmejor = None\nfor nombre, n in records.items():\n    if mejor is None or n < records[mejor]:\n        mejor = nombre\n\nrepetidos = len(set(historial)) < len(historial)\nunicos = sorted(set(historial))\n", "pistas": ["Arranca con `mejor = None` y reemplázalo cuando encuentres alguien con menos intentos.", "Un set no tiene repetidos: si quedó más chico que la lista, había repetidos."], "explicacion": "El `or` se evalúa de izquierda a derecha: si el jugador es nuevo, ni siquiera se lee `records[jugador]`, y así se evita el `KeyError`. El patrón de \"el mejor hasta ahora\" (`mejor = None` y comparar en cada vuelta) aparece en muchísimos programas."}}, {"t": "Funciones", "e": "🧩", "teoria": ["Una función agrupa código reutilizable. Se define con `def`, recibe parámetros y devuelve un resultado con `return`.", "Los parámetros pueden tener valores por defecto y pasarse por nombre, lo que hace las llamadas más claras.", "El docstring (texto entre triples comillas justo después del `def`) documenta qué hace la función. Si una función no tiene `return`, devuelve `None`."], "code": "def saludar(nombre, saludo=\"Hola\"):\n    \"\"\"Devuelve un saludo personalizado.\"\"\"\n    return f\"{saludo}, {nombre}!\"\n\nprint(saludar(\"Leo\"))\nprint(saludar(\"Ana\", saludo=\"Buenas\"))\nprint(saludar.__doc__)", "tips": ["Una función, una responsabilidad. Si su nombre necesita 'y', probablemente son dos funciones.", "Nunca uses listas o dicts como valor por defecto (`def f(x=[])`): usa `None`."], "ejercicio": "Escribe una función es_primo(n) y úsala para imprimir los primos del 1 al 50.", "quiz": {"q": "¿Qué devuelve una función sin return?", "o": ["Error", "0", "None", "\"\""], "a": 2, "x": "Toda función devuelve algo; si no hay return, devuelve None."}, "out": "Hola, Leo!\nBuenas, Ana!\nDevuelve un saludo personalizado.", "a_fondo": ["Una función es un bloque con nombre que puedes usar muchas veces. Se define con `def nombre(parámetros):` y el cuerpo va indentado. `return` devuelve un resultado y termina la función; si no hay `return`, la función devuelve `None`.", "Los parámetros son las variables que recibe la función; los argumentos, los valores que le pasas al llamarla. Un parámetro con valor por defecto (`maximo=100`) se vuelve opcional. Al llamar puedes nombrar los argumentos: `es_valido(5, maximo=10)`.", "Las variables creadas dentro de una función son locales: existen solo mientras la función corre. Por eso una función bien hecha recibe todo lo que necesita por parámetros y entrega su resultado con `return`, sin depender de variables de afuera.", "Diferencia clave: `print` muestra algo en pantalla; `return` entrega un valor al código que llamó a la función, que puede guardarlo, compararlo o usarlo en otra cuenta. Las funciones que devuelven valores son mucho más reutilizables y fáciles de probar.", "El texto entre triples comillas al inicio del cuerpo es la docstring: documenta qué hace la función y aparece en la ayuda (`help(funcion)`)."], "paso": ["`saludo=\"Hola\"` es un parámetro con valor por defecto.", "`return` devuelve el texto armado con la f-string.", "La segunda llamada reemplaza el saludo usando el nombre del parámetro.", "`saludar.__doc__` muestra la docstring."], "errores": [["La función devuelve None", "Te faltó `return`, o usaste `print` dentro de la función en lugar de devolver el valor."], ["TypeError: missing 1 required positional argument", "Llamaste a la función con menos argumentos de los que pide."]], "practica": {"titulo": "Las funciones del juego", "pieza": "Capítulo 10: las funciones del juego", "modo": "directo", "contexto": "", "stub": "def evaluar(secreto, intento):\n    raise NotImplementedError(\"Pieza pendiente: práctica de la lección 1.10\")\n\n\ndef es_valido(numero, minimo=1, maximo=100):\n    raise NotImplementedError(\"Pieza pendiente: práctica de la lección 1.10\")\n\n\ndef mensaje_final(intentos):\n    raise NotImplementedError(\"Pieza pendiente: práctica de la lección 1.10\")\n", "enunciado": "Ahora sí: convierte la lógica del juego en funciones reutilizables. El motor del juego las usará.\n\n• `evaluar(secreto, intento)`: devuelve \"Más alto\", \"Más bajo\" o \"¡Correcto!\".\n• `es_valido(numero, minimo=1, maximo=100)`: devuelve True si el número está dentro del rango, extremos incluidos.\n• `mensaje_final(intentos)`: devuelve \"¡Ganaste en 1 intento!\" o, si son varios, \"¡Ganaste en 3 intentos!\".\n\nLas tres deben usar `return`, no `print`.", "plantilla": "def evaluar(secreto, intento):\n    \"\"\"Devuelve \"Más alto\", \"Más bajo\" o \"¡Correcto!\".\"\"\"\n    if intento < secreto:\n        return \"Más alto\"\n    # completa los otros dos casos\n\n\ndef es_valido(numero, minimo=1, maximo=100):\n    \"\"\"True si numero está entre minimo y maximo (incluidos).\"\"\"\n\n\ndef mensaje_final(intentos):\n    \"\"\"Singular para 1 intento, plural para varios.\"\"\"\n", "pruebas": "\ncaso(\"evaluar(42, 30) devuelve 'Más alto'\", lambda: evaluar(42, 30), \"Más alto\")\ncaso(\"evaluar(42, 60) devuelve 'Más bajo'\", lambda: evaluar(42, 60), \"Más bajo\")\ncaso(\"evaluar(42, 42) devuelve '¡Correcto!'\", lambda: evaluar(42, 42), \"¡Correcto!\", \"Si obtuviste None, te falta un return en ese caso.\")\ncaso(\"es_valido(50) es True\", lambda: es_valido(50), True)\ncaso(\"Los extremos cuentan: es_valido(1) y es_valido(100)\", lambda: (es_valido(1), es_valido(100)), (True, True), \"Usa <= y >=, no < y >.\")\ncaso(\"es_valido(0) y es_valido(101) son False\", lambda: (es_valido(0), es_valido(101)), (False, False))\ncaso(\"es_valido(15, maximo=10) es False\", lambda: es_valido(15, maximo=10), False, \"Usa los parámetros minimo y maximo, no los números 1 y 100 fijos.\")\ncaso(\"mensaje_final(1) usa singular\", lambda: mensaje_final(1), \"¡Ganaste en 1 intento!\")\ncaso(\"mensaje_final(3) usa plural\", lambda: mensaje_final(3), \"¡Ganaste en 3 intentos!\")\ncaso(\"Las funciones devuelven sin imprimir\", lambda: SALIDA.strip() == \"\" and \"return\" in CODIGO, True, \"Cambia los print por return.\")\n", "solucion": "def evaluar(secreto, intento):\n    \"\"\"Devuelve \"Más alto\", \"Más bajo\" o \"¡Correcto!\".\"\"\"\n    if intento < secreto:\n        return \"Más alto\"\n    if intento > secreto:\n        return \"Más bajo\"\n    return \"¡Correcto!\"\n\n\ndef es_valido(numero, minimo=1, maximo=100):\n    \"\"\"True si numero está entre minimo y maximo (incluidos).\"\"\"\n    return minimo <= numero <= maximo\n\n\ndef mensaje_final(intentos):\n    \"\"\"Singular para 1 intento, plural para varios.\"\"\"\n    if intentos == 1:\n        return \"¡Ganaste en 1 intento!\"\n    return f\"¡Ganaste en {intentos} intentos!\"\n", "pistas": ["Como `return` termina la función, después de dos `if` con `return` el tercer caso puede ir sin condición.", "`return minimo <= numero <= maximo` devuelve directamente el booleano."], "explicacion": "Cada función hace una sola cosa y devuelve su resultado. Así el motor del juego puede combinarlas, y el evaluador (como harás tú con pytest en el Nivel 2) puede probarlas por separado con distintos valores."}}, {"t": "Errores y cómo leerlos", "e": "🐛", "teoria": ["Los errores son información, no fracasos. Los más comunes: `SyntaxError` (código mal escrito), `NameError` (variable inexistente), `TypeError` (tipos incompatibles), `ValueError` (valor inválido) e `IndexError` (índice fuera de rango).", "Lee el traceback de abajo hacia arriba: la última línea dice el tipo de error y el mensaje; las anteriores dicen dónde ocurrió.", "`try`/`except` permite atrapar un error y reaccionar en lugar de que el programa se detenga."], "code": "try:\n    numero = int(\"diez\")\nexcept ValueError as e:\n    print(\"Ups:\", e)\n\nlista = [1, 2, 3]\ntry:\n    print(lista[10])\nexcept IndexError:\n    print(\"Ese índice no existe\")", "tips": ["Atrapa errores específicos (`except ValueError`), nunca un `except:` vacío.", "Anota en tu cuadernillo cada error nuevo que encuentres y cómo lo resolviste."], "ejercicio": "Mejora la calculadora de propinas para que vuelva a pedir el monto si el usuario escribe algo inválido.", "quiz": {"q": "print(edad) sin haber definido edad lanza…", "o": ["SyntaxError", "NameError", "TypeError", "ValueError"], "a": 1, "x": "NameError: el nombre no existe en el ámbito actual."}, "out": "Ups: invalid literal for int() with base 10: 'diez'\nEse índice no existe", "a_fondo": ["Un mensaje de error (traceback) se lee de abajo hacia arriba: la última línea dice el tipo de error y una descripción; las líneas anteriores muestran el camino, con el archivo y el número de línea donde ocurrió.", "Los errores más comunes: `SyntaxError` (código mal escrito), `NameError` (nombre inexistente), `TypeError` (operación con tipos que no combinan), `ValueError` (valor del tipo correcto pero inválido, como `int(\"hola\")`), `IndexError` y `KeyError` (posición o clave inexistente) y `ZeroDivisionError`.", "`try` / `except` atrapa un error para que el programa no se caiga: Python intenta el bloque `try` y, si ocurre el error indicado, ejecuta el bloque `except`. Atrapa siempre un tipo concreto (`except ValueError:`); un `except:` vacío esconde errores que deberías ver.", "Validar datos que escribe una persona es el uso más típico: intentas convertir y, si falla, avisas y devuelves algo que indique \"inválido\", como `None`."], "paso": ["`int(\"diez\")` lanza `ValueError`; el `except` lo atrapa y muestra el mensaje guardado en `e`.", "`lista[10]` lanza `IndexError`, que se atrapa en el segundo `try`."], "errores": [["El except nunca se ejecuta", "Estás atrapando otro tipo de error. Revisa en el traceback qué tipo ocurre realmente."], ["Un except vacío esconde todo", "`except:` sin tipo atrapa incluso tus propios errores de código. Escribe siempre el tipo."]], "practica": {"titulo": "A prueba de errores", "pieza": "Capítulo 11: a prueba de errores", "modo": "directo", "contexto": "", "stub": "def pedir_numero(texto, minimo=1, maximo=100):\n    raise NotImplementedError(\"Pieza pendiente: práctica de la lección 1.11\")\n", "enunciado": "El último capítulo protege el juego contra entradas inválidas. Escribe `pedir_numero(texto, minimo=1, maximo=100)`, que recibe lo que escribió el jugador y:\n\n• devuelve el número entero si es válido y está dentro del rango;\n• devuelve `None` si no es un número entero (\"hola\", \"3.5\", \"\") o si está fuera de rango.\n\nUsa `try` / `except ValueError` para la conversión.", "plantilla": "def pedir_numero(texto, minimo=1, maximo=100):\n    \"\"\"Devuelve el número si es válido, o None si no lo es.\"\"\"\n    try:\n        numero = int(texto)\n    except ValueError:\n        return None\n    # ahora revisa el rango\n", "pruebas": "\ncaso(\"'42' devuelve 42\", lambda: pedir_numero(\"42\"), 42)\ncaso(\"'  7 ' devuelve 7 (int ignora espacios)\", lambda: pedir_numero(\"  7 \"), 7)\ncaso(\"'hola' devuelve None\", lambda: pedir_numero(\"hola\"), None, \"La conversión debe ir dentro de try, con except ValueError: return None.\")\ncaso(\"'3.5' devuelve None\", lambda: pedir_numero(\"3.5\"), None)\ncaso(\"'' (vacío) devuelve None\", lambda: pedir_numero(\"\"), None)\ncaso(\"'150' está fuera de rango: None\", lambda: pedir_numero(\"150\"), None, \"Después de convertir, revisa que esté entre minimo y maximo.\")\ncaso(\"'0' está fuera de rango: None\", lambda: pedir_numero(\"0\"), None)\ncaso(\"'100' es válido (extremo incluido)\", lambda: pedir_numero(\"100\"), 100)\ncaso(\"Respeta los parámetros: pedir_numero('15', maximo=10) es None\", lambda: pedir_numero(\"15\", maximo=10), None)\ncaso(\"Usaste try/except\", lambda: \"try\" in CODIGO and \"except\" in CODIGO, True)\n", "solucion": "def pedir_numero(texto, minimo=1, maximo=100):\n    \"\"\"Devuelve el número si es válido, o None si no lo es.\"\"\"\n    try:\n        numero = int(texto)\n    except ValueError:\n        return None\n    if minimo <= numero <= maximo:\n        return numero\n    return None\n", "pistas": ["La conversión puede fallar; la comparación del rango no. Por eso solo `int(texto)` va dentro del `try`.", "Si la función termina sin `return`, devuelve `None` sola, pero escribirlo explícito es más claro."], "explicacion": "Dentro del `try` va solo lo que puede fallar. Si la conversión funciona, se revisa el rango. Devolver `None` permite que el motor del juego pregunte `if numero is None` y vuelva a pedir el dato sin caerse."}}]}, {"id": 2, "nombre": "Constructor", "nivel": "Intermedio", "semanas": 8, "color": "#2A6F97", "lema": "Código organizado, reutilizable y que no se rompe.", "objetivo": "Dominar las herramientas que separan un script de un programa: funciones flexibles, archivos, excepciones, programación orientada a objetos, entornos y pruebas.", "proyecto": {"t": "Gestor de tareas de consola", "desc": "Una aplicación CLI para crear, listar, completar y borrar tareas, con persistencia en JSON.", "pasos": ["Define una clase Tarea (título, prioridad, fecha, completada) y una clase GestorTareas.", "Guarda y carga las tareas en
