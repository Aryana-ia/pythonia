\"Lotes del ejemplo\", lambda: list(en_lotes(range(5), 2)), [[0, 1], [2, 3], [4]])\ncaso(\"Lotes exactos, sin lote vacío al final\", lambda: list(en_lotes(\"abcdef\", 3)), [[\"a\", \"b\", \"c\"], [\"d\", \"e\", \"f\"]], \"Entrega el último lote solo si tiene algo.\")\ncaso(\"Entrada vacía, ningún lote\", lambda: list(en_lotes([], 3)), [])\nconsumidas.clear()\ncaso(\"en_lotes es perezoso\", lambda: (next(en_lotes(fuente(), 3)), len(consumidas)), ([\"p0;0,5\", \"p1;1,5\", \"p2;2,5\"], 3), \"Entrega cada lote apenas se completa.\")\n", "solucion": "def leer_precios(lineas):\n    \"\"\"\n    >>> list(leer_precios([\"cable;3,20\", \"\", \"# nota\", \"roto\", \"pintura;12,5\"]))\n    [('cable', 3.2), ('pintura', 12.5)]\n    \"\"\"\n    for linea in lineas:\n        linea = linea.strip()\n        if not linea or linea.startswith(\"#\"):\n            continue\n        producto, _, precio = linea.partition(\";\")\n        try:\n            yield producto.strip(), float(precio.strip().replace(\",\", \".\"))\n        except ValueError:\n            continue\n\n\ndef en_lotes(iterable, n):\n    \"\"\"\n    >>> list(en_lotes(range(5), 2))\n    [[0, 1], [2, 3], [4]]\n    \"\"\"\n    lote = []\n    for elemento in iterable:\n        lote.append(elemento)\n        if len(lote) == n:\n            yield lote\n            lote = []\n    if lote:\n        yield lote\n", "pistas": ["`linea.partition(\";\")` separa en (antes, separador, después) sin fallar si no hay `;`.", "En `en_lotes`, después del `yield` crea una lista nueva vacía; al terminar el `for`, entrega lo que quedó."], "explicacion": "Los dos generadores procesan un elemento a la vez y nunca guardan más de un lote en memoria. Funcionarían igual con un archivo de varios gigas. Por eso el evaluador verifica que solo se consumió lo necesario para entregar el primer valor."}, "lentes": {"auto": "Crea un generador que recorra un Excel enorme con iter_rows y entregue solo las filas con stock bajo.", "juegos": "Crea un generador infinito de oleadas que aumente la dificultad en cada ronda.", "bd": "Lee una tabla de un millón de filas por lotes con un generador y fetchmany."}}, {"t": "Decoradores", "e": "🎀", "teoria": ["En Python las funciones son objetos: se pueden pasar como argumento y devolver desde otras funciones.", "Un decorador es una función que recibe otra función y devuelve una versión mejorada. Se aplica con `@decorador` encima del `def`.", "Se usan para registrar llamadas, medir tiempos, cachear resultados, validar permisos o reintentar operaciones."], "code": "import functools\n\ndef registrar(func):\n    @functools.wraps(func)\n    def envoltura(*args, **kwargs):\n        print(f\"-> llamando a {func.__name__}{args}\")\n        res = func(*args, **kwargs)\n        print(f\"<- devolvió {res}\")\n        return res\n    return envoltura\n\n@registrar\ndef sumar(a, b):\n    return a + b\n\nsumar(2, 3)\nprint(sumar.__name__)", "tips": ["Usa siempre `functools.wraps` para conservar nombre y docstring de la función original.", "Un decorador con parámetros es una función que devuelve un decorador (tres niveles)."], "ejercicio": "Escribe un decorador @reintentar(veces=3) que vuelva a llamar a la función si lanza una excepción.", "quiz": {"q": "¿Para qué sirve functools.wraps?", "o": ["Conserva el nombre y docstring originales", "Acelera la función", "Hace la función asíncrona", "Captura errores"], "a": 0, "x": "Sin wraps, sumar.__name__ sería 'envoltura'."}, "out": "-> llamando a sumar(2, 3)\n<- devolvió 5\nsumar", "a_fondo": ["En Python las funciones son objetos: se pueden guardar en variables, pasar como argumento y devolver desde otras funciones. Una función definida dentro de otra recuerda las variables del entorno donde nació: eso es una clausura.", "Un decorador es una función que recibe una función y devuelve otra que la envuelve, agregando comportamiento antes o después. `@registrar` sobre `def sumar` equivale a escribir `sumar = registrar(sumar)`.", "`functools.wraps` copia el nombre, la docstring y otros datos de la función original a la envoltura. Sin él, todas las funciones decoradas se llamarían `envoltura`, y la depuración y la documentación se vuelven confusas.", "Un decorador con parámetros, como `@reintentar(veces=3)`, tiene un nivel más: una función que recibe la configuración y devuelve el decorador. Son tres funciones anidadas: configuración → decorador → envoltura."], "paso": ["`registrar` recibe la función y define `envoltura`, que acepta cualquier argumento.", "La envoltura imprime, llama a la original, imprime el resultado y lo devuelve.", "`@registrar` reemplaza `sumar` por la envoltura.", "Gracias a `wraps`, `sumar.__name__` sigue siendo 'sumar'."], "errores": [["La función decorada devuelve None", "La envoltura llamó a la función pero olvidó `return resultado`."], ["TypeError: 'NoneType' object is not callable", "El decorador olvidó `return envoltura`, o usaste `@reintentar` sin paréntesis siendo un decorador con parámetros."]], "practica": {"titulo": "Reintentar ante fallos de red", "pieza": "Decoradores de robustez", "modo": "directo", "contexto": "", "stub": "def contar_llamadas(func):\n    return func\n\n\ndef reintentar(veces=3, excepciones=(ConnectionError,)):\n    def decorador(func):\n        return func\n    return decorador\n", "enunciado": "• `contar_llamadas(func)`: decorador que agrega a la función el atributo `llamadas` y lo incrementa en cada llamada (ya está resuelto en la plantilla como ejemplo).\n• `reintentar(veces=3, excepciones=(ConnectionError,))`: decorador con parámetros. Si la función lanza una de esas excepciones, vuelve a intentar hasta `veces` intentos en total. Si se agotan, relanza el último error. Cualquier otra excepción se propaga enseguida, sin reintentar.\n\nAmbos deben conservar el nombre y la docstring de la función original con `functools.wraps`.", "plantilla": "import functools\n\n\ndef contar_llamadas(func):\n    @functools.wraps(func)\n    def envoltura(*args, **kwargs):\n        envoltura.llamadas += 1\n        return func(*args, **kwargs)\n    envoltura.llamadas = 0\n    return envoltura\n\n\ndef reintentar(veces=3, excepciones=(ConnectionError,)):\n    \"\"\"Decorador con parámetros: configuración -> decorador -> envoltura.\"\"\"\n", "pruebas": "\n@contar_llamadas\ndef saludar(nombre):\n    \"\"\"Saluda.\"\"\"\n    return \"hola \" + nombre\nsaludar(\"a\"); saludar(\"b\")\ncaso(\"contar_llamadas cuenta 2 llamadas\", lambda: saludar.llamadas, 2)\ncaso(\"contar_llamadas conserva el nombre\", lambda: saludar.__name__, \"saludar\")\ndef fabricar(fallos, error=ConnectionError):\n    estado = {\"n\": 0}\n    def tarea():\n        \"\"\"Tarea inestable.\"\"\"\n        estado[\"n\"] += 1\n        if estado[\"n\"] <= fallos:\n            raise error(\"falla \" + str(estado[\"n\"]))\n        return \"ok\"\n    return tarea, estado\nt, est = fabricar(2)\ncaso(\"Con 2 fallos y 3 intentos, termina bien\", lambda: reintentar(veces=3)(t)(), \"ok\")\ncaso(\"... habiendo intentado 3 veces\", lambda: est[\"n\"], 3)\nt, est = fabricar(5)\ncaso(\"Si se agotan los intentos, relanza ConnectionError\", lambda: lanza(ConnectionError, reintentar(veces=2)(t)), True, \"Después del último intento fallido, usa raise para relanzar.\")\ncaso(\"... tras exactamente 2 intentos\", lambda: est[\"n\"], 2)\nt, est = fabricar(1, ValueError)\ncaso(\"Un ValueError no se reintenta\", lambda: (lanza(ValueError, reintentar(veces=3)(t)), est[\"n\"]), (True, 1), \"Atrapa solo las excepciones de la tupla `excepciones`.\")\nt, est = fabricar(1, TimeoutError)\ncaso(\"Acepta otras excepciones configurables\", lambda: reintentar(veces=2, excepciones=(TimeoutError,))(t)(), \"ok\")\ncaso(\"reintentar conserva nombre y docstring\", lambda: (reintentar()(t).__name__, reintentar()(t).__doc__), (\"tarea\", \"Tarea inestable.\"), \"Decora la envoltura con @functools.wraps(func).\")\n", "solucion": "import functools\n\n\ndef contar_llamadas(func):\n    @functools.wraps(func)\n    def envoltura(*args, **kwargs):\n        envoltura.llamadas += 1\n        return func(*args, **kwargs)\n    envoltura.llamadas = 0\n    return envoltura\n\n\ndef reintentar(veces=3, excepciones=(ConnectionError,)):\n    \"\"\"Decorador con parámetros: configuración -> decorador -> envoltura.\"\"\"\n    def decorador(func):\n        @functools.wraps(func)\n        def envoltura(*args, **kwargs):\n            for intento in range(1, veces + 1):\n                try:\n                    return func(*args, **kwargs)\n                except excepciones:\n                    if intento == veces:\n                        raise\n        return envoltura\n    return decorador\n", "pistas": ["`except excepciones:` acepta directamente una tupla de clases.", "Un `raise` solo, dentro del `except`, relanza el error actual con su traceback."], "explicacion": "Los tres niveles se ven claros: `reintentar` guarda la configuración, `decorador` recibe la función y `envoltura` hace el trabajo. El `return` dentro del `try` corta el bucle apenas hay éxito; el `raise` final solo ocurre en el último intento."}, "lentes": {"auto": "Escribe @medir_tiempo y aplícalo a cada paso de tu robot para descubrir cuál tarda más.", "juegos": "Escribe @cooldown(0.5) para que un disparo solo pueda repetirse cada medio segundo.", "bd": "Escribe @transaccional que haga commit o rollback automático alrededor de una función."}}, {"t": "Context managers", "e": "🚪", "teoria": ["Un context manager prepara algo al entrar a un bloque `with` y lo limpia al salir, pase lo que pase.", "Se crean con una clase que implementa `__enter__` y `__exit__`, o más fácil con el decorador `@contextmanager` y un `yield`.", "Casos típicos: archivos, conexiones a bases de datos, locks, cambios temporales de configuración, medición de tiempos."], "code": "from contextlib import contextmanager\n\n@contextmanager\ndef seccion(titulo):\n    print(f\"[inicio] {titulo}\")\n    try:\n        yield\n    finally:\n        print(f\"[fin] {titulo}\")\n\nwith seccion(\"Carga de datos\"):\n    print(\"procesando...\")", "tips": ["Envuelve el `yield` en try/finally para que la limpieza ocurra aunque haya errores.", "`contextlib.suppress(FileNotFoundError)` ignora un error concreto de forma explícita."], "ejercicio": "Crea un context manager cronometro() que imprima cuánto tardó el bloque.", "quiz": {"q": "¿Qué métodos implementa una clase context manager?", "o": ["__enter__ y __exit__", "__open__ y __close__", "__init__ y __del__", "__start__ y __end__"], "a": 0, "x": "with llama a __enter__ al entrar y a __exit__ al salir."}, "out": "[inicio] Carga de datos\nprocesando...\n[fin] Carga de datos", "a_fondo": ["Un context manager define qué pasa al entrar y al salir de un bloque `with`. Al salir, la limpieza ocurre siempre, aunque haya un error o un `return` en el medio. Por eso es la forma correcta de manejar archivos, conexiones y bloqueos.", "Como clase, implementa `__enter__` (lo que devuelve se asigna a la variable del `as`) y `__exit__(tipo, valor, traza)`, que recibe información del error si lo hubo. Si `__exit__` devuelve `True`, el error se suprime; devolviendo `False` o `None`, se propaga.", "Con `contextlib.contextmanager` basta un generador: lo que está antes del `yield` es la entrada, el `yield` es el bloque y lo que va en el `finally` es la salida. Es la forma más corta y la más usada para casos simples.", "Un solo `with` puede abrir varios context managers separados por comas, que se cierran en orden inverso."], "paso": ["`@contextmanager` convierte el generador en context manager.", "Se imprime el inicio, `yield` cede el control al bloque `with`.", "El `finally` garantiza el mensaje de fin aunque el bloque falle."], "errores": [["El recurso no se libera cuando hay un error", "La limpieza debe ir en un `finally` (o en `__exit__`), no después del `yield` sin protección."], ["El error desapareció", "Tu `__exit__` devolvió True. Devuelve False para que el error se propague."]], "practica": {"titulo": "Medir y registrar cada operación", "pieza": "Context managers", "modo": "directo", "contexto": "", "stub": "from contextlib import contextmanager\n\n\nclass Cronometro:\n    def __enter__(self):\n        return self\n\n    def __exit__(self, tipo, valor, traza):\n        self.duracion = 0.0\n        return False\n\n\n@contextmanager\ndef registro_de(nombre, eventos):\n    yield\n", "enunciado": "• `Cronometro`: context manager como clase. Al entrar guarda el tiempo con `time.perf_counter()` y devuelve el propio objeto; al salir guarda en `self.duracion` los segundos transcurridos. No debe ocultar errores.\n• `registro_de(nombre, eventos)`: context manager con `@contextmanager`. Agrega a la lista `eventos` el texto `\"inicio lectura\"` al entrar y `\"fin lectura\"` al salir, siempre. Si dentro del bloque ocurre un error, agrega además `\"error lectura: <mensaje>\"` antes del fin, y deja que el error se propague.", "plantilla": "import time\nfrom contextlib import contextmanager\n\n\nclass Cronometro:\n    def __enter__(self):\n        pass\n\n    def __exit__(self, tipo, valor, traza):\n        pass\n\n\n@contextmanager\ndef registro_de(nombre, eventos):\n    eventos.append(f\"inicio {nombre}\")\n    try:\n        yield\n    finally:\n        pass\n", "pruebas": "\nwith Cronometro() as c:\n    sum(range(20000))\ncaso(\"El as recibe el propio cronómetro\", lambda: type(c).__name__, \"Cronometro\", \"__enter__ debe devolver self.\")\ncaso(\"Guarda una duración en segundos (float >= 0)\", lambda: isinstance(c.duracion, float) and c.duracion >= 0, True)\ndef falla_con_crono():\n    with Cronometro() as c2:\n        1 / 0\ncaso(\"No oculta los errores\", lambda: lanza(ZeroDivisionError, falla_con_crono), True, \"__exit__ debe devolver False (o None).\")\nev = []\nwith registro_de(\"lectura\", ev):\n    ev.append(\"trabajando\")\ncaso(\"Registra inicio y fin\", lambda: ev, [\"inicio lectura\", \"trabajando\", \"fin lectura\"])\nev2 = []\ndef falla_con_registro():\n    with registro_de(\"carga\", ev2):\n        raise ValueError(\"archivo vacío\")\ncaso(\"El error se propaga\", lambda: lanza(ValueError, falla_con_registro), True, \"Después de anotar el error, vuelve a lanzarlo con raise.\")\ncaso(\"Con error registra inicio, error y fin\", lambda: ev2, [\"inicio carga\", \"error carga: archivo vacío\", \"fin carga\"], \"except Exception as e: anota y relanza; el fin va en el finally.\")\n", "solucion": "import time\nfrom contextlib import contextmanager\n\n\nclass Cronometro:\n    def __enter__(self):\n        self.inicio = time.perf_counter()\n        return self\n\n    def __exit__(self, tipo, valor, traza):\n        self.duracion = float(time.perf_counter() - self.inicio)\n        return False\n\n\n@contextmanager\ndef registro_de(nombre, eventos):\n    eventos.append(f\"inicio {nombre}\")\n    try:\n        yield\n    except Exception as e:\n        eventos.append(f\"error {nombre}: {e}\")\n        raise\n    finally:\n        eventos.append(f\"fin {nombre}\")\n", "pistas": ["En `__exit__`, `return False` deja pasar el error.", "En el generador: `try: yield` · `except Exception as e:` anota y `raise` · `finally:` anota el fin."], "explicacion": "Las dos formas hacen lo mismo con distinta sintaxis. El orden `except` → `raise` → `finally` garantiza que el error quede anotado, se propague y que el cierre ocurra igual. Es exactamente lo que hace `open()` por dentro con los archivos."}, "lentes": {"auto": "Crea un context manager carpeta_temporal() que cree una carpeta de trabajo y la borre al terminar.", "juegos": "Crea un context manager pausa_juego() que detenga música y reloj y los reanude al salir.", "bd": "Crea un context manager conexion() que abra, entregue y cierre siempre la conexión."}}, {"t": "Type hints y dataclasses", "e": "🏷️", "teoria": ["Las anotaciones de tipo (`def f(x: int) -> str`) documentan qué espera y devuelve tu código. Herramientas como `mypy` y los editores las usan para detectar errores antes de ejecutar.", "Python no las aplica en tiempo de ejecución: son información para personas y herramientas.", "`@dataclass` genera automáticamente `__init__`, `__repr__` y `__eq__` (y orden con `order=True`) a partir de los atributos anotados."], "code": "from dataclasses import dataclass, field\n\n@dataclass(order=True)\nclass Producto:\n    precio: float\n    nombre: str = field(compare=False)\n    stock: int = 0\n\nitems = [Producto(9.5, \"cable\"), Producto(3.2, \"tornillo\", 100)]\nprint(sorted(items)[0])\nprint(items[0] == Producto(9.5, \"otro\"))", "tips": ["`@dataclass(frozen=True)` crea objetos inmutables, perfectos como claves de diccionario.", "Usa `list[int]`, `dict[str, float]` y `X | None` (Python 3.10+)."], "ejercicio": "Convierte la clase Tarea de tu gestor en una dataclass con tipos y verifica el proyecto con mypy.", "quiz": {"q": "Si el hint dice int y pasas un str, en ejecución Python…", "o": ["Lo convierte", "No compila", "No lo impide: los hints no se aplican en runtime", "Lanza TypeError"], "a": 2, "x": "Los verificadores estáticos (mypy, pyright) son los que lo detectan."}, "out": "Producto(precio=3.2, nombre='tornillo', stock=100)\nTrue", "a_fondo": ["Las anotaciones de tipo (`def f(precio: float) -> bool`) documentan qué espera y qué devuelve tu código. Python no las verifica al ejecutar, pero herramientas como mypy y tu IDE las usan para detectar errores antes de correr el programa y para autocompletar.", "`@dataclass` genera automáticamente `__init__`, `__repr__` y `__eq__` a partir de los campos anotados. Una clase de datos de diez líneas reemplaza fácilmente treinta de código repetitivo.", "Opciones útiles: `frozen=True` hace los objetos inmutables (ideal para registros que no deben cambiar), `order=True` permite ordenarlos y `field(default_factory=list)` da a cada objeto su propia lista vacía.", "Los campos con valor por defecto deben ir después de los obligatorios. Una dataclass puede tener métodos comunes, como cualquier clase."], "paso": ["`order=True` genera comparaciones; se ordena por los campos en orden, empezando por `precio`.", "`field(compare=False)` excluye el nombre de las comparaciones.", "Por eso dos productos con igual precio y stock son iguales aunque cambie el nombre."], "errores": [["TypeError: non-default argument follows default argument", "Pusiste un campo sin valor por defecto después de uno que sí tiene. Reordénalos."], ["FrozenInstanceError: cannot assign to field", "El objeto es `frozen=True`: crea uno nuevo con `dataclasses.replace(obj, campo=valor)`."]], "practica": {"titulo": "Modelar productos con dataclasses", "pieza": "Modelos de datos", "modo": "directo", "contexto": "", "stub": "from dataclasses import dataclass\n\n\n@dataclass\nclass Producto:\n    nombre: str\n    precio: float\n    umbral: float = 0.0\n    tienda: str = \"web\"\n\n    def en_oferta(self) -> bool:\n        return self.precio <= self.umbral\n\n\n@dataclass(frozen=True)\nclass Lectura:\n    producto: str\n    precio: float\n    fecha: str\n\n\ndef mas_barato(productos):\n    return min(productos, key=lambda p: p.precio) if productos else None\n", "enunciado": "• `Producto` (dataclass): `nombre: str`, `precio: float`, `umbral: float = 0.0`, `tienda: str = \"web\"`, y el método `en_oferta() -> bool`, que es True si el precio es menor o igual al umbral.\n• `Lectura` (dataclass inmutable): `producto: str`, `precio: float`, `fecha: str`.\n• `mas_barato(productos)`: el producto de menor precio, o `None` si la lista está vacía.\n\nAnota los tipos en todos los campos y funciones.", "plantilla": "from dataclasses import dataclass\n\n\n@dataclass\nclass Producto:\n    nombre: str\n    # completa los campos y el método en_oferta\n\n\n# Lectura: dataclass inmutable\n\n\ndef mas_barato(productos: list) -> \"Producto | None\":\n    \"\"\"El producto de menor precio, o None si no hay productos.\"\"\"\n", "pruebas": "\np = Producto(\"cable\", 3.2, umbral=3.5)\ncaso(\"Producto genera __repr__ automáticamente\", lambda: repr(p), \"Producto(nombre='cable', precio=3.2, umbral=3.5, tienda='web')\", \"Usa @dataclass y respeta el orden de los campos.\")\ncaso(\"Valores por defecto\", lambda: (Producto(\"x\", 1.0).umbral, Producto(\"x\", 1.0).tienda), (0.0, \"web\"))\ncaso(\"Igualdad por contenido\", lambda: Producto(\"a\", 1.0) == Producto(\"a\", 1.0), True)\ncaso(\"en_oferta es True si precio <= umbral\", lambda: (p.en_oferta(), Producto(\"x\", 3.5, 3.5).en_oferta(), Producto(\"x\", 4.0, 3.5).en_oferta()), (True, True, False))\nlec = Lectura(\"cable\", 3.2, \"2026-10-03\")\ncaso(\"Lectura guarda sus datos\", lambda: (lec.producto, lec.precio, lec.fecha), (\"cable\", 3.2, \"2026-10-03\"))\ndef modificar():\n    lec.precio = 1.0\ncaso(\"Lectura es inmutable\", lambda: lanza(Exception, modificar), True, \"@dataclass(frozen=True)\")\ncaso(\"mas_barato elige el de menor precio\", lambda: mas_barato([Producto(\"a\", 5.0), Producto(\"b\", 2.0), Producto(\"c\", 9.0)]).nombre, \"b\", \"min(productos, key=lambda p: p.precio)\")\ncaso(\"mas_barato de lista vacía es None\", lambda: mas_barato([]), None)\ncaso(\"Los campos tienen anotaciones de tipo\", lambda: list(Producto.__annotations__), [\"nombre\", \"precio\", \"umbral\", \"tienda\"])\n", "solucion": "from dataclasses import dataclass\n\n\n@dataclass\nclass Producto:\n    nombre: str\n    precio: float\n    umbral: float = 0.0\n    tienda: str = \"web\"\n\n    def en_oferta(self) -> bool:\n        return self.precio <= self.umbral\n\n\n@dataclass(frozen=True)\nclass Lectura:\n    producto: str\n    precio: float\n    fecha: str\n\n\ndef mas_barato(productos: list) -> \"Producto | None\":\n    \"\"\"El producto de menor precio, o None si no hay productos.\"\"\"\n    if not productos:\n        return None\n    return min(productos, key=lambda p: p.precio)\n", "pistas": ["Los campos con valor por defecto van al final.", "`min(iterable, key=...)` devuelve el elemento, no el valor."], "explicacion": "Con pocas líneas obtienes constructor, representación legible e igualdad. `frozen=True` protege las lecturas históricas de cambios accidentales: un precio registrado no debería poder alterarse."}, "lentes": {"auto": "Modela cada fila de ventas como dataclass tipada y verifica el robot con mypy.", "juegos": "Define la configuración de cada enemigo como dataclass inmutable (frozen=True).", "bd": "Convierte cada fila en una dataclass tipada usando row_factory."}}, {"t": "collections, itertools y functools", "e": "🧰", "teoria": ["`collections` trae estructuras especializadas: `Counter` (contar), `defaultdict` (valores por defecto), `deque` (colas rápidas), `namedtuple`.", "`itertools` ofrece bloques para iterar: `count`, `cycle`, `islice`, `chain`, `groupby`, `combinations`, `product`.", "`functools` tiene herramientas funcionales: `lru_cache` (memoización), `partial`, `reduce`."], "code": "from collections import Counter, defaultdict\nfrom itertools import islice, count\nfrom functools import lru_cache\n\nprint(Counter(\"abracadabra\").most_common(2))\n\ngrupos = defaultdict(list)\nfor palabra in [\"sol\", \"mar\", \"sal\", \"luz\"]:\n    grupos[palabra[0]].append(palabra)\nprint(dict(grupos))\n\nprint(list(islice(count(10, 5), 4)))\n\n@lru_cache(maxsize=None)\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\nprint(fib(80))", "tips": ["Antes de escribir un algoritmo, revisa si itertools ya lo tiene.", "`lru_cache` convierte un fibonacci exponencial en lineal con una línea."], "ejercicio": "Con Counter, encuentra las 5 palabras más frecuentes de un texto largo, ignorando mayúsculas y signos.", "quiz": {"q": "Counter(\"hola\")[\"z\"] devuelve…", "o": ["False", "None", "KeyError", "0"], "a": 3, "x": "Counter devuelve 0 para claves inexistentes en lugar de fallar."}, "out": "[('a', 5), ('b', 2)]\n{'s': ['sol', 'sal'], 'm': ['mar'], 'l': ['luz']}\n[10, 15, 20, 25]\n23416728348467685", "a_fondo": ["`collections` trae estructuras especializadas: `Counter` cuenta elementos, `defaultdict` crea automáticamente un valor inicial para claves nuevas (adiós al `if clave not in d`), `deque` es una cola rápida por ambos extremos (con `maxlen` guarda solo los últimos N) y `namedtuple` da nombres a las posiciones de una tupla.", "`itertools` combina iteradores sin crear listas: `islice` toma una porción, `count` cuenta sin fin, `chain` encadena, `groupby` agrupa elementos consecutivos y `combinations` genera combinaciones.", "`functools` trabaja con funciones: `lru_cache` memoriza resultados para no recalcularlos, `partial` fija algunos argumentos de antemano y `reduce` acumula una secuencia en un solo valor.", "Antes de escribir un bucle con contadores y diccionarios a mano, pregúntate si alguno de estos módulos ya lo resuelve: el resultado suele ser más corto, más rápido y más claro."], "paso": ["`Counter(...).most_common(2)` da las dos letras más frecuentes.", "`defaultdict(list)` crea una lista vacía la primera vez que aparece cada inicial.", "`islice(count(10, 5), 4)` toma los 4 primeros de 10, 15, 20...", "`lru_cache` hace instantáneo el Fibonacci recursivo."], "errores": [["Counter no cuenta lo que esperabas", "`Counter(\"hola\")` cuenta letras. Para contar palabras pásale una lista: `Counter(texto.split())`."], ["groupby agrupa mal", "`groupby` solo agrupa elementos consecutivos: ordena antes por la misma clave."]], "practica": {"titulo": "Analizar precios de varias tiendas", "pieza": "Análisis con collections", "modo": "directo", "contexto": "", "stub": "from collections import Counter, defaultdict\n\n\ndef mejor_precio(lecturas):\n    mejores = {}\n    for producto, tienda, precio in lecturas:\n        if producto not in mejores or precio < mejores[producto][1]:\n            mejores[producto] = (tienda, precio)\n    return mejores\n\n\ndef victorias_por_tienda(lecturas):\n    return dict(Counter(t for t, _ in mejor_precio(lecturas).values()))\n\n\ndef tienda_ganadora(lecturas):\n    return Counter(victorias_por_tienda(lecturas)).most_common(1)[0][0]\n\n\ndef ultimos(precios, n):\n    return list(precios[-n:])\n", "enunciado": "Cada lectura es una tupla `(producto, tienda, precio)`. Escribe:\n\n• `mejor_precio(lecturas)`: diccionario `{producto: (tienda, precio)}` con la oferta más barata de cada producto.\n• `victorias_por_tienda(lecturas)`: diccionario `{tienda: cantidad}` de productos en los que cada tienda tiene el mejor precio (usa `Counter`).\n• `tienda_ganadora(lecturas)`: el nombre de la tienda con más victorias (usa `most_common`).\n• `ultimos(precios, n)`: lista con los últimos `n` precios (n ≥ 1). En tu IDE podrías usar `deque(precios, maxlen=n)`; aquí resuélvelo con un rebanado.", "plantilla": "from collections import Counter, defaultdict\n\n\ndef mejor_precio(lecturas):\n    \"\"\"{producto: (tienda, precio)} con el precio más bajo de cada producto.\"\"\"\n\n\ndef victorias_por_tienda(lecturas):\n    \"\"\"{tienda: cantidad de productos donde es la más barata}.\"\"\"\n\n\ndef tienda_ganadora(lecturas):\n    \"\"\"La tienda con más victorias.\"\"\"\n\n\ndef ultimos(precios, n):\n    \"\"\"Los últimos n precios (n >= 1).\"\"\"\n", "pruebas": "\nLEC = [(\"cable\", \"Centro\", 3.2), (\"cable\", \"Norte\", 3.0), (\"pintura\", \"Centro\", 12.5),\n       (\"pintura\", \"Norte\", 13.0), (\"rodillo\", \"Sur\", 5.9), (\"rodillo\", \"Centro\", 6.0),\n       (\"tornillo\", \"Norte\", 0.15), (\"tornillo\", \"Centro\", 0.2)]\ncaso(\"mejor_precio de cada producto\", lambda: mejor_precio(LEC), {\"cable\": (\"Norte\", 3.0), \"pintura\": (\"Centro\", 12.5), \"rodillo\": (\"Sur\", 5.9), \"tornillo\": (\"Norte\", 0.15)})\ncaso(\"mejor_precio de lista vacía\", lambda: mejor_precio([]), {})\ncaso(\"victorias por tienda\", lambda: victorias_por_tienda(LEC), {\"Norte\": 2, \"Centro\": 1, \"Sur\": 1}, \"Counter(tienda for tienda, _ in mejor_precio(lecturas).values())\")\ncaso(\"victorias devuelve un dict común\", lambda: type(victorias_por_tienda(LEC)).__name__, \"dict\")\ncaso(\"tienda ganadora: Norte\", lambda: tienda_ganadora(LEC), \"Norte\", \"most_common(1) devuelve [(tienda, cantidad)]: toma el primer elemento del primer par.\")\ncaso(\"ultimos 3 de 5 precios\", lambda: ultimos([10, 11, 12, 13, 14], 3), [12, 13, 14])\ncaso(\"ultimos con menos precios que n\", lambda: ultimos([1, 2], 5), [1, 2])\ncaso(\"Usaste Counter y defaultdict\", lambda: \"Counter\" in CODIGO and \"defaultdict\" in CODIGO, True, \"Agrupa con defaultdict(list) y cuenta con Counter: es el objetivo de la lección.\")\n", "solucion": "from collections import Counter, defaultdict\n\n\ndef mejor_precio(lecturas):\n    \"\"\"{producto: (tienda, precio)} con el precio más bajo de cada producto.\"\"\"\n    por_producto = defaultdict(list)\n    for producto, tienda, precio in lecturas:\n        por_producto[producto].append((tienda, precio))\n    return {prod: min(ofertas, key=lambda o: o[1]) for prod, ofertas in por_producto.items()}\n\n\ndef victorias_por_tienda(lecturas):\n    \"\"\"{tienda: cantidad de productos donde es la más barata}.\"\"\"\n    return dict(Counter(tienda for tienda, _ in mejor_precio(lecturas).values()))\n\n\ndef tienda_ganadora(lecturas):\n    \"\"\"La tienda con más victorias.\"\"\"\n    return Counter(victorias_por_tienda(lecturas)).most_common(1)[0][0]\n\n\ndef ultimos(precios, n):\n    \"\"\"Los últimos n precios (n >= 1).\"\"\"\n    return list(precios[-n:])\n", "pistas": ["`defaultdict(list)` agrupa las ofertas por producto sin preguntar si la clave existe.", "Los últimos n con un rebanado: `precios[-n:]`."], "explicacion": "Agrupar con `defaultdict`, elegir con `min(key=...)` y contar con `Counter` resuelve en pocas líneas un análisis que a mano llevaría varios diccionarios auxiliares. Las funciones se apoyan unas en otras, sin repetir lógica."}, "lentes": {"auto": "Usa defaultdict y Counter para totalizar ventas por sucursal y hallar los 5 productos más vendidos.", "juegos": "Usa deque para guardar las últimas 10 posiciones del jugador y dibujar una estela.", "bd": "Agrupa resultados por categoría con itertools.groupby y defaultdict."}}, {"t": "Expresiones regulares", "e": "🔎", "teoria": ["Las regex describen patrones de texto. `re.search` busca la primera coincidencia, `re.findall` todas, `re.sub` reemplaza.", "Piezas clave: `\\d` dígito, `\\w` letra/número, `\\s` espacio, `+` uno o más, `*` cero o más, `{n}` exactamente n, `[]` conjunto, `()` grupo.", "Usa strings crudos `r\"...\"` para que las barras invertidas no se interpreten dos veces."], "code": "import re\n\ntexto = \"Pedidos: A-102 el 03/10/2026, B-77 el 15/11/2026\"\nprint(re.findall(r\"[A-Z]-\\d+\", texto))\nprint(re.findall(r\"(\\d{2})/(\\d{2})/(\\d{4})\", texto))\nprint(re.sub(r\"\\d{4}\", \"AAAA\", texto))", "tips": ["Prueba tus patrones en regex101.com antes de ponerlos en el código.", "Si el patrón se usa muchas veces, compílalo con `re.compile`."], "ejercicio": "Extrae todos los correos electrónicos y números de teléfono de un texto.", "quiz": {"q": "¿Qué significa \\d+?", "o": ["Un decimal", "Cualquier carácter", "Uno o más dígitos", "Un dígito"], "a": 2, "x": "\\d es un dígito y + significa 'uno o más'."}, "out": "['A-102', 'B-77']\n[('03', '10', '2026'), ('15', '11', '2026')]\nPedidos: A-102 el 03/10/AAAA, B-77 el 15/11/AAAA", "a_fondo": ["Una expresión regular describe un patrón de texto. Las piezas básicas: `\\d` (dígito), `\\w` (letra, número o guion bajo), `\\s` (espacio), `.` (cualquier carácter), `[A-Z]` (un carácter del rango), `^` y `$` (inicio y fin) y `\\b` (borde de palabra).", "Los cuantificadores dicen cuántas veces: `+` (una o más), `*` (cero o más), `?` (opcional) y `{2,4}` (entre 2 y 4). Los paréntesis capturan grupos que luego recuperas; `(?:...)` agrupa sin capturar.", "Funciones de `re`: `search` encuentra la primera coincidencia (o `None`), `findall` devuelve todas, `sub` reemplaza y `fullmatch` exige que todo el texto coincida. Escribe los patrones como strings crudos, `r\"...\"`, para que las barras invertidas no se interpreten dos veces.", "Las regex son potentes pero difíciles de leer. Comenta las complejas, pruébalas con varios ejemplos (regex101.com ayuda muchísimo) y no las uses donde alcanza con `split`, `startswith` o `in`."], "paso": ["`[A-Z]-\\d+` captura una letra, un guion y uno o más dígitos.", "Con tres grupos, `findall` devuelve tuplas (día, mes, año).", "`sub` reemplaza cada año de cuatro dígitos por 'AAAA'."], "errores": [["re.error: bad escape", "Olvidaste la `r` del string crudo: escribe `r\"\\d+\"`."], ["AttributeError: 'NoneType' object has no attribute 'group'", "`search` no encontró nada y devolvió None. Comprueba el resultado antes de usar `.group()`."]], "practica": {"titulo": "Extraer precios de textos", "pieza": "Extracción con regex", "modo": "directo", "contexto": "", "stub": "import re\n\n\ndef extraer_precio(texto):\n    m = re.search(r\"\\d{1,3}(?:\\.\\d{3})+(?:,\\d+)?|\\d+(?:,\\d+)?\", texto)\n    return float(m.group().replace(\".\", \"\").replace(\",\", \".\")) if m else None\n\n\ndef extraer_codigos(texto):\n    return re.findall(r\"\\b[A-Z]{2,4}-\\d{2,6}\\b\", texto)\n\n\ndef normalizar_espacios(texto):\n    return re.sub(r\"\\s+\", \" \", texto).strip()\n", "enunciado": "Los avisos de las tiendas usan el formato local: punto para los miles y coma para los decimales.\n\n• `extraer_precio(texto)`: el primer precio del texto como float. \"$ 1.234,50\" → 1234.5; \"99,90 ARS\" → 99.9; \"Envío 2.500\" → 2500.0. Si no hay número, `None`.\n• `extraer_codigos(texto)`: lista de códigos de 2 a 4 mayúsculas, guion y 2 a 6 dígitos, como \"SKU-1234\".\n• `normalizar_espacios(texto)`: reemplaza cualquier grupo de espacios, tabulaciones o saltos de línea por un solo espacio y quita los de los bordes.", "plantilla": "import re\n\n\ndef extraer_precio(texto):\n    \"\"\"\n    >>> extraer_precio(\"Precio: $ 1.234,50\")\n    1234.5\n    \"\"\"\n\n\ndef extraer_codigos(texto):\n    \"\"\"\n    >>> extraer_codigos(\"SKU-1234, ab-12 y TUB-07\")\n    ['SKU-1234', 'TUB-07']\n    \"\"\"\n\n\ndef normalizar_espacios(texto):\n    \"\"\"\n    >>> normalizar_espacios(\"  hola   \\n  mundo \")\n    'hola mundo'\n    \"\"\"\n", "pruebas": "\ncaso(\"$ 1.234,50 -> 1234.5\", lambda: extraer_precio(\"Precio: $ 1.234,50\"), 1234.5, \"Quita los puntos de miles y cambia la coma por punto antes de float().\")\ncaso(\"99,90 ARS -> 99.9\", lambda: extraer_precio(\"Oferta 99,90 ARS\"), 99.9)\ncaso(\"Envío 2.500 -> 2500.0\", lambda: extraer_precio(\"Envío 2.500\"), 2500.0, \"El punto seguido de exactamente 3 dígitos indica miles.\")\ncaso(\"$15 -> 15.0\", lambda: extraer_precio(\"Solo $15 hoy\"), 15.0)\ncaso(\"Toma el primer precio\", lambda: extraer_precio(\"Antes 10,00 ahora 8,50\"), 10.0)\ncaso(\"Sin número -> None\", lambda: extraer_precio(\"Consultar precio\"), None, \"re.search devuelve None si no encuentra: compruébalo antes de usar .group().\")\ncaso(\"Códigos válidos\", lambda: extraer_codigos(\"SKU-1234, ab-12 y TUB-07\"), [\"SKU-1234\", \"TUB-07\"])\ncaso(\"No toma códigos dentro de palabras más largas\", lambda: extraer_codigos(\"XSKUAB-12345678 y PT-99\"), [\"PT-99\"], \"Usa \\\\b en ambos extremos del patrón.\")\ncaso(\"Normaliza espacios\", lambda: normalizar_espacios(\"  hola   \\n\\t mundo  \"), \"hola mundo\")\n", "solucion": "import re\n\nPRECIO = re.compile(r\"\\d{1,3}(?:\\.\\d{3})+(?:,\\d+)?|\\d+(?:,\\d+)?\")\n\n\ndef extraer_precio(texto):\n    \"\"\"\n    >>> extraer_precio(\"Precio: $ 1.234,50\")\n    1234.5\n    \"\"\"\n    m = PRECIO.search(texto)\n    if m is None:\n        return None\n    return float(m.group().replace(\".\", \"\").replace(\",\", \".\"))\n\n\ndef extraer_codigos(texto):\n    \"\"\"\n    >>> extraer_codigos(\"SKU-1234, ab-12 y TUB-07\")\n    ['SKU-1234', 'TUB-07']\n    \"\"\"\n    return re.findall(r\"\\b[A-Z]{2,4}-\\d{2,6}\\b\", texto)\n\n\ndef normalizar_espacios(texto):\n    \"\"\"\n    >>> normalizar_espacios(\"  hola   \\n  mundo \")\n    'hola mundo'\n    \"\"\"\n    return re.sub(r\"\\s+\", \" \", texto).strip()\n", "pistas": ["Patrón de precio: grupos de miles `\\d{1,3}(?:\\.\\d{3})+` o un número simple `\\d+`, con decimales opcionales `(?:,\\d+)?`.", "`\\s+` atrapa espacios, tabulaciones y saltos de línea juntos."], "explicacion": "La alternativa `|` prueba primero el formato con miles y, si no aplica, un número simple. Compilar el patrón con `re.compile` y darle un nombre lo hace reutilizable y más legible. La conversión final adapta el formato local al que entiende `float`."}, "lentes": {"auto": "Extrae números de factura, identificadores fiscales y montos del texto de correos con expresiones regulares.", "juegos": "Valida nombres para el ranking con una regex: de 3 a 12 letras o números.", "bd": "Valida correos y teléfonos con regex antes de insertarlos."}}, {"t": "Concurrencia y asyncio", "e": "🚀", "teoria": ["Tres caminos: `threading` para tareas que esperan E/S (red, disco); `multiprocessing` para cálculos pesados de CPU (esquiva el GIL); `asyncio` para miles de operaciones de E/S concurrentes.", "En `asyncio`, `async def` define corrutinas y `await` cede el control mientras se espera. `asyncio.gather` ejecuta varias a la vez.", "`concurrent.futures` ofrece una interfaz común para hilos y procesos con `ThreadPoolExecutor` y `ProcessPoolExecutor`."], "code": "import asyncio\n\nasync def descargar(nombre, segundos):\n    await asyncio.sleep(segundos)\n    return f\"{nombre} listo ({segundos}s)\"\n\nasync def main():\n    tareas = [descargar(\"A\", 0.3), descargar(\"B\", 0.1), descargar(\"C\", 0.2)]\n    for r in await asyncio.gather(*tareas):\n        print(r)\n\nasyncio.run(main())", "tips": ["Las tres tareas tardan 0.3 s en total, no 0.6 s: esperan en paralelo.", "Nunca uses `time.sleep` dentro de código async: bloquea todo. Usa `await asyncio.sleep`."], "ejercicio": "Simula la descarga de 10 archivos con tiempos aleatorios y compara el tiempo secuencial vs. con gather.", "quiz": {"q": "Para un cálculo pesado de CPU en CPython conviene…", "o": ["asyncio", "multiprocessing", "threading", "un bucle while"], "a": 1, "x": "El GIL impide que los hilos ejecuten bytecode en paralelo; los procesos no comparten GIL."}, "out": "A listo (0.3s)\nB listo (0.1s)\nC listo (0.2s)", "a_fondo": ["Concurrencia es avanzar varias tareas a la vez. Hay tres caminos: `threading` (hilos) para tareas que esperan entrada/salida, `multiprocessing` para cálculos pesados que necesitan varios núcleos, y `asyncio` para miles de esperas de red con un solo hilo.", "En `asyncio`, una función `async def` es una corrutina: al llamarla no se ejecuta, se crea una tarea pendiente. `await` pausa la corrutina mientras espera (una respuesta de red, un `sleep`) y le cede el turno al bucle de eventos, que mientras tanto avanza otras tareas.", "`asyncio.gather(*tareas)` lanza varias corrutinas juntas y espera a todas: el tiempo total es el de la más lenta, no la suma. `asyncio.Semaphore(n)` limita cuántas corren a la vez, para no saturar a un servidor. `asyncio.run(main())` arranca todo.", "En la práctica vas a calcular, sin ejecutar nada en paralelo, cuánto tardaría cada estrategia. Es exactamente el razonamiento que hace falta para decidir cómo consultar muchas tiendas: entender el planificador antes de usarlo. El código asíncrono real lo escribes en tu IDE con el ejercicio de la lección."], "paso": ["`descargar` es una corrutina: `await asyncio.sleep` simula una espera de red.", "`gather` lanza las tres a la vez; el total es 0,3 s, no 0,6 s.", "Los resultados vuelven en el orden en que se pasaron las tareas, no en el que terminaron."], "errores": [["RuntimeWarning: coroutine was never awaited", "Llamaste a una función async sin `await`. Corrutina llamada sin await = tarea que nunca se ejecuta."], ["Usar time.sleep dentro de async", "`time.sleep` bloquea todo el bucle de eventos. Dentro de corrutinas usa `await asyncio.sleep`."]], "practica": {"titulo": "Simula el planificador de tareas", "pieza": "Planificación de consultas concurrentes", "modo": "directo", "contexto": "", "stub": "import heapq\n\n\ndef tiempo_secuencial(duraciones):\n    return sum(duraciones)\n\n\ndef tiempo_concurrente(duraciones):\n    return max(duraciones, default=0)\n\n\ndef tiempo_con_limite(duraciones, limite):\n    fines = []\n    for d in duraciones:\n        if len(fines) < limite:\n            heapq.heappush(fines, d)\n        else:\n            heapq.heappush(fines, heapq.heappop(fines) + d)\n    return max(fines, default=0)\n", "enunciado": "Cada consulta a una tienda tarda un tiempo conocido (en segundos). Calcula cuánto tardaría consultarlas todas con cada estrategia:\n\n• `tiempo_secuencial(duraciones)`: una después de otra (como un `for` con `await` dentro).\n• `tiempo_concurrente(duraciones)`: todas a la vez (como `asyncio.gather`).\n• `tiempo_con_limite(duraciones, limite)`: como `gather` con un `Semaphore(limite)`. Las tareas arrancan en orden y cada una toma el primer lugar que se libera.\n\nCon una lista vacía, las tres devuelven 0.", "plantilla": "import heapq\n\n\ndef tiempo_secuencial(duraciones):\n    \"\"\"[3, 1, 2] -> 6\"\"\"\n\n\ndef tiempo_concurrente(duraciones):\n    \"\"\"[3, 1, 2] -> 3\"\"\"\n\n\ndef tiempo_con_limite(duraciones, limite):\n    \"\"\"\n    [3, 1, 2] con limite 2 -> 3\n    t=0: arrancan 3 y 1 · t=1: termina la de 1 y arranca la de 2 · t=3: terminan ambas.\n    Pista: guarda en un heap el momento en que se libera cada lugar.\n    \"\"\"\n", "pruebas": "\ncaso(\"Secuencial de [3, 1, 2] = 6\", lambda: tiempo_secuencial([3, 1, 2]), 6)\ncaso(\"Concurrente de [3, 1, 2] = 3 (la más lenta)\", lambda: tiempo_concurrente([3, 1, 2]), 3)\ncaso(\"Lista vacía: 0 en las tres\", lambda: (tiempo_secuencial([]), tiempo_concurrente([]), tiempo_con_limite([], 2)), (0, 0, 0), \"max() de una lista vacía falla: usa max(duraciones, default=0).\")\ncaso(\"Límite 2 con [3, 1, 2] = 3\", lambda: tiempo_con_limite([3, 1, 2], 2), 3)\ncaso(\"Límite 1 equivale a secuencial\", lambda: tiempo_con_limite([3, 1, 2], 1), 6)\ncaso(\"Límite mayor que las tareas equivale a concurrente\", lambda: tiempo_con_limite([3, 1, 2], 10), 3)\ncaso(\"Cuatro tareas de 2 s de a 2 = 4\", lambda: tiempo_con_limite([2, 2, 2, 2], 2), 4)\ncaso(\"Orden de arranque: [1, 1, 4, 1] de a 2 = 5\", lambda: tiempo_con_limite([1, 1, 4, 1], 2), 5, \"Cada tarea toma el lugar que se libera primero: heappop da el menor tiempo de fin.\")\ncaso(\"Con decimales: [0.3, 0.1, 0.2, 0.4] de a 2 = 0.7\", lambda: round(tiempo_con_limite([0.3, 0.1, 0.2, 0.4], 2), 6), 0.7, \"La de 0.2 toma el lugar que se libera en 0.1; la de 0.4, el que se libera en 0.3.\")\n", "solucion": "import heapq\n\n\ndef tiempo_secuencial(duraciones):\n    \"\"\"[3, 1, 2] -> 6\"\"\"\n    return sum(duraciones)\n\n\ndef tiempo_concurrente(duraciones):\n    \"\"\"[3, 1, 2] -> 3\"\"\"\n    return max(duraciones, default=0)\n\n\ndef tiempo_con_limite(duraciones, limite):\n    \"\"\"Simula gather + Semaphore(limite).\"\"\"\n    fines = []   # heap: momento en que se libera cada lugar ocupado\n    for d in duraciones:\n        if len(fines) < limite:\n            heapq.heappush(fines, d)\n        else:\n            libre = heapq.heappop(fines)\n            heapq.heappush(fines, libre + d)\n    return max(fines, default=0)\n", "pistas": ["Un heap (`heapq`) siempre entrega primero el menor: el lugar que se libera antes.", "Mientras haya lugares libres, cada tarea termina en `d`; después, en `momento_libre + d`."], "explicacion": "Es el corazón de un semáforo: hay `limite` lugares, y cada tarea nueva espera al que se libera primero. El heap guarda los momentos de fin, y el tiempo total es el mayor de ellos. Con esto puedes justificar con números por qué conviene `gather` con un límite razonable."}, "lentes": {"auto": "Descarga en paralelo los reportes de varias sucursales simuladas con asyncio.gather.", "juegos": "Carga los recursos con asyncio mientras muestras una pantalla de carga animada.", "bd": "Consulta varias bases en paralelo con aiosqlite y asyncio.gather."}}, {"t": "Logging profesional", "e": "📝", "teoria": ["`logging` reemplaza a los `print` de depuración: tiene niveles (DEBUG, INFO, WARNING, ERROR, CRITICAL), formato configurable y destinos múltiples (consola, archivo, servicios).", "Cada módulo crea su logger con `logging.getLogger(__name__)`; la configuración se hace una sola vez al inicio de la aplicación.", "Pasa los datos como argumentos (`log.info(\"%d items\", n)`) en lugar de f-strings: solo se formatean si el mensaje realmente se muestra."], "code": "import logging, sys\n\nlogging.basicConfig(level=logging.INFO, stream=sys.stdout,\n                    format=\"%(levelname)s | %(name)s | %(message)s\")\nlog = logging.getLogger(\"inventario\")\n\nlog.debug(\"esto no se ve\")\nlog.info(\"Stock cargado: %d productos\", 120)\nlog.warning(\"Producto %s bajo mínimo\", \"TUBO-12\")", "tips": ["`log.exception(\"...\")` dentro de un except registra el traceback completo.", "Usa `RotatingFileHandler` para que los archivos de log no crezcan sin límite."], "ejercicio": "Agrega logging a tu gestor de tareas: INFO para acciones, WARNING para entradas inválidas y un archivo de log.", "quiz": {"q": "Con level=INFO, ¿se muestran los mensajes DEBUG?", "o": ["Solo en archivos", "Depende del SO", "No", "Sí"], "a": 2, "x": "Se muestran los mensajes del nivel configurado hacia arriba; DEBUG está por debajo de INFO."}, "out": "INFO | inventario | Stock cargado: 120 productos\nWARNING | inventario | Producto TUBO-12 bajo mínimo", "a_fondo": ["`logging` reemplaza a los `print` de depuración. Cada mensaje tiene un nivel (DEBUG, INFO, WARNING, ERROR, CRITICAL) y puedes elegir desde qué nivel mostrar sin tocar el código: en desarrollo ves todo, en producción solo lo importante.", "Un logger se obtiene con `logging.getLogger(\"nombre\")`, normalmente uno por módulo. Los handlers deciden adónde van los mensajes (consola, archivo, archivo rotativo) y los formatters cómo se ven (fecha, nivel, módulo, mensaje).", "Pasa los datos como argumentos y no con f-strings: `log.info(\"Stock: %d\", n)`. Así el texto solo se arma si el mensaje realmente se va a mostrar.", "Diseñar qué es WARNING y qué es ERROR es una decisión de negocio. En el monitor, una variación grande de precio merece atención (WARNING); un cambio chico es informativo (INFO)."], "paso": ["`basicConfig` fija el nivel mínimo (INFO), la salida y el formato.", "El DEBUG no se muestra porque está por debajo de INFO.", "Los `%d` y `%s` se completan con los argumentos."], "errores": [["No aparece ningún mensaje", "El nivel configurado es más alto que el de tus mensajes, o `basicConfig` se llamó después de crear handlers."], ["Mensajes duplicados", "Agregaste el mismo handler más de una vez, o el logger propaga al raíz que también tiene handler."]], "practica": {"titulo": "Registrar cambios de precio", "pieza": "Registro de cambios con niveles", "modo": "directo", "contexto": "", "stub": "def variacion_pct(antes, ahora):\n    return round((ahora - antes) / antes * 100, 1)\n\n\ndef nivel_para(cambio_pct):\n    if cambio_pct == 0:\n        return \"DEBUG\"\n    return \"WARNING\" if abs(cambio_pct) >= 20 else \"INFO\"\n\n\ndef registrar_cambio(log, producto, antes, ahora):\n    pct = variacion_pct(antes, ahora)\n    nivel = nivel_para(pct)\n    getattr(log, nivel.lower())(f\"{producto}: {antes:.2f} -> {ahora:.2f} ({pct:+.1f}%)\")\n    return nivel\n", "enunciado": "• `variacion_pct(antes, ahora)`: variación porcentual redondeada a 1 decimal. Si `antes` es 0, lanza `ValueError`.\n• `nivel_para(cambio_pct)`: \"DEBUG\" si no cambió, \"WARNING\" si la variación es de 20 % o más (subida o bajada) e \"INFO\" en otro caso.\n• `registrar_cambio(log, producto, antes, ahora)`: llama al método del logger según el nivel (`log.info`, `log.warning`...) con el mensaje `\"cable: 10.00 -> 8.00 (-20.0%)\"` y devuelve el nivel usado.\n\nEl evaluador te pasa un logger falso que anota lo que recibe: así se prueban los logs sin configurar nada.", "plantilla": "def variacion_pct(antes, ahora):\n    \"\"\"10 -> 8 da -20.0\"\"\"\n\n\ndef nivel_para(cambio_pct):\n    \"\"\"0 -> DEBUG; |cambio| >= 20 -> WARNING; si no, INFO.\"\"\"\n\n\ndef registrar_cambio(log, producto, antes, ahora):\n    \"\"\"Registra con el nivel adecuado y devuelve el nivel.\"\"\"\n    # Pista: getattr(log, \"warning\") es lo mismo que log.warning\n", "pruebas": "\nclass LogFalso:\n    def __init__(self):\n        self.registro = []\n    def debug(self, m, *a): self.registro.append((\"DEBUG\", m % a if a else m))\n    def info(self, m, *a): self.registro.append((\"INFO\", m % a if a else m))\n    def warning(self, m, *a): self.registro.append((\"WARNING\", m % a if a else m))\n    def error(self, m, *a): self.registro.append((\"ERROR\", m % a if a else m))\ncaso(\"10 -> 8 es -20.0 %\", lambda: variacion_pct(10, 8), -20.0)\ncaso(\"4 -> 5 es 25.0 %\", lambda: variacion_pct(4, 5), 25.0)\ncaso(\"antes = 0 lanza ValueError\", lambda: lanza(ValueError, variacion_pct, 0, 5), True, \"Revisa antes de dividir y lanza ValueError con un mensaje claro.\")\ncaso(\"Niveles según la variación\", lambda: [nivel_para(x) for x in (0, 5.0, -19.9, -20.0, 25.0)], [\"DEBUG\", \"INFO\", \"INFO\", \"WARNING\", \"WARNING\"], \"Usa abs() para que cuente igual una subida que una bajada.\")\nlog = LogFalso()\ncaso(\"Una baja de 20 % se registra como WARNING\", lambda: registrar_cambio(log, \"cable\", 10, 8), \"WARNING\")\ncaso(\"... con el mensaje con formato\", lambda: log.registro[-1], (\"WARNING\", \"cable: 10.00 -> 8.00 (-20.0%)\"), \"f\\\"{producto}: {antes:.2f} -> {ahora:.2f} ({pct:+.1f}%)\\\": el + muestra el signo siempre.\")\ncaso(\"Una suba chica es INFO y muestra el +\", lambda: (registrar_cambio(log, \"pintura\", 10, 10.5), log.registro[-1]), (\"INFO\", (\"INFO\", \"pintura: 10.00 -> 10.50 (+5.0%)\")))\ncaso(\"Sin cambio es DEBUG\", lambda: (registrar_cambio(log, \"rodillo\", 6, 6), log.registro[-1][0]), (\"DEBUG\", \"DEBUG\"))\n", "solucion": "def variacion_pct(antes, ahora):\n    \"\"\"10 -> 8 da -20.0\"\"\"\n    if antes == 0:\n        raise ValueError(\"No se puede calcular la variación desde un precio 0\")\n    return round((ahora - antes) / antes * 100, 1)\n\n\ndef nivel_para(cambio_pct):\n    \"\"\"0 -> DEBUG; |cambio| >= 20 -> WARNING; si no, INFO.\"\"\"\n    if cambio_pct == 0:\n        return \"DEBUG\"\n    if abs(cambio_pct) >= 20:\n        return \"WARNING\"\n    return \"INFO\"\n\n\ndef registrar_cambio(log, producto, antes, ahora):\n    \"\"\"Registra con el nivel adecuado y devuelve el nivel.\"\"\"\n    pct = variacion_pct(antes, ahora)\n    nivel = nivel_para(pct)\n    mensaje = f\"{producto}: {antes:.2f} -> {ahora:.2f} ({pct:+.1f}%)\"\n    getattr(log, nivel.lower())(mensaje)\n    return nivel\n", "pistas": ["El formato `:+.1f` muestra el signo y un decimal: `+5.0`, `-20.0`.", "`getattr(log, nivel.lower())` obtiene el método por su nombre."], "explicacion": "La decisión del nivel está separada del registro: `nivel_para` se puede probar sola, sin ningún logger. Y `registrar_cambio` acepta cualquier objeto con métodos `info`, `warning`, etc. (un logger real o uno falso): eso es lo que permite probarla."}, "lentes": {"auto": "Configura un log rotativo con un resumen final: archivos procesados, saltados y con error.", "juegos": "Registra en un log los eventos de cada partida (nivel, muertes, tiempo) para ajustar la dificultad.", "bd": "Registra con logging las consultas que tarden más de 100 ms."}}, {"t": "APIs y HTTP", "e": "🌐", "teoria": ["Una API web permite que programas conversen por HTTP. Los verbos principales: GET (leer), POST (crear), PUT/PATCH (actualizar), DELETE (borrar).", "La librería `requests` (o `httpx`, que además soporta async) simplifica las llamadas. La mayoría de APIs responde en JSON.", "Buenas prácticas: siempre `timeout`, verificar el código de estado con `raise_for_status()`, guardar claves en variables de entorno y respetar los límites de uso."], "code": "import requests\n\nresp = requests.get(\"https://api.github.com/repos/python/cpython\", timeout=10)\nresp.raise_for_status()\nrepo = resp.json()\nprint(repo[\"full_name\"], \"-\", repo[\"stargazers_count\"], \"estrellas\")", "tips": ["Nunca escribas una API key directamente en el código: usa `os.environ` o un archivo .env.", "Usa `requests.Session()` cuando hagas muchas llamadas al mismo servidor."], "ejercicio": "Consulta una API pública de clima o tipo de cambio y muestra el dato formateado; maneja errores de red con elegancia.", "quiz": {"q": "¿Por qué pasar timeout a requests.get?", "o": ["Para ir más rápido", "Para que el programa no quede colgado indefinidamente", "Para cachear", "Es obligatorio"], "a": 1, "x": "Sin timeout, una conexión que no responde puede bloquear tu programa para siempre."}, "out": "python/cpython - 6xxxx estrellas   (el número cambia con el tiempo)", "run": false, "a_fondo": ["Una API web permite que dos programas conversen por HTTP. El cliente envía una petición con un verbo (GET leer, POST crear, PUT o PATCH actualizar, DELETE borrar), una URL y, a veces, un cuerpo JSON; el servidor responde con un código de estado y datos.", "Los códigos de estado se leen por centenas: 2xx éxito, 3xx redirección, 4xx error del cliente (404 no encontrado, 401 sin autorización, 429 demasiadas peticiones) y 5xx error del servidor. Los 429 y 5xx suelen ser temporales y merecen un reintento; los 4xx no.", "Los parámetros de consulta van en la URL después de `?`: `?producto=cable+2mm&pagina=2`. `urllib.parse.urlencode` los arma escapando espacios y símbolos correctamente.", "Con `requests`: `requests.get(url, params=..., timeout=10)`, `resp.raise_for_status()` lanza error ante 4xx y 5xx, y `resp.json()` convierte el cuerpo. Pon siempre un `timeout`: sin él, un servidor colgado congela tu programa para siempre."], "paso": ["`requests.get` hace la petición con un límite de 10 segundos.", "`raise_for_status` convierte un error HTTP en excepción.", "`resp.json()` devuelve el diccionario con los datos del repositorio."], "errores": [["requests.exceptions.Timeout", "El servidor no respondió a tiempo. Es un error temporal: reintenta con espera creciente."], ["JSONDecodeError al llamar a .json()", "La respuesta no era JSON (por ejemplo, una página de error HTML). Revisa el código de estado antes."]], "practica": {"titulo": "Hablar con la API de una tienda", "pieza": "Cliente de API", "modo": "directo", "contexto": "", "stub": "import json\nfrom urllib.parse import urlencode\n\n\ndef construir_url(base, **params):\n    limpios = {k: v for k, v in params.items() if v is not None}\n    return f\"{base}?{urlencode(limpios)}\" if limpios else base\n\n\ndef procesar_respuesta(estado, cuerpo):\n    if estado == 200:\n        return json.loads(cuerpo)[\"productos\"]\n    if estado == 404:\n        return []\n    if estado == 429 or estado >= 500:\n        raise ConnectionError(f\"Error temporal {estado}: reintentar\")\n    raise ValueError(f\"Respuesta inesperada: {estado}\")\n", "enunciado": "• `construir_url(base, **params)`: arma la URL con los parámetros de consulta, ignorando los que valgan `None`. Sin parámetros, devuelve la base tal cual.\n\n  `construir_url(\"https://api.ej.com/precios\", producto=\"cable 2mm\", pagina=2, tienda=None)` → `\"https://api.ej.com/precios?producto=cable+2mm&pagina=2\"`\n\n• `procesar_respuesta(estado, cuerpo)`: con 200 devuelve la lista `\"productos\"` del JSON; con 404 devuelve `[]`; con 429 o cualquier 5xx lanza `ConnectionError` (temporal: tu decorador `reintentar` lo aprovechará); con cualquier otro código lanza `ValueError`.", "plantilla": "import json\nfrom urllib.parse import urlencode\n\n\ndef construir_url(base, **params):\n    \"\"\"URL con parámetros de consulta, sin los None.\"\"\"\n\n\ndef procesar_respuesta(estado, cuerpo):\n    \"\"\"Interpreta el código de estado y el cuerpo JSON.\"\"\"\n", "pruebas": "\ncaso(\"URL con parámetros y sin los None\", lambda: construir_url(\"https://api.ej.com/precios\", producto=\"cable 2mm\", pagina=2, tienda=None), \"https://api.ej.com/precios?producto=cable+2mm&pagina=2\", \"Filtra los None con una comprensión de diccionario y usa urlencode.\")\ncaso(\"Sin parámetros, la base sola\", lambda: construir_url(\"https://api.ej.com/precios\"), \"https://api.ej.com/precios\", \"No agregues el ? si no hay parámetros.\")\ncaso(\"Solo None también da la base\", lambda: construir_url(\"https://x.com\", a=None), \"https://x.com\")\ncaso(\"Escapa símbolos\", lambda: construir_url(\"https://x.com\", q=\"a&b\"), \"https://x.com?q=a%26b\")\ncaso(\"200 devuelve los productos\", lambda: procesar_respuesta(200, '{\"productos\": [[\"cable\", 3.0]]}'), [[\"cable\", 3.0]])\ncaso(\"404 devuelve lista vacía\", lambda: procesar_respuesta(404, \"\"), [])\ncaso(\"429 lanza ConnectionError\", lambda: lanza(ConnectionError, procesar_respuesta, 429, \"\"), True)\ncaso(\"503 lanza ConnectionError\", lambda: lanza(ConnectionError, procesar_respuesta, 503, \"\"), True, \"Cualquier estado >= 500 es temporal.\")\ncaso(\"401 lanza ValueError (no se reintenta)\", lambda: lanza(ValueError, procesar_respuesta, 401, \"\"), True)\n", "solucion": "import json\nfrom urllib.parse import urlencode\n\n\ndef construir_url(base, **params):\n    \"\"\"URL con parámetros de consulta, sin los None.\"\"\"\n    limpios = {k: v for k, v in params.items() if v is not None}\n    if not limpios:\n        return base\n    return f\"{base}?{urlencode(limpios)}\"\n\n\ndef procesar_respuesta(estado, cuerpo):\n    \"\"\"Interpreta el código de estado y el cuerpo JSON.\"\"\"\n    if estado == 200:\n        return json.loads(cuerpo)[\"productos\"]\n    if estado == 404:\n        return []\n    if estado == 429 or estado >= 500:\n        raise ConnectionError(f\"Error temporal {estado}: reintentar\")\n    raise ValueError(f\"Respuesta inesperada: {estado}\")\n", "pistas": ["`urlencode({\"producto\": \"cable 2mm\"})` da `producto=cable+2mm`.", "Ordena las condiciones: primero los casos concretos (200, 404), después los rangos."], "explicacion": "Separar armar la URL e interpretar la respuesta de la petición HTTP en sí deja la lógica probable sin red. Clasificar los errores en temporales (`ConnectionError`) y definitivos (`ValueError`) es lo que permite que `reintentar` actúe solo cuando tiene sentido."}, "lentes": {"auto": "Consulta una API de tipo de cambio y agrega una columna convertida a tu planilla consolidada.", "juegos": "Envía el puntaje final a una API de ranking simulada, con timeout y manejo de errores.", "bd": "Sincroniza una tabla local con datos de una API pública sin duplicar registros."}}, {"t": "Empaquetado y distribución", "e": "📦", "teoria": ["`pyproject.toml` es el estándar moderno para describir un proyecto: nombre, versión, dependencias y herramienta de construcción.", "La estructura recomendada es `src/mi_paquete/` más una carpeta `tests/`. Así evitas importar por accidente código no instalado.", "Con `python -m build` generas el paquete y con `twine upload` lo publicas en PyPI. Puedes definir comandos de consola en `[project.scripts]`."], "code": "[project]\nname = \"pythonia-utils\"\nversion = \"0.1.0\"\nrequires-python = \">=3.10\"\ndependencies = [\"requests>=2.31\"]\n\n[project.scripts]\npythonia = \"pythonia_utils.cli:main\"\n\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"", "tips": ["Versiona con SemVer: MAYOR.MENOR.PARCHE.", "`pip install -e .` instala en modo editable: tus cambios se reflejan sin reinstalar."], "ejercicio": "Empaqueta tus utilidades favoritas como paquete instalable con un comando de consola.", "quiz": {"q": "¿Qué archivo es el estándar moderno para configurar un paquete?", "o": ["requirements.txt", "setup.cfg", "pyproject.toml", "package.json"], "a": 2, "x": "pyproject.toml (PEP 517/518/621) centraliza la configuración."}, "out": "$ pip install -e .\n$ pythonia --help", "run": false, "lang": "toml", "a_fondo": ["`pyproject.toml` es el estándar para describir un proyecto de Python: nombre, versión, versión mínima de Python, dependencias, scripts de consola y herramientas (como ruff o pytest). Herramientas como `pip`, `uv` o `hatch` lo leen para instalar y construir el paquete.", "Se recomienda la estructura `src/`: el código vive en `src/mi_paquete/`, lo que obliga a instalarlo (`pip install -e .`) para probarlo y evita importar por accidente desde la carpeta equivocada.", "El versionado semántico usa MAYOR.MENOR.PARCHE: el parche corrige errores sin cambiar nada más, el menor agrega funciones compatibles y el mayor rompe compatibilidad. Al subir una parte, las de la derecha vuelven a 0: de 1.4.2 a menor da 1.5.0.", "Comparar versiones como texto es un error clásico: `\"1.10.0\" < \"1.9.0\"` es True porque compara carácter por carácter. Hay que convertir cada parte a número y comparar tuplas."], "paso": ["`[project]` define nombre, versión, Python mínimo y dependencias.", "`[project.scripts]` crea el comando `pythonia` que ejecuta la función `main`.", "`[build-system]` indica con qué herramienta se construye el paquete."], "errores": [["ModuleNotFoundError al ejecutar tests", "Con estructura src/, instala el paquete en modo editable: `pip install -e .`."], ["Comparar versiones como texto", "\"1.10\" es menor que \"1.9\" como texto. Convierte a tuplas de enteros."]], "practica": {"titulo": "Versionado semántico", "pieza": "Versionado del monitor", "modo": "directo", "contexto": "", "stub": "def comparar_versiones(a, b):\n    ta, tb = tuple(map(int, a.split(\".\"))), tuple(map(int, b.split(\".\")))\n    return (ta > tb) - (ta < tb)\n\n\ndef siguiente_version(version, parte):\n    mayor, menor, parche = map(int, version.split(\".\"))\n    if parte == \"major\":\n        return f\"{mayor + 1}.0.0\"\n    if parte == \"minor\":\n        return f\"{mayor}.{menor + 1}.0\"\n    if parte == \"patch\":\n        return f\"{mayor}.{menor}.{parche + 1}\"\n    raise ValueError(f\"Parte desconocida: {parte}\")\n", "enunciado": "• `comparar_versiones(a, b)`: devuelve -1 si `a` es anterior, 0 si son iguales y 1 si `a` es posterior. Compara número por número: \"1.10.0\" es posterior a \"1.9.3\".\n• `siguiente_version(version, parte)`: con parte \"major\", \"minor\" o \"patch\" devuelve la versión siguiente, poniendo en 0 las partes de la derecha. Con otra parte, lanza `ValueError`.", "plantilla": "def comparar_versiones(a, b):\n    \"\"\"\n    >>> comparar_versiones(\"1.10.0\", \"1.9.3\")\n    1\n    \"\"\"\n\n\ndef siguiente_version(version, parte):\n    \"\"\"\n    >>> siguiente_version(\"1.4.2\", \"minor\")\n    '1.5.0'\n    \"\"\"\n", "pruebas": "\ncaso(\"1.10.0 es posterior a 1.9.3\", lambda: comparar_versiones(\"1.10.0\", \"1.9.3\"), 1, \"Como texto daría al revés: convierte cada parte con int().\")\ncaso(\"Iguales dan 0\", lambda: comparar_versiones(\"2.0.1\", \"2.0.1\"), 0)\ncaso(\"0.9.9 es anterior a 1.0.0\", lambda: comparar_versiones(\"0.9.9\", \"1.0.0\"), -1)\ncaso(\"Parche: 1.4.2 -> 1.4.3\", lambda: siguiente_version(\"1.4.2\", \"patch\"), \"1.4.3\")\ncaso(\"Menor: 1.4.2 -> 1.5.0\", lambda: siguiente_version(\"1.4.2\", \"minor\"), \"1.5.0\", \"Al subir el menor, el parche vuelve a 0.\")\ncaso(\"Mayor: 1.4.2 -> 2.0.0\", lambda: siguiente_version(\"1.4.2\", \"major\"), \"2.0.0\")\ncaso(\"Pasa de 9 a 10 sin problemas\", lambda: siguiente_version(\"1.9.9\", \"minor\"), \"1.10.0\")\ncaso(\"Parte desconocida lanza ValueError\", lambda: lanza(ValueError, siguiente_version, \"1.0.0\", \"mega\"), True)\n", "solucion": "def comparar_versiones(a, b):\n    \"\"\"\n    >>> comparar_versiones(\"1.10.0\", \"1.9.3\")\n    1\n    \"\"\"\n    ta = tuple(int(p) for p in a.split(\".\"))\n    tb = tuple(int(p) for p in b.split(\".\"))\n    if ta < tb:\n        return -1\n    if ta > tb:\n        return 1\n    return 0\n\n\ndef siguiente_version(version, parte):\n    \"\"\"\n    >>> siguiente_version(\"1.4.2\", \"minor\")\n    '1.5.0'\n    \"\"\"\n    mayor, menor, parche = (int(p) for p in version.split(\".\"))\n    if parte == \"major\":\n        return f\"{mayor + 1}.0.0\"\n    if parte == \"minor\":\n        return f\"{mayor}.{menor + 1}.0\"\n    if parte == \"patch\":\n        return f\"{mayor}.{menor}.{parche + 1}\"\n    raise ValueError(f\"Parte desconocida: {parte}\")\n", "pistas": ["Las tuplas se comparan elemento por elemento: `(1, 10, 0) > (1, 9, 3)`.", "Desempaqueta las tres partes: `mayor, menor, parche = ...`."], "explicacion": "Convertir a tuplas de enteros delega la comparación en Python, que compara posición por posición. El versionado semántico comunica a quien usa tu paquete cuánto riesgo tiene actualizar."}, "lentes": {"auto": "Empaqueta tu robot como comando de consola: robot-reportes --carpeta ./entrada.", "juegos": "Empaqueta tu juego como paquete instalable con el comando mi-juego.", "bd": "Empaqueta tus utilidades de base de datos como una librería interna."}}]}, {"id": 4, "nombre": "Maestro", "nivel": "Experto", "semanas": 12, "color": "#7B2CBF", "lema": "Entender Python por dentro y diseñar sistemas que duran.", "objetivo": "Dominar el modelo de datos, la metaprogramación, los internals de CPython, la optimización, la arquitectura y la calidad de software a nivel profesional.", "proyecto": {"t": "Framework de automatización con plugins", "desc": "Una librería publicable donde cada tarea (descargar, transformar, exportar, notificar) es un plugin que se registra solo, con pipeline asíncrono, tipado estricto y CI.", "pasos": ["Diseña el núcleo con arquitectura limpia y contratos vía Protocol.", "Implementa el registro de plugins con __init_subclass__ y validación con descriptores.", "Ejecuta pipelines con TaskGroup, semáforos y manejo de ExceptionGroup.", "Perfila y optimiza el cuello de botella (NumPy o caché).", "Cobertura > 90 % con fixtures, parametrize, mocks e hypothesis.", "Publica en TestPyPI con CI (ruff, mypy, pytest) y documentación con MkDocs."]}, "proyecto_app": {"archivo": "mini_framework.py", "titulo": "Framework de automatización con plugins", "intro": "Un pequeño framework para encadenar pasos de procesamiento, configurado con validación automática, extensible con plugins que se registran solos y con eventos para avisar resultados. Cada lección del Nivel 4 aporta una pieza del motor.", "final": "\n# ═══════════════ Ensamble final (escrito por Pythonia, usa tus piezas) ═══════════════\ndef ejecutar_tarea(tarea, notificar, reintentos=1):\n    \"\"\"Ejecuta tarea(); reintenta ante errores y avisa el resultado con notificar(mensaje).\"\"\"\n    for intento in range(reintentos + 1):\n        try:\n            resultado = tarea()\n        except Exception as e:\n            if intento == reintentos:\n                notificar(f\"error: {e}\")\n                return False\n        else:\n            notificar(f\"ok: {resultado}\")\n            return True\n\n\nclass Invertir(Plugin, nombre=\"invertir\"):\n    def ejecutar(self, dato):\n        return dato[::-1]\n\n\ndef demo():\n    \"\"\"Recorrido automático por todas tus piezas.\"\"\"\n    print(\"Plugins registrados:\", sorted(Plugin.registro))\n    registro = {n: Plugin.crear(n).ejecutar for n in Plugin.registro}\n    config = Config(reintentos=2, timeout=30)\n    app = crear_app({\"plugins\": [\"recortar\", \"mayus\", \"invertir\"], \"reintentos\": config.reintentos}, registro)\n    bus = EventBus()\n\n    @bus.al(\"procesado\")\n    def avisar(dato):\n        return f\"listo: {dato}\"\n\n    for texto in [\"  hola mundo \", \" python \"]:\n        print(bus.emitir(\"procesado\", app.procesar(texto)))\n    pipe = Pipeline(str.strip, str.title) + Pipeline(lambda s: s + \"!\")\n    print(len(pipe), \"pasos ->\", repr(pipe(\"  pythonia maestro \")))\n    print(\"Lotes para 3 trabajadores:\", dividir_en_lotes(list(range(10)), 3))\n    print(\"Conteo combinado:\", combinar([{\"cable\": 1}, {\"cable\": 2, \"rodillo\": 1}]))\n    print(\"Duplicados:\", duplicados([\"a\", \"b\", \"a\", \"c\", \"b\"]), \"| faltan:\", faltantes([\"a\", \"x\", \"b\"], [\"a\", \"b\"]))\n    print(\"Producto punto:\", producto_punto([1, 2, 3], [4, 5, 6]), \"| normalizado:\", normalizar([10, 20, 30]))\n    contar = crear_contador()\n    contar()\n    print(\"Ejecuciones contadas:\", contar(), \"| pasos independientes:\", agregar_paso(\"a\"), agregar_paso(\"b\"))\n    try:\n        Config(reintentos=50)\n    except ValueError as e:\n        print(\"Configuración rechazada:\", e)\n    print(\"── Tus tests ──\")\n    for nombre, prueba in list(globals().items()):\n        if nombre.startswith(\"test_\") and callable(prueba):\n            prueba()\n            print(\"✔\", nombre)\n\n\nif __name__ == \"__main__\":\n    demo()\n"}, "lecciones": [{"t": "El modelo de datos a fondo", "e": "🧠", "teoria": ["Todo en Python es un objeto, y casi toda la sintaxis se traduce en métodos especiales: `a + b` es `a.__add__(b)`, `len(x)` es `x.__len__()`, `x[i]` es `x.__getitem__(i)`.", "Implementar protocolos (`__iter__`, `__getitem__`, `__call__`, `__enter__`, `__hash__`) hace que tus objetos se comporten como nativos.", "`__slots__` elimina el `__dict__` por instancia: ahorra memoria cuando creas millones de objetos y restringe qué atributos existen."], "code": "class Vector:\n    __slots__ = (\"x\", \"y\")\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __add__(self, otro):\n        return Vector(self.x + otro.x, self.y + otro.y)\n    def __mul__(self, k):\n        return Vector(self.x * k, self.y * k)\n    __rmul__ = __mul__\n    def __abs__(self):\n        return (self.x ** 2 + self.y ** 2) ** 0.5\n    def __repr__(self):\n        return f\"Vector({self.x}, {self.y})\"\n\nv = Vector(3, 4)\nprint(v + Vector(1, 1), 2 * v, abs(v))", "tips": ["Si defines `__eq__`, define también `__hash__` (o el objeto deja de ser hasheable).", "Devuelve `NotImplemented` (no lanzar error) cuando un operador no soporta el tipo recibido."], "ejercicio": "Crea una clase Matriz que soporte +, *, ==, len(), indexación m[i][j] e iteración por filas.", "quiz": {"q": "¿Qué logra __slots__?", "o": ["Hace la clase inmutable", "Hace la clase abstracta", "Evita el __dict__ por instancia y ahorra memoria", "Acelera los métodos"], "a": 2, "x": "Los atributos se guardan en espacios fijos en lugar de un diccionario."}, "out": "Vector(4, 5) Vector(6, 8) 5.0", "a_fondo": ["Todo en Python es un objeto y casi toda la sintaxis se traduce en llamadas a métodos especiales (dunder): `a + b` llama a `a.__add__(b)`, `len(x)` a `x.__len__()`, `x[i]` a `x.__getitem__(i)`, `for` usa `__iter__` y `obj()` usa `__call__`.", "Implementar estos métodos hace que tus clases se comporten como tipos nativos: se pueden sumar, medir, indexar, recorrer y llamar. Es lo que permite que pandas, NumPy o pathlib se sientan parte del lenguaje.", "Si un método binario no sabe operar con el tipo recibido, debe devolver `NotImplemented` (no lanzar un error): Python probará entonces la operación reflejada del otro objeto (`__radd__`) y, si nadie puede, lanzará `TypeError` solo.", "`__repr__` debe mostrar el objeto sin ambigüedad (idealmente como se construiría) y `__str__` una versión amigable. `__bool__` o, en su defecto, `__len__` deciden si el objeto es verdadero: un contenedor vacío es falso."], "paso": ["`__slots__` fija los atributos permitidos y ahorra memoria.", "`__add__` y `__mul__` definen `+` y `*`; `__rmul__ = __mul__` permite `2 * v`.", "`__abs__` responde a `abs(v)` con la longitud del vector.", "`__repr__` define cómo se ve al imprimirlo."], "errores": [["TypeError: unsupported operand type(s) for +", "Tu `__add__` devolvió `NotImplemented` y el otro objeto tampoco supo sumar: es el comportamiento correcto ante tipos incompatibles."], ["RecursionError en __repr__", "Dentro de `__repr__` usaste `repr(self)` o una f-string con `{self}`."]], "practica": {"titulo": "Un Pipeline que se comporta como un tipo nativo", "pieza": "Pipeline (modelo de datos)", "modo": "directo", "contexto": "", "stub": "class Pipeline:\n    def __init__(self, *pasos):\n        self.pasos = list(pasos)\n\n    def __len__(self):\n        return len(self.pasos)\n\n    def __iter__(self):\n        return iter(self.pasos)\n\n    def __getitem__(self, i):\n        return Pipeline(*self.pasos[i]) if isinstance(i, slice) else self.pasos[i]\n\n    def __add__(self, otro):\n        if not isinstance(otro, Pipeline):\n            return NotImplemented\n        return Pipeline(*self.pasos, *otro.pasos)\n\n    def __call__(self, dato):\n        for paso in self.pasos:\n            dato = paso(dato)\n        return dato\n\n    def __repr__(self):\n        return \"Pipeline(\" + \" → \".join(getattr(p, \"__name__\", type(p).__name__) for p in self.pasos) + \")\"\n", "enunciado": "Crea `Pipeline(*pasos)`, una secuencia de funciones que se aplican en orden a un dato:\n\n• `len(p)`, `for paso in p` y `p[0]` funcionan como en una lista; `p[1:]` devuelve un nuevo `Pipeline`.\n• `p1 + p2` devuelve un Pipeline nuevo con los pasos de ambos (sin modificarlos). Sumar algo que no es Pipeline debe terminar en `TypeError`.\n• `p(dato)` aplica todos los pasos en orden y devuelve el resultado.\n• `repr(p)` es `\"Pipeline(limpiar → mayus)\"` con los nombres de las funciones, o `\"Pipeline()\"` si está vacío.\n• Un Pipeline vacío es falso en un `if`.", "plantilla": "class Pipeline:\n    \"\"\"Pipeline(paso1, paso2)(dato) == paso2(paso1(dato))\"\"\"\n\n    def __init__(self, *pasos):\n        self.pasos = list(pasos)\n", "pruebas": "\ndef limpiar(s): return s.strip()\ndef mayus(s): return s.upper()\ndef exclamar(s): return s + \"!\"\np = Pipeline(limpiar, mayus)\ncaso(\"len() cuenta los pasos\", lambda: len(p), 2, \"Implementa __len__.\")\ncaso(\"Se puede recorrer con for\", lambda: [f.__name__ for f in p], [\"limpiar\", \"mayus\"], \"Implementa __iter__ devolviendo iter(self.pasos).\")\ncaso(\"p[0] es el primer paso\", lambda: p[0] is limpiar, True)\ncaso(\"p[1:] devuelve un Pipeline\", lambda: (type(p[1:]).__name__, len(p[1:])), (\"Pipeline\", 1), \"En __getitem__, si recibes un slice, construye un Pipeline nuevo.\")\ncaso(\"Llamarlo aplica los pasos en orden\", lambda: p(\"  hola \"), \"HOLA\", \"Implementa __call__.\")\nq = p + Pipeline(exclamar)\ncaso(\"p + otro combina los pasos\", lambda: (len(q), q(\"  hola \")), (3, \"HOLA!\"))\ncaso(\"La suma no modifica los originales\", lambda: len(p), 2)\ncaso(\"Sumar algo que no es Pipeline da TypeError\", lambda: lanza(TypeError, lambda: p + 5), True, \"Devuelve NotImplemented en __add__ cuando el otro no es Pipeline.\")\ncaso(\"repr muestra los nombres de los pasos\", lambda: repr(p), \"Pipeline(limpiar → mayus)\")\ncaso(\"repr de un Pipeline vacío\", lambda: repr(Pipeline()), \"Pipeline()\")\ncaso(\"Un Pipeline vacío es falso\", lambda: (bool(Pipeline()), bool(p)), (False, True), \"Con __len__ definido, Python ya lo resuelve.\")\ncaso(\"Un Pipeline vacío devuelve el dato intacto\", lambda: Pipeline()(42), 42)\n", "solucion": "class Pipeline:\n    \"\"\"Pipeline(paso1, paso2)(dato) == paso2(paso1(dato))\"\"\"\n\n    def __init__(self, *pasos):\n        self.pasos = list(pasos)\n\n    def __len__(self):\n        return len(self.pasos)\n\n    def __iter__(self):\n        return iter(self.pasos)\n\n    def __getitem__(self, indice):\n        if isinstance(indice, slice):\n            return Pipeline(*self.pasos[indice])\n        return self.pasos[indice]\n\n    def __add__(self, otro):\n        if not isinstance(otro, Pipeline):\n            return NotImplemented\n        return Pipeline(*self.pasos, *otro.pasos)\n\n    def __call__(self, dato):\n        for paso in self.pasos:\n            dato = paso(dato)\n        return dato\n\n    def __repr__(self):\n        nombres = \" → \".join(getattr(p, \"__name__\", type(p).__name__) for p in self.pasos)\n        return f\"Pipeline({nombres})\"\n", "pistas": ["`isinstance(indice, slice)` distingue `p[1:]` de `p[1]`.", "`getattr(paso, \"__name__\", ...)` evita errores con objetos que no tienen nombre."], "explicacion": "Seis métodos especiales convierten una clase común en algo que se usa con la sintaxis de Python: `len`, `for`, índices, `+`, llamada y `repr`. Devolver `NotImplemented` deja que Python genere el `TypeError` correcto."}, "lentes": {"auto": "Haz que tu clase Planilla soporte len(), iteración por filas e indexación planilla['A1'].", "juegos": "Implementa __add__ y __mul__ en tu propia clase Vector y úsala en la física del juego.", "bd": "Haz que un objeto Tabla soporte len(), in e iteración usando consultas por debajo."}}, {"t": "Descriptores y properties", "e": "🎯", "teoria": ["Un descriptor es un objeto con `__get__`, `__set__` o `__delete__` que controla el acceso a un atributo de otra clase.", "`property`, `classmethod`, `staticmethod` y los métodos mismos están implementados como descriptores.", "Son ideales para validación reutilizable: escribes la regla una vez y la aplicas a muchos atributos."], "code": "class Positivo:\n    def __set_name__(self, owner, name):\n        self.privado = \"_\" + name\n    def __get__(self, obj, tipo=None):\n        return getattr(obj, self.privado)\n    def __set__(self, obj, valor):\n        if valor <= 0:\n            raise ValueError(f\"{self.privado[1:]} debe ser > 0\")\n        setattr(obj, self.privado, valor)\n\nclass Pedido:\n    cantidad = Positivo()\n    precio = Positivo()\n    def __init__(self, cantidad, precio):\n        self.cantidad, self.precio = cantidad, precio\n\np = Pedido(3, 12.5)\nprint(p.cantidad * p.precio)\ntry:\n    p.cantidad = -1\nexcept ValueError as e:\n    print(e)", "tips": ["`__set_name__` (Python 3.6+) le dice al descriptor con qué nombre fue asignado.", "Para un solo atributo, `@property` es más simple; los descriptores brillan al reutilizar."], "ejercicio": "Crea descriptores EnRango(min, max) y NoVacio y úsalos en una clase Empleado.", "quiz": {"q": "¿property es un descriptor?", "o": ["Solo con setter", "No", "Solo en Python 2", "Sí"], "a": 3, "x": "property implementa __get__, __set__ y __delete__."}, "out": "37.5\ncantidad debe ser > 0", "a_fondo": ["Un descriptor es un objeto, definido como atributo de clase, que controla el acceso a ese atributo en las instancias mediante `__get__`, `__set__` y `__delete__`. Así funcionan por dentro `property`, los métodos y los campos de los ORM como SQLAlchemy.", "`__set_name__(self, dueño, nombre)` se llama al crear la clase dueña y le dice al descriptor con qué nombre fue asignado. Con eso puede guardar el valor real en un atributo privado de la instancia, como `_reintentos`.", "`__get__(self, obj, tipo)` recibe `obj=None` cuando se accede desde la clase (`Config.reintentos`); por convención devuelve el propio descriptor en ese caso. Cuando se accede desde una instancia, devuelve el valor guardado.", "`@property` es un descriptor listo para un solo atributo. Cuando la misma regla se repite en muchos atributos o clases (valores positivos, rangos, tipos), un descriptor propio evita copiar la validación en cada `setter`."], "paso": ["`__set_name__` guarda el nombre privado (por ejemplo `_cantidad`).", "`__get__` lee el valor desde la instancia.", "`__set__` valida antes de guardar y lanza `ValueError` si no cumple.", "La validación corre también dentro de `__init__`, porque asignar pasa por el descriptor."], "errores": [["RecursionError en __set__", "Guardaste con `setattr(obj, nombre_publico, ...)`, que vuelve a llamar al descriptor. Usa el nombre privado."], ["Todas las instancias comparten el valor", "Guardaste el valor en el descriptor (`self.valor`), que es uno solo por clase. Guárdalo en `obj`."]], "practica": {"titulo": "Configuración validada con descriptores", "pieza": "Config con descriptores", "modo": "directo", "contexto": "", "stub": "class Rango:\n    def __init__(self, minimo, maximo):\n        self.minimo, self.maximo = minimo, maximo\n\n    def __set_name__(self, dueno, nombre):\n        self.nombre, self.privado = nombre, \"_\" + nombre\n\n    def __get__(self, obj, tipo=None):\n        return self if obj is None else getattr(obj, self.privado)\n\n    def __set__(self, obj, valor):\n        if isinstance(valor, bool) or not is
