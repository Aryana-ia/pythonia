lantilla": "def visibles(objetos, camara):\n    \"\"\"Objetos dentro de la cámara.\"\"\"\n\n\ndef a_pantalla(objeto, camara):\n    \"\"\"(x, y) relativa a la cámara.\"\"\"\n", "pruebas": "\nCAM = (1000, 0, 640, 360)\nOBJ = [(990, 50, 20, 20), (500, 50, 20, 20), (1300, 100, 32, 32), (1700, 0, 10, 10), (1200, 400, 10, 10)]\ncaso(\"Filtra los objetos visibles\", lambda: visibles(OBJ, CAM), [(990, 50, 20, 20), (1300, 100, 32, 32)], \"Un objeto que asoma en el borde también es visible.\")\ncaso(\"Posición en pantalla\", lambda: a_pantalla((1300, 100, 32, 32), CAM), (300, 100))\ncaso(\"Sin objetos\", lambda: visibles([], CAM), [])\n", "solucion": "def _chocan(a, b):\n    ax, ay, aw, ah = a\n    bx, by, bw, bh = b\n    return ax < bx + bw and ax + aw > bx and ay < by + bh and ay + ah > by\n\n\ndef visibles(objetos, camara):\n    \"\"\"Objetos dentro de la cámara.\"\"\"\n    return [o for o in objetos if _chocan(o, camara)]\n\n\ndef a_pantalla(objeto, camara):\n    \"\"\"(x, y) relativa a la cámara.\"\"\"\n    return objeto[0] - camara[0], objeto[1] - camara[1]\n", "pistas": ["Ver si un objeto es visible es una colisión con el rectángulo de la cámara.", "Restar la posición de la cámara pasa de coordenadas del mundo a la pantalla."], "explicacion": "Descartar lo que no se ve (culling) es una de las optimizaciones más rentables: en un nivel grande, se dibuja una fracción pequeña de los objetos."}}, {"t": "Empaquetar y publicar", "e": "📦", "teoria": ["PyInstaller convierte tu juego en un ejecutable que se abre sin tener Python instalado.", "Los recursos (imágenes, sonidos) deben empaquetarse junto al ejecutable y buscarse con una función que funcione tanto en desarrollo como empaquetado.", "itch.io es la plataforma más amigable para publicar juegos independientes, gratis o pagos."], "code": "import sys\nfrom pathlib import Path\n\ndef recurso(ruta_relativa: str) -> Path:\n    \"\"\"Encuentra assets en desarrollo y dentro del ejecutable de PyInstaller.\"\"\"\n    base = Path(getattr(sys, \"_MEIPASS\", Path(__file__).parent))\n    return base / ruta_relativa\n\n# imagen = pygame.image.load(recurso(\"assets/nave.png\")).convert_alpha()\n\n# En la terminal:\n# pip install pyinstaller\n# pyinstaller --onefile --windowed --add-data \"assets:assets\" juego.py", "tips": ["`pygbag` publica juegos de pygame para jugarse directamente en el navegador.", "Prueba el ejecutable en una computadora sin Python antes de publicarlo."], "ejercicio": "Empaqueta tu juego, súbelo a itch.io como borrador y pide a dos personas que lo prueben.", "quiz": {"q": "¿Para qué sirve sys._MEIPASS?", "o": ["Indica la carpeta temporal donde PyInstaller descomprime los recursos", "Mide FPS", "Activa el audio", "Guarda el récord"], "a": 0, "x": "Solo existe dentro del ejecutable; en desarrollo se usa la carpeta del archivo."}, "out": "dist/juego.exe   <- tu juego listo para compartir\n(en Windows usa --add-data \"assets;assets\")", "run": false, "practica": {"titulo": "Armar el comando de PyInstaller", "contexto": "", "enunciado": "Escribe `comando_pyinstaller(script, sistema, assets=\"assets\")`, que devuelve el comando para empaquetar el juego: `pyinstaller --onefile --windowed --add-data \"assets;assets\" juego.py`. En Windows el separador de `--add-data` es `;` y en el resto (`\"linux\"`, `\"mac\"`) es `:`. Si `assets` es `None`, el comando no lleva `--add-data`. Escribe también `nombre_ejecutable(script, sistema)`: `\"juego.exe\"` en Windows y `\"juego\"` en el resto.", "plantilla": "def comando_pyinstaller(script, sistema, assets=\"assets\"):\n    \"\"\"comando_pyinstaller(\"juego.py\", \"windows\")\"\"\"\n\n\ndef nombre_ejecutable(script, sistema):\n    \"\"\"\"juego.py\" -> \"juego.exe\" en Windows\"\"\"\n", "pruebas": "\ncaso(\"Windows usa ;\", lambda: comando_pyinstaller(\"juego.py\", \"windows\"), 'pyinstaller --onefile --windowed --add-data \"assets;assets\" juego.py')\ncaso(\"Linux y mac usan :\", lambda: (comando_pyinstaller(\"juego.py\", \"linux\"), comando_pyinstaller(\"juego.py\", \"mac\")), ('pyinstaller --onefile --windowed --add-data \"assets:assets\" juego.py',) * 2)\ncaso(\"Sin assets\", lambda: comando_pyinstaller(\"main.py\", \"windows\", None), \"pyinstaller --onefile --windowed main.py\")\ncaso(\"Carpeta de recursos personalizada\", lambda: comando_pyinstaller(\"j.py\", \"linux\", \"datos\"), 'pyinstaller --onefile --windowed --add-data \"datos:datos\" j.py')\ncaso(\"Nombre del ejecutable\", lambda: (nombre_ejecutable(\"juego.py\", \"windows\"), nombre_ejecutable(\"juego.py\", \"mac\")), (\"juego.exe\", \"juego\"), \"Quita la extensión .py con rpartition o removesuffix.\")\n", "solucion": "def comando_pyinstaller(script, sistema, assets=\"assets\"):\n    \"\"\"Comando de PyInstaller según el sistema.\"\"\"\n    partes = [\"pyinstaller\", \"--onefile\", \"--windowed\"]\n    if assets:\n        sep = \";\" if sistema == \"windows\" else \":\"\n        partes.append(f'--add-data \"{assets}{sep}{assets}\"')\n    partes.append(script)\n    return \" \".join(partes)\n\n\ndef nombre_ejecutable(script, sistema):\n    \"\"\"Nombre del archivo final.\"\"\"\n    base = script.rpartition(\".\")[0] or script\n    return base + \".exe\" if sistema == \"windows\" else base\n", "pistas": ["Arma una lista de partes y únelas con `\" \".join`.", "El separador cambia solo según el sistema."], "explicacion": "Generar el comando con código evita el error más común al publicar: usar el separador de otro sistema operativo y que el ejecutable arranque sin sus imágenes."}}]}]}, {"slug": "bd", "t": "Bases de datos", "e": "🗄️", "color": "#0F766E", "lema": "Datos ordenados, consultas rápidas y aplicaciones confiables.", "objetivo": "Diseñar y consultar bases de datos relacionales con SQL, sqlite3, SQLAlchemy y PostgreSQL, y analizar grandes volúmenes con DuckDB.", "proyecto": {"t": "Sistema de inventario con reportes", "desc": "Un sistema de inventario multisucursal con modelo relacional, capa de repositorio, ORM, reportes analíticos y pruebas automatizadas.", "pasos": ["Diseña el modelo (sucursales, productos, movimientos, pedidos) y dibuja su diagrama.", "Implementa los modelos con SQLAlchemy y migraciones con Alembic.", "Crea una capa Repository y la lógica de negocio (entradas, salidas, transferencias).", "Agrega índices según los planes de consulta de los reportes.", "Genera reportes analíticos con DuckDB a partir de una exportación Parquet.", "Cubre la lógica con tests usando el repositorio en memoria."]}, "modulos": [{"t": "SQL esencial", "nivel": 2, "prereq": ["2-3"], "mision": "Responde 10 preguntas de negocio con SQL sobre una base de ventas de ejemplo.", "lecciones": [{"t": "SELECT, WHERE y ORDER BY", "e": "🔎", "teoria": ["SQL es el lenguaje de las bases de datos relacionales. Una tabla tiene filas (registros) y columnas (campos).", "`SELECT columnas FROM tabla WHERE condición ORDER BY columna` es la consulta más usada del mundo. `COUNT`, `SUM` y `AVG` resumen datos.", "SQLite viene incluido en Python: con `sqlite3.connect(\":memory:\")` tienes una base para practicar al instante."], "code": "import sqlite3\n\ncon = sqlite3.connect(\":memory:\")\ncon.executescript(\"\"\"\nCREATE TABLE productos (id INTEGER PRIMARY KEY, nombre TEXT, categoria TEXT, precio REAL, stock INTEGER);\nINSERT INTO productos (nombre, categoria, precio, stock) VALUES\n ('Cable 2mm', 'Electricidad', 3.2, 150), ('Pintura blanca', 'Pinturas', 12.5, 40),\n ('Tornillo', 'Ferretería', 0.15, 2000), ('Bombillo LED', 'Electricidad', 2.8, 0),\n ('Rodillo', 'Pinturas', 6.0, 25);\n\"\"\")\n\nconsulta = \"\"\"\nSELECT nombre, precio FROM productos\nWHERE categoria = 'Electricidad' OR precio > 10\nORDER BY precio DESC\n\"\"\"\nfor fila in con.execute(consulta):\n    print(fila)\nprint(\"Sin stock:\", con.execute(\"SELECT COUNT(*) FROM productos WHERE stock = 0\").fetchone()[0])", "tips": ["En SQL los textos van entre comillas simples: `'Pinturas'`.", "Practica con la extensión SQLite Viewer de VS Code o con DB Browser for SQLite."], "ejercicio": "Consulta los productos con stock entre 1 y 50 ordenados por nombre, y el precio promedio por categoría.", "quiz": {"q": "¿Qué cláusula filtra filas en SQL?", "o": ["SELECT", "WHERE", "ORDER BY", "FROM"], "a": 1, "x": "WHERE conserva solo las filas que cumplen la condición."}, "out": "('Pintura blanca', 12.5)\n('Cable 2mm', 3.2)\n('Bombillo LED', 2.8)\nSin stock: 1", "practica": {"titulo": "Un SELECT escrito a mano", "contexto": "PRODUCTOS = [\n    {\"id\": 1, \"nombre\": \"Cable 2mm\", \"categoria\": \"Electricidad\", \"precio\": 3.2, \"stock\": 150},\n    {\"id\": 2, \"nombre\": \"Pintura blanca\", \"categoria\": \"Pinturas\", \"precio\": 12.5, \"stock\": 40},\n    {\"id\": 3, \"nombre\": \"Tornillo\", \"categoria\": \"Ferretería\", \"precio\": 0.15, \"stock\": 2000},\n    {\"id\": 4, \"nombre\": \"Bombillo LED\", \"categoria\": \"Electricidad\", \"precio\": 2.8, \"stock\": 0},\n    {\"id\": 5, \"nombre\": \"Rodillo\", \"categoria\": \"Pinturas\", \"precio\": 6.0, \"stock\": 25},\n]", "enunciado": "Para entender qué hace el motor con tu SQL, impleméntalo en Python. Ya existe `PRODUCTOS`, una lista de diccionarios (una tabla). Escribe `seleccionar(tabla, columnas=None, donde=None, orden=None, desc=False)`:\n\n• `donde`: una función que recibe una fila y devuelve True si se queda (WHERE);\n• `orden`: el nombre de la columna para ordenar (ORDER BY), descendente si `desc`;\n• `columnas`: lista de columnas a devolver (SELECT col1, col2); si es None, todas.\n\nDevuelve una lista de diccionarios nuevos y no modifica la tabla.", "plantilla": "def seleccionar(tabla, columnas=None, donde=None, orden=None, desc=False):\n    \"\"\"SELECT columnas FROM tabla WHERE donde ORDER BY orden\"\"\"\n", "pruebas": "\nimport copy\nORIG = copy.deepcopy(PRODUCTOS)\ncaso(\"SELECT nombre, precio WHERE categoria = 'Electricidad' OR precio > 10 ORDER BY precio DESC\",\n     lambda: seleccionar(PRODUCTOS, [\"nombre\", \"precio\"], lambda f: f[\"categoria\"] == \"Electricidad\" or f[\"precio\"] > 10, \"precio\", True),\n     [{\"nombre\": \"Pintura blanca\", \"precio\": 12.5}, {\"nombre\": \"Cable 2mm\", \"precio\": 3.2}, {\"nombre\": \"Bombillo LED\", \"precio\": 2.8}])\ncaso(\"Sin filtro ni orden devuelve todas las filas\", lambda: len(seleccionar(PRODUCTOS)), 5)\ncaso(\"Solo con WHERE\", lambda: [f[\"id\"] for f in seleccionar(PRODUCTOS, donde=lambda f: f[\"stock\"] == 0)], [4])\ncaso(\"ORDER BY ascendente\", lambda: [f[\"nombre\"] for f in seleccionar(PRODUCTOS, [\"nombre\"], orden=\"nombre\")], [\"Bombillo LED\", \"Cable 2mm\", \"Pintura blanca\", \"Rodillo\", \"Tornillo\"])\ncaso(\"No modifica la tabla\", lambda: (seleccionar(PRODUCTOS, [\"id\"], orden=\"precio\"), PRODUCTOS == ORIG)[1], True, \"Crea diccionarios nuevos con {c: fila[c] for c in columnas}.\")\n", "solucion": "def seleccionar(tabla, columnas=None, donde=None, orden=None, desc=False):\n    \"\"\"SELECT columnas FROM tabla WHERE donde ORDER BY orden\"\"\"\n    filas = [f for f in tabla if donde is None or donde(f)]\n    if orden:\n        filas = sorted(filas, key=lambda f: f[orden], reverse=desc)\n    if columnas:\n        return [{c: f[c] for c in columnas} for f in filas]\n    return [dict(f) for f in filas]\n", "pistas": ["El orden de las operaciones es el del motor: primero WHERE, después ORDER BY y al final SELECT de columnas.", "`dict(f)` copia una fila."], "explicacion": "Así trabaja un motor de base de datos, en ese orden: filtra, ordena y proyecta columnas. Escribirlo una vez a mano hace que SQL deje de ser magia."}}, {"t": "JOIN y GROUP BY", "e": "🔗", "teoria": ["Los datos se reparten en tablas relacionadas. `JOIN` las une por una columna común; `LEFT JOIN` conserva las filas de la izquierda aunque no tengan pareja.", "`GROUP BY` agrupa filas para resumirlas: total de ventas por sucursal, cantidad de pedidos por cliente.", "`HAVING` filtra después de agrupar (por ejemplo, sucursales con más de 100 en ventas); `WHERE` filtra antes."], "code": "import sqlite3\n\ncon = sqlite3.connect(\":memory:\")\ncon.executescript(\"\"\"\nCREATE TABLE sucursales (id INTEGER PRIMARY KEY, nombre TEXT);\nCREATE TABLE ventas (id INTEGER PRIMARY KEY, sucursal_id INTEGER, monto REAL);\nINSERT INTO sucursales VALUES (1, 'Centro'), (2, 'Norte'), (3, 'Sur');\nINSERT INTO ventas (sucursal_id, monto) VALUES (1, 120), (1, 80), (2, 200), (1, 50), (2, 30);\n\"\"\")\n\nconsulta = \"\"\"\nSELECT s.nombre, COUNT(v.id) AS ventas, COALESCE(SUM(v.monto), 0) AS total\nFROM sucursales s\nLEFT JOIN ventas v ON v.sucursal_id = s.id\nGROUP BY s.id\nORDER BY total DESC\n\"\"\"\nfor fila in con.execute(consulta):\n    print(fila)", "tips": ["Usa alias cortos (`s`, `v`) para que las consultas con JOIN sean legibles.", "Con `LEFT JOIN`, la sucursal Sur aparece aunque no tenga ventas: por eso usamos COALESCE."], "ejercicio": "Agrega una tabla productos y obtén el producto más vendido de cada sucursal.", "quiz": {"q": "Si una sucursal no tiene ventas, ¿qué JOIN la muestra igual?", "o": ["INNER JOIN", "Ninguno", "CROSS JOIN", "LEFT JOIN desde sucursales"], "a": 3, "x": "LEFT JOIN conserva todas las filas de la tabla de la izquierda."}, "out": "('Centro', 3, 250.0)\n('Norte', 2, 230.0)\n('Sur', 0, 0)", "practica": {"titulo": "LEFT JOIN y GROUP BY a mano", "contexto": "", "enunciado": "Escribe `totales_por_sucursal(sucursales, ventas)`: `sucursales` es una lista de `(id, nombre)` y `ventas` una lista de `(sucursal_id, monto)`. Devuelve una lista de tuplas `(nombre, cantidad_de_ventas, total)` que incluya las sucursales sin ventas (con 0 y 0, como un LEFT JOIN), ordenada por total de mayor a menor y, si empatan, por nombre.", "plantilla": "def totales_por_sucursal(sucursales, ventas):\n    \"\"\"Equivale a un LEFT JOIN con GROUP BY.\"\"\"\n", "pruebas": "\nS = [(1, \"Centro\"), (2, \"Norte\"), (3, \"Sur\")]\nV = [(1, 120), (1, 80), (2, 200), (1, 50), (2, 30)]\ncaso(\"Agrupa, cuenta y suma\", lambda: totales_por_sucursal(S, V), [(\"Centro\", 3, 250), (\"Norte\", 2, 230), (\"Sur\", 0, 0)], \"Inicializa cada sucursal con 0 antes de recorrer las ventas: eso es el LEFT JOIN.\")\ncaso(\"Empates ordenados por nombre\", lambda: totales_por_sucursal([(1, \"B\"), (2, \"A\")], [(1, 10), (2, 10)]), [(\"A\", 1, 10), (\"B\", 1, 10)], \"sorted(..., key=lambda t: (-t[2], t[0]))\")\ncaso(\"Sin ventas, todas en cero\", lambda: totales_por_sucursal(S, []), [(\"Centro\", 0, 0), (\"Norte\", 0, 0), (\"Sur\", 0, 0)])\n", "solucion": "def totales_por_sucursal(sucursales, ventas):\n    \"\"\"Equivale a un LEFT JOIN con GROUP BY.\"\"\"\n    grupos = {sid: [nombre, 0, 0] for sid, nombre in sucursales}\n    for sid, monto in ventas:\n        if sid in grupos:\n            grupos[sid][1] += 1\n            grupos[sid][2] += monto\n    filas = [tuple(g) for g in grupos.values()]\n    return sorted(filas, key=lambda t: (-t[2], t[0]))\n", "pistas": ["Crea primero un grupo vacío por sucursal.", "Ordenar por `-total` da orden descendente sin perder el desempate ascendente por nombre."], "explicacion": "Arrancar con todas las sucursales en cero es exactamente lo que hace el LEFT JOIN; recorrer las ventas acumulando es el GROUP BY con COUNT y SUM."}}]}, {"t": "sqlite3 desde Python", "nivel": 2, "prereq": ["2-2", "2-4"], "mision": "Crea una agenda de clientes de consola con búsqueda, alta, edición y baja.", "lecciones": [{"t": "Parámetros seguros y filas como diccionarios", "e": "🛡️", "teoria": ["Nunca armes SQL concatenando textos del usuario: es la puerta de la inyección SQL. Usa parámetros `?` y pasa los valores aparte.", "`executemany` inserta muchas filas de una vez; `commit()` confirma los cambios en el archivo.", "Con `row_factory = sqlite3.Row` cada fila se accede por nombre de columna, como un diccionario."], "code": "import sqlite3\n\ncon = sqlite3.connect(\"tienda.db\")\ncon.row_factory = sqlite3.Row\ncon.execute(\"CREATE TABLE IF NOT EXISTS clientes (id INTEGER PRIMARY KEY, nombre TEXT, ciudad TEXT)\")\nnuevos = [(\"Ana\", \"Lima\"), (\"Luis\", \"Quito\"), (\"Marta\", \"Lima\")]\ncon.executemany(\"INSERT INTO clientes (nombre, ciudad) VALUES (?, ?)\", nuevos)\ncon.commit()\n\nciudad = \"Lima\"   # imagina que viene del usuario\nfor f in con.execute(\"SELECT * FROM clientes WHERE ciudad = ?\", (ciudad,)):\n    print(f[\"id\"], f[\"nombre\"], dict(f))\n\nmalicioso = \"x' OR '1'='1\"\ntotal = con.execute(\"SELECT COUNT(*) FROM clientes WHERE ciudad = ?\", (malicioso,)).fetchone()[0]\nprint(\"Filas devueltas al intento de inyección:\", total)\ncon.close()", "tips": ["Fíjate en `(ciudad,)`: un solo parámetro igual va dentro de una tupla.", "Los nombres de tablas y columnas no pueden ser parámetros; si son dinámicos, valídalos contra una lista permitida."], "ejercicio": "Agrega funciones buscar_por_nombre, actualizar_ciudad y eliminar_cliente, todas con parámetros.", "quiz": {"q": "¿Cómo se previene la inyección SQL?", "o": ["Escribiendo SQL en mayúsculas", "Con f-strings", "Con parámetros ? y valores separados", "Con comentarios"], "a": 2, "x": "El motor trata los parámetros como datos, nunca como código SQL."}, "out": "1 Ana {'id': 1, 'nombre': 'Ana', 'ciudad': 'Lima'}\n3 Marta {'id': 3, 'nombre': 'Marta', 'ciudad': 'Lima'}\nFilas devueltas al intento de inyección: 0", "practica": {"titulo": "Consultas parametrizadas seguras", "contexto": "", "enunciado": "Escribe `armar_consulta(tabla, filtros, permitidas)`, que devuelve la tupla `(sql, parametros)` lista para `con.execute`:\n\n`armar_consulta(\"clientes\", {\"ciudad\": \"Lima\", \"activo\": 1}, {\"clientes\"})` →\n`(\"SELECT * FROM clientes WHERE ciudad = ? AND activo = ?\", (\"Lima\", 1))`\n\nSin filtros, no hay WHERE. Los nombres de tablas y columnas no pueden ser parámetros, así que valídalos: la tabla debe estar en `permitidas` y cada columna debe ser un identificador válido (`str.isidentifier()`); si no, `ValueError`. Los valores nunca se pegan en el texto.", "plantilla": "def armar_consulta(tabla, filtros, permitidas):\n    \"\"\"-> (sql, parametros)\"\"\"\n", "pruebas": "\nOK = {\"clientes\", \"productos\"}\ncaso(\"Consulta con dos filtros\", lambda: armar_consulta(\"clientes\", {\"ciudad\": \"Lima\", \"activo\": 1}, OK), (\"SELECT * FROM clientes WHERE ciudad = ? AND activo = ?\", (\"Lima\", 1)))\ncaso(\"Sin filtros\", lambda: armar_consulta(\"productos\", {}, OK), (\"SELECT * FROM productos\", ()))\ncaso(\"Los valores van en parámetros, nunca en el texto\", lambda: armar_consulta(\"clientes\", {\"nombre\": \"x' OR '1'='1\"}, OK), (\"SELECT * FROM clientes WHERE nombre = ?\", (\"x' OR '1'='1\",)))\ncaso(\"Tabla no permitida -> ValueError\", lambda: lanza(ValueError, armar_consulta, \"usuarios; DROP TABLE x\", {}, OK), True)\ncaso(\"Columna inválida -> ValueError\", lambda: lanza(ValueError, armar_consulta, \"clientes\", {\"ciudad = 1 OR 1\": 1}, OK), True, \"Valida cada columna con isidentifier().\")\n", "solucion": "def armar_consulta(tabla, filtros, permitidas):\n    \"\"\"-> (sql, parametros)\"\"\"\n    if tabla not in permitidas:\n        raise ValueError(f\"Tabla no permitida: {tabla}\")\n    for columna in filtros:\n        if not columna.isidentifier():\n            raise ValueError(f\"Columna inválida: {columna}\")\n    sql = f\"SELECT * FROM {tabla}\"\n    if filtros:\n        sql += \" WHERE \" + \" AND \".join(f\"{c} = ?\" for c in filtros)\n    return sql, tuple(filtros.values())\n", "pistas": ["Un `?` por cada filtro, unidos con `\" AND \"`.", "`tuple(filtros.values())` conserva el mismo orden que las columnas."], "explicacion": "El texto SQL solo contiene nombres validados contra una lista o una regla; todo dato del usuario viaja como parámetro. Esa separación es la defensa completa contra la inyección SQL."}}, {"t": "Transacciones y errores", "e": "🔐", "teoria": ["Una transacción agrupa operaciones que deben ocurrir todas o ninguna, como una transferencia: restar en una cuenta y sumar en otra.", "Usar la conexión como context manager (`with con:`) confirma si todo sale bien y revierte (rollback) si hay una excepción.", "Las restricciones `CHECK`, `UNIQUE` y `NOT NULL` hacen que la base misma rechace datos inválidos con `IntegrityError`."], "code": "import sqlite3\n\ncon = sqlite3.connect(\":memory:\")\ncon.execute(\"CREATE TABLE cuentas (titular TEXT PRIMARY KEY, saldo REAL CHECK (saldo >= 0))\")\ncon.executemany(\"INSERT INTO cuentas VALUES (?, ?)\", [(\"Ana\", 100), (\"Luis\", 50)])\ncon.commit()\n\ndef transferir(origen, destino, monto):\n    try:\n        with con:   # commit si todo sale bien, rollback si hay error\n            con.execute(\"UPDATE cuentas SET saldo = saldo + ? WHERE titular = ?\", (monto, destino))\n            con.execute(\"UPDATE cuentas SET saldo = saldo - ? WHERE titular = ?\", (monto, origen))\n        print(f\"OK: {origen} -> {destino} {monto}\")\n    except sqlite3.IntegrityError as e:\n        print(f\"Revertido: {e}\")\n\ntransferir(\"Ana\", \"Luis\", 30)\ntransferir(\"Luis\", \"Ana\", 500)\nprint(con.execute(\"SELECT * FROM cuentas\").fetchall())", "tips": ["Fíjate que en la transferencia fallida tampoco se sumó a Ana: el rollback deshizo ambas operaciones.", "Deja que la base valide lo esencial; tu código valida además para dar mensajes amables."], "ejercicio": "Registra cada transferencia en una tabla movimientos dentro de la misma transacción.", "quiz": {"q": "Si falla la segunda operación dentro de with con:, ¿qué pasa con la primera?", "o": ["Queda guardada", "Se duplica", "Se revierte también", "Depende del sistema"], "a": 2, "x": "La transacción es atómica: todo o nada."}, "out": "OK: Ana -> Luis 30\nRevertido: CHECK constraint failed: saldo >= 0\n[('Ana', 70.0), ('Luis', 80.0)]", "practica": {"titulo": "Una transferencia atómica", "contexto": "", "enunciado": "Escribe `transferir(cuentas, origen, destino, monto)` sobre un diccionario `{titular: saldo}`. Todo o nada: si el monto no es positivo, si alguna cuenta no existe o si el saldo no alcanza, lanza `ValueError` y deja el diccionario intacto. Si todo está bien, modifica ambas cuentas y devuelve el diccionario.", "plantilla": "def transferir(cuentas, origen, destino, monto):\n    \"\"\"Todo o nada, como una transacción.\"\"\"\n", "pruebas": "\nc = {\"Ana\": 100, \"Luis\": 50}\ncaso(\"Transferencia correcta\", lambda: transferir(c, \"Ana\", \"Luis\", 30), {\"Ana\": 70, \"Luis\": 80})\ncaso(\"Saldo insuficiente: error\", lambda: lanza(ValueError, transferir, c, \"Luis\", \"Ana\", 500), True)\ncaso(\"... y nada cambió\", lambda: c, {\"Ana\": 70, \"Luis\": 80}, \"Valida todo antes de tocar cualquier saldo.\")\ncaso(\"Cuenta inexistente: error sin cambios\", lambda: (lanza(ValueError, transferir, c, \"Ana\", \"Eva\", 10), c), (True, {\"Ana\": 70, \"Luis\": 80}))\ncaso(\"Monto no positivo: error\", lambda: (lanza(ValueError, transferir, c, \"Ana\", \"Luis\", 0), lanza(ValueError, transferir, c, \"Ana\", \"Luis\", -5)), (True, True))\n", "solucion": "def transferir(cuentas, origen, destino, monto):\n    \"\"\"Todo o nada, como una transacción.\"\"\"\n    if monto <= 0:\n        raise ValueError(\"El monto debe ser positivo\")\n    for titular in (origen, destino):\n        if titular not in cuentas:\n            raise ValueError(f\"No existe la cuenta de {titular}\")\n    if cuentas[origen] < monto:\n        raise ValueError(f\"Saldo insuficiente en la cuenta de {origen}\")\n    cuentas[origen] -= monto\n    cuentas[destino] += monto\n    return cuentas\n", "pistas": ["Primero todas las validaciones, después los cambios.", "Si validas a mitad de camino, podrías dejar una cuenta modificada y la otra no."], "explicacion": "Validar todo antes de escribir es la versión manual de una transacción. La base de datos lo garantiza aunque se corte la luz a mitad: por eso existen `commit` y `rollback`."}}]}, {"t": "Modelado de datos", "nivel": 3, "prereq": ["2-4"], "mision": "Diseña el modelo completo de una tienda (clientes, productos, pedidos) y documenta su diagrama.", "lecciones": [{"t": "Tablas, claves y relaciones", "e": "🧩", "teoria": ["Modelar es decidir qué tablas existen y cómo se relacionan. Cada tabla tiene una clave primaria; las claves foráneas apuntan a otras tablas.", "Las relaciones uno a muchos (una categoría, muchos productos) usan una clave foránea; las de muchos a muchos (pedidos y productos) usan una tabla puente.", "Normalizar es no repetir datos: el nombre de una categoría se guarda una sola vez y se referencia por su id."], "code": "import sqlite3\n\ncon = sqlite3.connect(\":memory:\")\ncon.execute(\"PRAGMA foreign_keys = ON\")\ncon.executescript(\"\"\"\nCREATE TABLE categorias (id INTEGER PRIMARY KEY, nombre TEXT NOT NULL UNIQUE);\nCREATE TABLE productos (\n    id INTEGER PRIMARY KEY, nombre TEXT NOT NULL,\n    precio REAL NOT NULL CHECK (precio > 0),\n    categoria_id INTEGER NOT NULL REFERENCES categorias(id));\nCREATE TABLE pedidos (id INTEGER PRIMARY KEY, fecha TEXT NOT NULL);\nCREATE TABLE pedido_items (                  -- tabla puente: muchos a muchos\n    pedido_id INTEGER REFERENCES pedidos(id),\n    producto_id INTEGER REFERENCES productos(id),\n    cantidad INTEGER NOT NULL CHECK (cantidad > 0),\n    PRIMARY KEY (pedido_id, producto_id));\nINSERT INTO categorias (nombre) VALUES ('Pinturas');\nINSERT INTO productos (nombre, precio, categoria_id) VALUES ('Rodillo', 6.0, 1);\n\"\"\")\n\ntry:\n    con.execute(\"INSERT INTO productos (nombre, precio, categoria_id) VALUES ('Fantasma', 1, 99)\")\nexcept sqlite3.IntegrityError as e:\n    print(\"Bloqueado:\", e)\nprint([r[0] for r in con.execute(\"SELECT name FROM sqlite_master WHERE type = 'table'\")])", "tips": ["En SQLite debes activar `PRAGMA foreign_keys = ON` en cada conexión; si no, no se validan.", "Dibuja el modelo antes de crearlo: dbdiagram.io o un papel bastan."], "ejercicio": "Agrega clientes al modelo (un cliente tiene muchos pedidos) e inserta un pedido completo con tres productos.", "quiz": {"q": "¿Cómo se modela una relación muchos a muchos?", "o": ["Duplicando tablas", "No se puede", "Con una columna de texto separada por comas", "Con una tabla puente con dos claves foráneas"], "a": 3, "x": "pedido_items une pedidos y productos y guarda datos propios, como la cantidad."}, "out": "Bloqueado: FOREIGN KEY constraint failed\n['categorias', 'productos', 'pedidos', 'pedido_items']", "practica": {"titulo": "Integridad referencial", "contexto": "", "enunciado": "Las tablas se relacionan por claves. Escribe:\n\n• `claves_rotas(productos, categorias)`: nombres de los productos cuyo `categoria_id` no existe entre los `id` de `categorias` (lo que una FOREIGN KEY impediría).\n• `detalle_pedido(pedido_id, items, productos)`: con la tabla puente `items` (tuplas `(pedido_id, producto_id, cantidad)`), devuelve `[(nombre, cantidad), ...]` del pedido indicado.", "plantilla": "def claves_rotas(productos, categorias):\n    \"\"\"Productos con categoría inexistente.\"\"\"\n\n\ndef detalle_pedido(pedido_id, items, productos):\n    \"\"\"[(nombre, cantidad)] de un pedido.\"\"\"\n", "pruebas": "\nCAT = [{\"id\": 1, \"nombre\": \"Pinturas\"}, {\"id\": 2, \"nombre\": \"Electricidad\"}]\nPROD = [{\"id\": 10, \"nombre\": \"Rodillo\", \"categoria_id\": 1}, {\"id\": 11, \"nombre\": \"Cable\", \"categoria_id\": 2},\n        {\"id\": 12, \"nombre\": \"Fantasma\", \"categoria_id\": 99}, {\"id\": 13, \"nombre\": \"Huérfano\", \"categoria_id\": None}]\ncaso(\"Detecta claves foráneas rotas\", lambda: claves_rotas(PROD, CAT), [\"Fantasma\", \"Huérfano\"], \"Arma un set con los ids de categorías y compara.\")\nITEMS = [(1, 10, 2), (1, 11, 5), (2, 10, 1)]\ncaso(\"Detalle del pedido 1\", lambda: detalle_pedido(1, ITEMS, PROD), [(\"Rodillo\", 2), (\"Cable\", 5)], \"Un diccionario {id: nombre} hace de JOIN.\")\ncaso(\"Pedido inexistente\", lambda: detalle_pedido(9, ITEMS, PROD), [])\n", "solucion": "def claves_rotas(productos, categorias):\n    \"\"\"Productos con categoría inexistente.\"\"\"\n    ids = {c[\"id\"] for c in categorias}\n    return [p[\"nombre\"] for p in productos if p[\"categoria_id\"] not in ids]\n\n\ndef detalle_pedido(pedido_id, items, productos):\n    \"\"\"[(nombre, cantidad)] de un pedido.\"\"\"\n    nombres = {p[\"id\"]: p[\"nombre\"] for p in productos}\n    return [(nombres[prod], cant) for ped, prod, cant in items if ped == pedido_id]\n", "pistas": ["Un set de ids hace instantánea la comprobación.", "La tabla puente se recorre filtrando por pedido."], "explicacion": "Una FOREIGN KEY hace esta verificación en cada inserción. La tabla puente resuelve el muchos a muchos: un pedido tiene muchos productos y un producto aparece en muchos pedidos."}}, {"t": "Índices y planes de consulta", "e": "⚡", "teoria": ["Sin índice, la base revisa todas las filas para encontrar las que buscas (escaneo completo). Un índice es como el índice de un libro: salta directo.", "`EXPLAIN QUERY PLAN` muestra cómo piensa ejecutar la consulta. Es la herramienta principal para diagnosticar lentitud.", "Los índices aceleran lecturas pero ocupan espacio y hacen más lentas las escrituras: crea los que tus consultas realmente usan."], "code": "import sqlite3, random\n\ncon = sqlite3.connect(\":memory:\")\ncon.execute(\"CREATE TABLE ventas (id INTEGER PRIMARY KEY, cliente TEXT, monto REAL)\")\nrandom.seed(1)\ncon.executemany(\"INSERT INTO ventas (cliente, monto) VALUES (?, ?)\",\n                [(f\"cliente{random.randint(1, 5000)}\", random.random() * 100) for _ in range(50_000)])\n\nconsulta = \"SELECT SUM(monto) FROM ventas WHERE cliente = 'cliente42'\"\nplan = lambda: con.execute(\"EXPLAIN QUERY PLAN \" + consulta).fetchall()[0][-1]\nprint(\"Sin índice:\", plan())\ncon.execute(\"CREATE INDEX idx_ventas_cliente ON ventas(cliente)\")\nprint(\"Con índice:\", plan())", "tips": ["Indexa columnas usadas en WHERE, JOIN y ORDER BY frecuentes.", "SCAN significa recorrer toda la tabla; SEARCH ... USING INDEX es lo que buscas."], "ejercicio": "Mide con timeit la consulta antes y después del índice y anota la diferencia en tu cuadernillo.", "quiz": {"q": "En EXPLAIN QUERY PLAN, ¿qué indica SCAN?", "o": ["Que hay un error", "Que recorre toda la tabla", "Que la consulta está en caché", "Que usa un índice"], "a": 1, "x": "SCAN es el escaneo completo; SEARCH ... USING INDEX es la búsqueda indexada."}, "out": "Sin índice: SCAN ventas\nCon índice: SEARCH ventas USING INDEX idx_ventas_cliente (cliente=?)", "practica": {"titulo": "Un índice a mano", "contexto": "", "enunciado": "Un índice evita recorrer toda la tabla. Escribe:\n\n• `crear_indice(filas, columna)`: diccionario `{valor: [posiciones de las filas con ese valor]}`.\n• `buscar(filas, indice, valor)`: las filas con ese valor, usando el índice (sin recorrer la tabla). Si el valor no existe, `[]`.", "plantilla": "def crear_indice(filas, columna):\n    \"\"\"{valor: [posiciones]}\"\"\"\n\n\ndef buscar(filas, indice, valor):\n    \"\"\"Filas con ese valor, usando el índice.\"\"\"\n", "pruebas": "\nV = [{\"cliente\": \"ana\", \"monto\": 10}, {\"cliente\": \"luis\", \"monto\": 5}, {\"cliente\": \"ana\", \"monto\": 7}, {\"cliente\": \"eva\", \"monto\": 3}]\nidx = crear_indice(V, \"cliente\")\ncaso(\"El índice guarda las posiciones\", lambda: idx, {\"ana\": [0, 2], \"luis\": [1], \"eva\": [3]})\ncaso(\"Búsqueda con el índice\", lambda: buscar(V, idx, \"ana\"), [V[0], V[2]])\ncaso(\"Valor inexistente\", lambda: buscar(V, idx, \"zoe\"), [])\nclass Vigilada(list):\n    recorridos = 0\n    def __iter__(self):\n        Vigilada.recorridos += 1\n        return super().__iter__()\nvv = Vigilada(V)\ncaso(\"buscar no recorre la tabla completa\", lambda: (buscar(vv, idx, \"luis\"), Vigilada.recorridos)[1], 0, \"Accede por posición: [filas[i] for i in indice.get(valor, [])]\")\n", "solucion": "def crear_indice(filas, columna):\n    \"\"\"{valor: [posiciones]}\"\"\"\n    indice = {}\n    for posicion, fila in enumerate(filas):\n        indice.setdefault(fila[columna], []).append(posicion)\n    return indice\n\n\ndef buscar(filas, indice, valor):\n    \"\"\"Filas con ese valor, usando el índice.\"\"\"\n    return [filas[i] for i in indice.get(valor, [])]\n", "pistas": ["`enumerate` da la posición de cada fila.", "Acceder por posición (`filas[i]`) no recorre la lista."], "explicacion": "Construir el índice cuesta un recorrido completo; después, cada búsqueda va directo a las filas. Es el mismo intercambio que hace CREATE INDEX: escrituras un poco más lentas a cambio de lecturas mucho más rápidas."}}]}, {"t": "SQLAlchemy ORM", "nivel": 3, "prereq": ["2-6", "3-2", "3-3"], "mision": "Reescribe tu agenda de clientes con SQLAlchemy, con relaciones y consultas agregadas.", "lecciones": [{"t": "Modelos y sesiones", "e": "🏛️", "teoria": ["Un ORM (mapeo objeto-relacional) te deja trabajar con clases de Python en lugar de escribir SQL a mano. SQLAlchemy es el estándar en Python.", "En SQLAlchemy 2.0 cada modelo hereda de `DeclarativeBase` y declara columnas con `Mapped[tipo]` y `mapped_column`: es tipado y amigable con mypy.", "La `Session` agrupa cambios y los confirma con `commit()`; `select()` construye consultas que se ejecutan con `scalars()`."], "code": "from sqlalchemy import create_engine, select, String\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session\n\nclass Base(DeclarativeBase):\n    pass\n\nclass Producto(Base):\n    __tablename__ = \"productos\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    nombre: Mapped[str] = mapped_column(String(80))\n    precio: Mapped[float]\n    stock: Mapped[int] = mapped_column(default=0)\n    def __repr__(self):\n        return f\"Producto({self.nombre!r}, {self.precio}, stock={self.stock})\"\n\nmotor = create_engine(\"sqlite://\")\nBase.metadata.create_all(motor)\n\nwith Session(motor) as sesion:\n    sesion.add_all([Producto(nombre=\"Cable\", precio=3.2, stock=150),\n                    Producto(nombre=\"Pintura\", precio=12.5),\n                    Producto(nombre=\"Rodillo\", precio=6.0, stock=25)])\n    sesion.commit()\n    baratos = sesion.scalars(select(Producto).where(Producto.precio < 10).order_by(Producto.precio)).all()\n    print(baratos)\n    pintura = sesion.scalar(select(Producto).filter_by(nombre=\"Pintura\"))\n    pintura.stock += 10\n    sesion.commit()\n    print(pintura)", "tips": ["Pasa `echo=True` a create_engine para ver el SQL que genera el ORM: es la mejor forma de aprender.", "Cambiar de SQLite a PostgreSQL es, casi siempre, cambiar solo la URL del motor."], "ejercicio": "Agrega un modelo Categoria y consulta los productos de una categoría ordenados por precio.", "quiz": {"q": "¿Qué hace sesion.commit()?", "o": ["Crea las tablas", "Borra la sesión", "Confirma en la base los cambios pendientes", "Cierra Python"], "a": 2, "x": "Hasta el commit, los cambios viven solo en la sesión."}, "out": "[Producto('Cable', 3.2, stock=150), Producto('Rodillo', 6.0, stock=25)]\nProducto('Pintura', 12.5, stock=10)", "practica": {"titulo": "Una sesión con commit y rollback", "contexto": "", "enunciado": "Crea la clase `Sesion`, una versión mínima de la sesión de un ORM:\n\n• `agregar(obj)`: lo deja pendiente.\n• `pendientes`: propiedad con la cantidad de objetos pendientes.\n• `commit()`: guarda los pendientes en la lista `guardados`, asignando a cada objeto (diccionario) un `\"id\"` correlativo desde 1, y vacía los pendientes. Devuelve cuántos guardó.\n• `rollback()`: descarta los pendientes sin guardarlos.", "plantilla": "class Sesion:\n    \"\"\"Unidad de trabajo mínima, como Session de SQLAlchemy.\"\"\"\n\n    def __init__(self):\n        self.guardados = []\n", "pruebas": "\ns = Sesion()\ns.agregar({\"nombre\": \"Cable\"})\ns.agregar({\"nombre\": \"Pintura\"})\ncaso(\"Los objetos quedan pendientes\", lambda: (s.pendientes, s.guardados), (2, []), \"pendientes es una @property que devuelve len(self._pendientes).\")\ncaso(\"commit guarda y asigna ids\", lambda: (s.commit(), s.guardados), (2, [{\"nombre\": \"Cable\", \"id\": 1}, {\"nombre\": \"Pintura\", \"id\": 2}]))\ncaso(\"Tras el commit no quedan pendientes\", lambda: s.pendientes, 0)\ns.agregar({\"nombre\": \"Fantasma\"})\ncaso(\"rollback descarta los pendientes\", lambda: (s.rollback(), s.pendientes, len(s.guardados))[1:], (0, 2))\ns.agregar({\"nombre\": \"Rodillo\"})\ncaso(\"Los ids siguen la secuencia\", lambda: (s.commit(), s.guardados[-1][\"id\"])[1], 3)\n", "solucion": "class Sesion:\n    \"\"\"Unidad de trabajo mínima, como Session de SQLAlchemy.\"\"\"\n\n    def __init__(self):\n        self.guardados = []\n        self._pendientes = []\n        self._proximo_id = 1\n\n    def agregar(self, obj):\n        self._pendientes.append(obj)\n\n    @property\n    def pendientes(self):\n        return len(self._pendientes)\n\n    def commit(self):\n        for obj in self._pendientes:\n            obj[\"id\"] = self._proximo_id\n            self._proximo_id += 1\n            self.guardados.append(obj)\n        cantidad = len(self._pendientes)\n        self._pendientes = []\n        return cantidad\n\n    def rollback(self):\n        self._pendientes = []\n", "pistas": ["Guarda los pendientes en un atributo privado, `self._pendientes`.", "Lleva el próximo id en un contador de la sesión."], "explicacion": "Los cambios viven en la sesión hasta el `commit`; un `rollback` los descarta sin tocar lo guardado. Así funciona la unidad de trabajo de SQLAlchemy."}}, {"t": "Relaciones y consultas agregadas", "e": "🕸️", "teoria": ["`relationship()` conecta modelos: `cliente.pedidos` devuelve una lista de objetos y `pedido.cliente` el objeto relacionado. `back_populates` mantiene ambos lados sincronizados.", "`cascade=\"all, delete-orphan\"` hace que al borrar un cliente se borren sus pedidos.", "Las consultas agregadas combinan `join`, `group_by` y funciones como `func.count` y `func.sum`."], "code": "from sqlalchemy import create_engine, select, ForeignKey, func\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship, Session\n\nclass Base(DeclarativeBase):\n    pass\n\nclass Cliente(Base):\n    __tablename__ = \"clientes\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    nombre: Mapped[str]\n    pedidos: Mapped[list[\"Pedido\"]] = relationship(back_populates=\"cliente\", cascade=\"all, delete-orphan\")\n\nclass Pedido(Base):\n    __tablename__ = \"pedidos\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    total: Mapped[float]\n    cliente_id: Mapped[int] = mapped_column(ForeignKey(\"clientes.id\"))\n    cliente: Mapped[Cliente] = relationship(back_populates=\"pedidos\")\n\nmotor = create_engine(\"sqlite://\")\nBase.metadata.create_all(motor)\nwith Session(motor) as s:\n    ana = Cliente(nombre=\"Ana\", pedidos=[Pedido(total=120), Pedido(total=80)])\n    luis = Cliente(nombre=\"Luis\", pedidos=[Pedido(total=45)])\n    s.add_all([ana, luis])\n    s.commit()\n    print([p.total for p in ana.pedidos], \"|\", ana.pedidos[0].cliente.nombre)\n    consulta = (select(Cliente.nombre, func.count(Pedido.id), func.sum(Pedido.total))\n                .join(Cliente.pedidos).group_by(Cliente.id)\n                .order_by(func.sum(Pedido.total).desc()))\n    for fila in s.execute(consulta):\n        print(tuple(fila))", "tips": ["Cuidado con el problema N+1: usa `selectinload` para traer relaciones en una sola consulta.", "Las migraciones del esquema se manejan con Alembic, compañero natural de SQLAlchemy."], "ejercicio": "Agrega productos y una tabla puente pedido_items, y calcula el producto más vendido con el ORM.", "quiz": {"q": "¿Para qué sirve back_populates?", "o": ["Para cachear consultas", "Para crear índices", "Para mantener sincronizados ambos lados de una relación", "Para borrar datos"], "a": 2, "x": "Al agregar un pedido a cliente.pedidos, pedido.cliente se actualiza solo."}, "out": "[120.0, 80.0] | Ana\n('Ana', 2, 200.0)\n('Luis', 1, 45.0)", "practica": {"titulo": "Relaciones uno a muchos", "contexto": "", "enunciado": "Con `clientes` (lista de `(id, nombre)`) y `pedidos` (lista de `(cliente_id, total)`):\n\n• `pedidos_por_cliente(clientes, pedidos)`: `{nombre: [totales]}`, incluidos los clientes sin pedidos (lista vacía), como `cliente.pedidos` en un ORM.\n• `ranking(clientes, pedidos)`: lista de `(nombre, cantidad, suma)` solo de clientes con pedidos, ordenada por suma de mayor a menor.", "plantilla": "def pedidos_por_cliente(clientes, pedidos):\n    \"\"\"{nombre: [totales]}\"\"\"\n\n\ndef ranking(clientes, pedidos):\n    \"\"\"[(nombre, cantidad, suma)] de mayor a menor.\"\"\"\n", "pruebas": "\nC = [(1, \"Ana\"), (2, \"Luis\"), (3, \"Eva\")]\nPE = [(1, 120), (2, 45), (1, 80)]\ncaso(\"Agrupa los pedidos de cada cliente\", lambda: pedidos_por_cliente(C, PE), {\"Ana\": [120, 80], \"Luis\": [45], \"Eva\": []})\ncaso(\"Ranking por suma\", lambda: ranking(C, PE), [(\"Ana\", 2, 200), (\"Luis\", 1, 45)], \"Excluye a los clientes sin pedidos (un INNER JOIN).\")\ncaso(\"Sin pedidos\", lambda: (pedidos_por_cliente(C, []), ranking(C, [])), ({\"Ana\": [], \"Luis\": [], \"Eva\": []}, []))\n", "solucion": "def pedidos_por_cliente(clientes, pedidos):\n    \"\"\"{nombre: [totales]}\"\"\"\n    nombres = dict(clientes)\n    resultado = {nombre: [] for _, nombre in clientes}\n    for cid, total in pedidos:\n        resultado[nombres[cid]].append(total)\n    return resultado\n\n\ndef ranking(clientes, pedidos):\n    \"\"\"[(nombre, cantidad, suma)] de mayor a menor.\"\"\"\n    filas = [(n, len(t), sum(t)) for n, t in pedidos_por_cliente(clientes, pedidos).items() if t]\n    return sorted(filas, key=lambda f: f[2], reverse=True)\n", "pistas": ["`dict(clientes)` convierte la lista de pares en `{id: nombre}`.", "Reutiliza `pedidos_por_cliente` en `ranking`."], "explicacion": "La primera función es la relación (`relationship`) del ORM: desde el cliente llegas a sus pedidos. La segunda es la consulta agregada con JOIN, GROUP BY y ORDER BY."}}]}, {"t": "PostgreSQL y arquitectura de datos", "nivel": 4, "prereq": ["3-3", "4-6"], "mision": "Migra tu tienda a PostgreSQL con un repositorio intercambiable y tests sin base real.", "lecciones": [{"t": "PostgreSQL desde Python", "e": "🐘", "teoria": ["PostgreSQL es la base de datos relacional de código abierto más completa: tipos avanzados (JSONB, fechas con zona horaria), concurrencia real y gran escalabilidad.", "`psycopg` (versión 3) es el driver oficial. Usa `%s` como marcador de parámetros y conexiones como context manager.", "`RETURNING` devuelve datos de la fila recién insertada, como su id, sin otra consulta."], "code": "import os\nimport psycopg\n\nDSN = os.environ[\"DATABASE_URL\"]   # p. ej. postgresql://usuario:clave@localhost:5432/tienda\n\nwith psycopg.connect(DSN) as con:\n    with con.cursor() as cur:\n        cur.execute(\"\"\"\n            CREATE TABLE IF NOT EXISTS productos (\n                id SERIAL PRIMARY KEY, nombre TEXT NOT NULL,\n                precio NUMERIC(10, 2) NOT NULL, creado TIMESTAMPTZ DEFAULT now())\"\"\")\n        cur.execute(\"INSERT INTO productos (nombre, precio) VALUES (%s, %s) RETURNING id\",\n                    (\"Cable\", 3.20))\n        nuevo_id = cur.fetchone()[0]\n        cur.execute(\"SELECT nombre, precio FROM productos WHERE id = %s\", (nuevo_id,))\n        print(nuevo_id, cur.fetchone())\n# al salir del with: commit automático, o rollback si hubo error", "tips": ["Para dinero usa NUMERIC, nunca FLOAT: psycopg lo convierte en Decimal.", "Levanta PostgreSQL local en un minuto con Docker: `docker run -e POSTGRES_PASSWORD=clave -p 5432:5432 postgres`."], "ejercicio": "Instala PostgreSQL (o usa Docker), crea tu modelo de tienda y migra los datos desde SQLite.", "quiz": {"q": "¿Qué tipo conviene para montos de dinero en PostgreSQL?", "o": ["TEXT", "FLOAT", "INTEGER siempre", "NUMERIC"], "a": 3, "x": "NUMERIC es exacto; FLOAT acumula errores de redondeo."}, "out": "1 ('Cable', Decimal('3.20'))", "run": false, "practica": {"titulo": "Cadena de conexión segura", "contexto": "", "enunciado": "Escribe `dsn(usuario, clave, base, host=\"localhost\", puerto=5432)`, que devuelve `\"postgresql://usuario:clave@host:puerto/base\"`. La clave puede tener símbolos como `@`, `:` o `/` que romperían la URL: codifícala con `urllib.parse.quote(clave, safe=\"\")`. Si el puerto no está entre 1 y 65535, lanza `ValueError`.", "plantilla": "from urllib.parse import quote\n\n\ndef dsn(usuario, clave, base, host=\"localhost\", puerto=5432):\n    \"\"\"postgresql://usuario:clave@host:puerto/base\"\"\"\n", "pruebas": "\ncaso(\"Cadena básica\", lambda: dsn(\"ari\", \"secreto\", \"tienda\"), \"postgresql://ari:secreto@localhost:5432/tienda\")\ncaso(\"Codifica los símbolos de la clave\", lambda: dsn(\"ari\", \"p@ss:w/rd\", \"tienda\"), \"postgresql://ari:p%40ss%3Aw%2Frd@localhost:5432/tienda\", \"quote(clave, safe=\\\"\\\") codifica también la barra.\")\ncaso(\"Host y puerto personalizados\", lambda: dsn(\"u\", \"c\", \"ventas\", \"db.miempresa.com\", 6543), \"postgresql://u:c@db.miempresa.com:6543/ventas\")\ncaso(\"Puerto inválido -> ValueError\", lambda: (lanza(ValueError, dsn, \"u\", \"c\", \"b\", puerto=0), lanza(ValueError, dsn, \"u\", \"c\", \"b\", puerto=70000)), (True, True))\n", "solucion": "from urllib.parse import quote\n\n\ndef dsn(usuario, clave, base, host=\"localhost\", puerto=5432):\n    \"\"\"postgresql://usuario:clave@host:puerto/base\"\"\"\n    if not 1 <= puerto <= 65535:\n        raise ValueError(f\"Puerto inválido: {puerto}\")\n    return f\"postgresql://{quote(usuario, safe='')}:{quote(clave, safe='')}@{host}:{puerto}/{base}\"\n", "pistas": ["Sin codificar, la `@` de la clave parecería el separador del host.", "`safe=\"\"` hace que `quote` codifique también `/`."], "explicacion": "Una clave con símbolos es el error más común al conectarse a PostgreSQL. En tu proyecto real, esta cadena se arma con datos de variables de entorno, nunca escritos en el código."}}, {"t": "Patrón Repository", "e": "🗃️", "teoria": ["El patrón Repository esconde la base de datos detrás de una interfaz: tu lógica de negocio pide 'guardar producto' sin saber si hay SQLite, PostgreSQL o una lista en memoria.", "Con `typing.Protocol` defines el contrato y cualquier clase que lo cumpla sirve. Así pruebas la lógica con un repositorio en memoria, rápido y sin base real.", "Junto con migraciones (Alembic) y pools de conexiones, es la base de las aplicaciones de datos profesionales."], "code": "import sqlite3\nfrom dataclasses import dataclass\nfrom typing import Protocol\n\n@dataclass\nclass Producto:\n    nombre: str\n    precio: float\n    id: int | None = None\n\nclass RepositorioProductos(Protocol):\n    def guardar(self, p: Producto) -> Producto: ...\n    def buscar_baratos(self, maximo: float) -> list[Producto]: ...\n\nclass RepoSQLite:\n    def __init__(self, con: sqlite3.Connection):\n        self.con = con\n        con.execute(\"CREATE TABLE IF NOT EXISTS productos (id INTEGER PRIMARY KEY, nombre TEXT, precio REAL)\")\n    def guardar(self, p):\n        cur = self.con.execute(\"INSERT INTO productos (nombre, precio) VALUES (?, ?)\", (p.nombre, p.precio))\n        self.con.commit()\n        p.id = cur.lastrowid\n        return p\n    def buscar_baratos(self, maximo):\n        filas = self.con.execute(\"SELECT nombre, precio, id FROM productos WHERE precio <= ? ORDER BY precio\", (maximo,))\n        return [Producto(*f) for f in filas]\n\nclass RepoMemoria:   # ideal para tests: sin base de datos\n    def __init__(self):\n        self.datos = []\n    def guardar(self, p):\n        p.id = len(self.datos) + 1\n        self.datos.append(p)\n        return p\n    def buscar_baratos(self, maximo):\n        return sorted((p for p in self.datos if p.precio <= maximo), key=lambda p: p.precio)\n\ndef cargar_catalogo(repo: RepositorioProductos) -> list[Producto]:\n    for nombre, precio in [(\"Cable\", 3.2), (\"Pintura\", 12.5), (\"Rodillo\", 6.0)]:\n        repo.guardar(Producto(nombre, precio))\n    return repo.buscar_baratos(10)\n\nprint(cargar_catalogo(RepoSQLite(sqlite3.connect(\":memory:\"))))\nprint(cargar_catalogo(RepoMemoria()))", "tips": ["La misma función produce el mismo resultado con dos repositorios distintos: esa es la prueba de que el diseño está desacoplado.", "Usa Alembic para versionar los cambios del esquema como si fueran commits."], "ejercicio": "Crea RepoSQLAlchemy que cumpla el mismo Protocol y verifica con pytest que los tres repositorios se comportan igual.", "quiz": {"q": "¿Qué ventaja da el patrón Repository?", "o": ["Cambiar o simular la base sin tocar la lógica de negocio", "Consultas más cortas", "No necesitar SQL nunca", "Más velocidad siempre"], "a": 0, "x": "La lógica depende de un contrato, no de una base concreta."}, "out": "[Producto(nombre='Cable', precio=3.2, id=1), Producto(nombre='Rodillo', precio=6.0, id=3)]\n[Producto(nombre='Cable', precio=3.2, id=1), Producto(nombre='Rodillo', precio=6.0, id=3)]", "practica": {"titulo": "Repositorio en memoria", "contexto": "from dataclasses import dataclass\n\n\n@dataclass\nclass Producto:\n    nombre: str\n    precio: float\n    id: object = None", "enunciado": "Ya existe la dataclass `Producto(nombre, precio, id=None)`. Crea la clase `RepoMemoria`, que cumple el mismo contrato que un repositorio de base de datos:\n\n• `guardar(p)`: le asigna un id correlativo desde 1 (si no tenía), lo guarda y lo devuelve.\n• `obtener(id)`: el producto con ese id, o `None`.\n• `buscar_baratos(maximo)`: los productos con precio menor o igual al máximo, ordenados por precio.\n• `len(repo)` devuelve cuántos productos hay.", "plantilla": "class RepoMemoria:\n    \"\"\"Repositorio de productos sin base de datos (ideal para tests).\"\"\"\n", "pruebas": "\nr = RepoMemoria()\na = r.guardar(Producto(\"Cable\", 3.2))\nb = r.guardar(Producto(\"Pintura\", 12.5))\nc = r.guardar(Producto(\"Rodillo\", 6.0))\ncaso(\"guardar asigna ids correlativos\", lambda: (a.id, b.id, c.id), (1, 2, 3))\ncaso(\"guardar devuelve el producto\", lambda: a.nombre, \"Cable\")\ncaso(\"obtener por id\", lambda: (r.obtener(2).nombre, r.obtener(99)), (\"Pintura\", None))\ncaso(\"buscar_baratos ordena por precio\", lambda: [p.nombre for p in r.buscar_baratos(10)], [\"Cable\", \"Rodillo\"])\ncaso(\"len(repo)\", lambda: len(r), 3, \"Implementa __len__.\")\ncaso(\"Cada repositorio es independiente\", lambda: len(RepoMemoria()), 0, \"Crea la lista o diccionario dentro de __init__.\")\n", "solucion": "class RepoMemoria:\n    \"\"\"Repositorio de productos sin base de datos (ideal para tests).\"\"\"\n\n    def __init__(self):\n        self._datos = {}\n\n    def guardar(self, p):\n        if p.id is None:\n            p.id = len(self._datos) + 1\n        self._datos[p.id] = p\n        return p\n\n    def obtener(self, id_):\n        return self._datos.get(id_)\n\n    def buscar_baratos(self, maximo):\n        return sorted((p for p in self._datos.values() if p.precio <= maximo), key=lambda p: p.precio)\n\n    def __len__(self):\n        return len(self._datos)\n", "pistas": ["Un diccionario `{id: producto}` hace instantáneo `obtener`.", "`.get(id_)` devuelve `None` si no existe."], "explicacion": "Este repositorio cumple el mismo contrato que uno con SQLite o PostgreSQL. La lógica de negocio que lo usa no nota la diferencia, y sus tests corren en milisegundos."}}]}, {"t": "Análisis con DuckDB", "nivel": 4, "prereq": ["4-4", "2-3"], "mision": "Analiza un año de ventas (millones de filas) con DuckDB y compara tiempos contra pandas.", "lecciones": [{"t": "Consultar archivos directamente", "e": "🦆", "teoria": ["DuckDB es una base analítica que corre dentro de tu programa, sin servidor. Está optimizada para agregaciones sobre millones de filas.", "Puede consultar archivos CSV, Parquet o JSON directamente con SQL, sin importarlos primero: `SELECT ... FROM 'ventas.csv'`.", "Detecta tipos automáticamente (fechas, números) y aprovecha todos los núcleos del procesador."], "code": "import duckdb, csv, random\n\nrandom.seed(3)\nwith open(\"ventas.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    w = csv.writer(f)\n    w.writerow([\"fecha\", \"sucursal\", \"producto\", \"monto\"])\n    for _ in range(10_000):\n        w.writerow([f\"2026-{random.randint(1, 12):02d}-15\", random.choice([\"Centro\", \"Norte\", \"Sur\"]),\n                    random.choice([\"Cable\", \"Pintura\", \"Rodillo\"]), round(random.uniform(5, 200), 2)])\n\nresultado = duckdb.sql(\"\"\"\n    SELECT sucursal, COUNT(*) AS ventas, ROUND(SUM(monto), 2) AS total, ROUND(AVG(monto), 2) AS ticket\n    FROM 'ventas.csv'\n    GROUP BY sucursal ORDER BY total DESC\n\"\"\")\nprint(resultado.fetchall())\nprint(duckdb.sql(\"SELECT MONTH(fecha) AS mes, ROUND(SUM(monto)) FROM 'ventas.csv' GROUP BY mes ORDER BY mes LIMIT 3\").fetchall())", "tips": ["Usa comodines para consultar muchos archivos a la vez: `FROM 'ventas_*.csv'`.", "`duckdb.sql(...).show()` imprime una tabla bonita en la consola."], "ejercicio": "Genera 1 millón de filas y calcula ventas por mes y sucursal; mide el tiempo con time.perf_counter.", "quiz": {"q": "¿Qué distingue a DuckDB de PostgreSQL?", "o": ["Son iguales", "DuckDB corre dentro de tu programa y está optimizada para análisis", "DuckDB no usa SQL", "DuckDB solo lee Excel"], "a": 1, "x": "PostgreSQL es un servidor para muchas transacciones; DuckDB, un motor embebido para analítica."}, "out": "[('Centro', 3358, 349917.38, 104.2), ('Norte', 3358, 341397.07, 101.67), ('Sur', 3284, 333626.04, 101.59)]\n[(1, 87565.0), (2, 83075.0), (3, 84116.0)]", "practica": {"titulo": "Agregaciones como en DuckDB", "contexto": "", "enunciado": "Escribe `agrupar(filas, clave, valor)`: con una lista de diccionarios, devuelve `{grupo: {\"cantidad\": n, \"total\": suma, \"promedio\": promedio}}`, con total y promedio redondeados a 2 decimales. Es lo que calcula `SELECT clave, COUNT(*), SUM(valor), AVG(valor) ... GROUP BY clave`.", "plantilla": "def agrupar(filas, clave, valor):\n    \"\"\"GROUP BY clave con COUNT, SUM y AVG.\"\"\"\n", "pruebas": "\nF = [{\"sucursal\": \"Centro\", \"monto\": 120.0}, {\"sucursal\": \"Norte\", \"monto\": 200.0}, {\"sucursal\": \"Centro\", \"monto\": 80.0},\n     {\"sucursal\": \"Centro\", \"monto\": 50.0}, {\"sucursal\": \"Norte\", \"monto\": 30.5}]\ncaso(\"Agrupa con cantidad, total y promedio\", lambda: agrupar(F, \"sucursal\", \"monto\"),\n     {\"Centro\": {\"cantidad\": 3, \"total\": 250.0, \"promedio\": 83.33}, \"Norte\": {\"cantidad\": 2, \"total\": 230.5, \"promedio\": 115.25}},\n     \"Acumula cantidad y suma por grupo; el promedio se calcula al final.\")\ncaso(\"Sin filas -> {}\", lambda: agrupar([], \"sucursal\", \"monto\"), {})\n", "solucion": "def agrupar(filas, clave, valor):\n    \"\"\"GROUP BY clave con COUNT, SUM y AVG.\"\"\"\n    acumulado = {}\n    for fila in filas:\n        g = acumulado.setdefault(fila[clave], [0, 0])\n        g[0] += 1\n        g[1] += fila[valor]\n    return {k: {\"cantidad\": n, \"total\": round(s, 2), \"promedio\": round(s / n, 2)} for k, (n, s) in acumulado.items()}\n", "pistas": ["Guarda por grupo un par `[cantidad, suma]`.", "El promedio es suma / cantidad, calculado después de recorrer."], "explicacion": "Un solo recorrido acumula lo necesario y el promedio se deriva al final: así lo hacen los motores analíticos, que nunca guardan todas las filas de cada grupo."}}, {"t": "DuckDB, pandas y Parquet", "e": "🧊", "teoria": ["Parquet es un formato columnar comprimido: ocupa mucho menos que un CSV y se lee mucho más rápido. Es el estándar en ingeniería de datos.", "DuckDB consulta un DataFrame de pandas por su nombre de variable y devuelve resultados como DataFrame con `.df()`.", "La combinación ideal: pandas para manipular, DuckDB para agregar con SQL, Parquet para guardar."], "code": "import duckdb\nimport pandas as pd\n\ndf = pd.DataFrame({\"producto\": [\"Cable\", \"Pintura\", \"Cable\", \"Rodillo\", \"Pintura\"],\n                   \"cantidad\": [10, 2, 5, 3, 4],\n                   \"precio\": [3.2, 12.5, 3.2, 6.0, 12.5]})\n\nduckdb.sql(\"COPY (SELECT * FROM df) TO 'ventas.parquet' (FORMAT parquet)\")\nresumen = duckdb.sql(\"\"\"\n    SELECT producto, SUM(cantidad) AS unidades, SUM(cantidad * precio) AS ingreso\n    FROM 'ventas.parquet' GROUP BY producto ORDER BY ingreso DESC\n\"\"\").df()\nprint(resumen)\nprint(type(resumen).__name__, \"| columnas:\", list(resumen.columns))", "tips": ["Polars es otra opción muy rápida que también lee y escribe Parquet.", "Guarda en Parquet particionado por fecha cuando los datos crecen."], "ejercicio": "Convierte tu CSV de 1 millón de filas a Parquet, compara tamaños en disco y tiempos de consulta.", "quiz": {"q": "¿Por qué Parquet es más eficiente que CSV para análisis?", "o": ["Lo abre Excel", "No tiene tipos", "Es texto plano", "Es columnar y comprimido"], "a": 3, "x": "Leer solo las columnas necesarias, ya comprimidas y tipadas, es mucho más rápido."}, "out": "  producto  unidades  ingreso\n0  Pintura       6.0     75.0\n1    Cable      15.0     48.0\n2  Rodillo       3.0     18.0\nDataFrame | columnas: ['producto', 'unidades', 'ingreso']", "practica": {"titulo": "Filas y columnas (formato columnar)", "contexto": "", "enunciado": "Parquet y DuckDB guardan los datos por columnas en lugar de por filas. Escribe:\n\n• `a_columnas(filas)`: de una lista de diccionarios con las mismas claves a `{columna: [valores]}`.\n• `a_filas(columnas)`: el camino inverso.\n• `suma_columna(columnas, nombre)`: la suma de una columna, sin recorrer las demás.", "plantilla": "def a_columnas(filas):\n    \"\"\"[{\"a\": 1, \"b\": 2}, {\"a\": 3, \"b\": 4}] -> {\"a\": [1, 3], \"b\": [2, 4]}\"\"\"\n\n\ndef a_filas(columnas):\n    \"\"\"El camino inverso.\"\"\"\n\n\ndef suma_columna(columnas, nombre):\n    \"\"\"Suma de una sola columna.\"\"\"\n", "pruebas": "\nFI = [{\"producto\": \"Cable\", \"cantidad\": 10}, {\"producto\": \"Pintura\", \"cantidad\": 2}, {\"producto\": \"Cable\", \"cantidad\": 5}]\ncaso(\"Filas a columnas\", lambda: a_columnas(FI), {\"producto\": [\"Cable\", \"Pintura\", \"Cable\"], \"cantidad\": [10, 2, 5]})\ncaso(\"Columnas a filas (ida y vuelta)\", lambda: a_filas(a_columnas(FI)), FI, \"zip(*columnas.values()) da las filas.\")\ncaso(\"Suma de una columna\", la function codigoProgreso(){
  const json = JSON.stringify(S), bytes = new TextEncoder().encode(json);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return "PYTHONIA1:" + btoa(bin);
}
function leerProgreso(txt){
  const m = String(txt).trim().match(/^PYTHONIA1:([A-Za-z0-9+/=\s]+)$/);
  if (!m) throw new Error("El texto no es un código de progreso de Pythonia. Cópialo completo: empieza con PYTHONIA1:");
  const bin = atob(m[1].replace(/\s/g, "")), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (!o || typeof o !== "object" || typeof o.done !== "object") throw new Error("El código está incompleto o dañado.");
  return o;
}
function sumarProgreso(o){
  const antes = {lec: Object.keys(S.done).length, prac: Object.values(S.prac).filter(v => v && v.ok).length};
  const unir = (a = {}, b = {}) => { const r = Object.assign({}, a); for (const k in b) if (r[k] == null || r[k] === "" || r[k] === false) r[k] = b[k]; return r; };
  for (const k of ["done", "quiz", "pred", "daily", "deg", "mis", "proj", "fus", "code", "intentos", "pistas", "vioSol", "ultErr", "demo"]) S[k] = unir(S[k], o[k]);
  S.quiz = Object.fromEntries(Object.entries(S.quiz).map(([k, v]) => [k, v === "ok" || (o.quiz || {})[k] === "ok" ? "ok" : v]));
  const prac = Object.assign({}, S.prac);
  for (const k in (o.prac || {})) if (o.prac[k] && o.prac[k].ok && !(prac[k] && prac[k].ok)) prac[k] = o.prac[k];
  S.prac = prac;
  S.xp = Math.max(S.xp || 0, o.xp || 0);
  S.days = [...new Set([...(S.days || []), ...(o.days || [])])].sort().slice(-400);
  const vistos = new Set(S.diary.map(e => JSON.stringify(e)));
  (o.diary || []).forEach(e => { const j = JSON.stringify(e); if (!vistos.has(j)) { vistos.add(j); S.diary.push(e); } });
  S.diary.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  for (const k of ["name", "principal", "secundaria", "test"]) if (!S[k] && o[k]) S[k] = o[k];
  S.total = S.total || !!o.total;
  save();
  return {lec: Object.keys(S.done).length - antes.lec, prac: Object.values(S.prac).filter(v => v && v.ok).length - antes.prac};
}

const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => ymd(new Date());
function touchDay(){ const t = today(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-400); } }
function streak(){ const set = new Set(S.days); let n = 0; const d = new Date(); if (!set.has(today())) d.setDate(d.getDate()-1);
  while (set.has(ymd(d))) { n++; d.setDate(d.getDate()-1); } return n; }
function gain(n, why){ S.xp += n; touchDay(); save(); toast(`+${n} XP · ${why}`); }

/* ───────── utilidades ───────── */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const md = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1900); }
const KW = "def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|raise|with|yield|async|await|lambda|pass|break|continue|None|True|False|is|global|nonlocal|del|assert|match|case";
const BI = "print|len|range|type|int|str|float|list|dict|set|tuple|sorted|sum|input|enumerate|zip|open|super|isinstance|round|abs|next|getattr|setattr|max|min";
const TOK = new RegExp(`(#[^\\n]*)|([rfb]?"""[\\s\\S]*?"""|[rfb]?'''[\\s\\S]*?'''|[rfb]?"(?:\\\\.|[^"\\\\\\n])*"|[rfb]?'(?:\\\\.|[^'\\\\\\n])*')|\\b(\\d[\\d_]*(?:\\.\\d+)?)\\b|\\b(${KW})\\b|\\b(${BI})\\b(?=\\()`, "g");
function hl(code, lang){
  if (lang !== "python") return esc(code);
  let out = "", last = 0;
  code.replace(TOK, (m, c, s, n, k, b, i) => { out += esc(code.slice(last, i));
    out += `<span class="${c ? "c" : s ? "s" : n ? "n" : k ? "k" : "b"}">${esc(m)}</span>`; last = i + m.length; return m; });
  return out + esc(code.slice(last));
}

const ROUTE = Object.fromEntries(D.rutas.map(r => [r.slug, r]));
const TRACK = Object.fromEntries(D.tracks.map(t => [t.slug, t]));
const LES = {}, TRUNK = [], RSEQ = {};
D.levels.forEach(lv => lv.lecciones.forEach((l, i) => { const k = lv.id+"-"+i;
  LES[k] = {key:k, l, kind:"tronco", lv, i, color:lv.color, ctx:`Nivel ${lv.id} · Lección ${i+1} de ${lv.lecciones.length}`}; TRUNK.push(k); }));
D.rutas.forEach(r => { RSEQ[r.slug] = []; r.modulos.forEach((m, mi) => m.lecciones.forEach((l, i) => { const k = `${r.slug}-${mi}-${i}`;
  LES[k] = {key:k, l, kind:"ruta", r, mi, i, color:r.color, ctx:`${r.t} · Módulo ${mi+1} · Lección ${i+1}`}; RSEQ[r.slug].push(k); })); });
const ALLKEYS = Object.keys(LES);

const active = () => S.total ? D.rutas.map(r => r.slug) : [S.principal, S.secundaria].filter(Boolean);
const modOpen = (r, mi) => r.modulos[mi].prereq.every(k => S.done[k]);
const modDone = (r, mi) => r.modulos[mi].lecciones.every((_, i) => S.done[`${r.slug}-${mi}-${i}`]);
const routeDone = r => r.modulos.every((_, mi) => modDone(r, mi));
const levelDone = id => D.levels.find(l => l.id === id).lecciones.every((_, i) => S.done[id+"-"+i]);
const nextTrunk = () => TRUNK.find(k => !S.done[k]);
function nextRouteLesson(){
  for (const sl of active()) { const r = ROUTE[sl];
    for (let mi = 0; mi < r.modulos.length; mi++) if (modOpen(r, mi) && !modDone(r, mi))
      return RSEQ[sl].find(k => k.startsWith(`${sl}-${mi}-`) && !S.done[k]); }
  return null;
}
const doneCount = () => Object.keys(S.done).length;
const quizOk = () => Object.values(S.quiz).filter(v => v === "ok").length;
const degDone = () => Object.keys(S.deg).length;
const RANKS = [[0,"Huevo","🥚"],[150,"Cría","🐣"],[500,"Aprendiz","🐍"],[1200,"Especialista","🛠️"],[2200,"Mentor","🧠"],[3500,"Leyenda Pythonia","👑"]];

  return {name:RANKS[r][1], ic:RANKS[r][2], next:nx, pct: nx ? (S.xp - RANKS[r][0]) / (nx[0] - RANKS[r][0]) * 100 : 100}; }

  ["⚗️","Fusión", () => Object.keys(S.fus).length >= 1], ["📓","Diarista", () => S.diary.length >= 5],

];

/* ───────── ÁRBOL ───────── */
function trail(lv){
  const n = lv.lecciones.length, step = 128, h = n * step + 20, nt = nextTrunk();
  const pts = lv.lecciones.map((_, i) => ({x: i % 2 === 0 ? 28 : 72, y: 70 + i * step}));
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < n; i++){ const a = pts[i-1], b = pts[i], my = (a.y + b.y) / 2; d += ` C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`; }
  return `<div class="trail" style="height:${h}px;--lc:${lv.color}">
    <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="${lv.color}" stroke-opacity=".25" stroke-width="26" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path d="${d}" fill="none" stroke="${lv.color}" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    ${lv.lecciones.map((l, i) => { const k = lv.id+"-"+i, p = pts[i];
      return `<button class="node ${S.done[k] ? "done" : ""} ${nt === k ? "next" : ""}" style="left:${p.x}%;top:${p.y}px" data-open="${k}" aria-label="Lección ${i+1}: ${esc(l.t)}${S.done[k] ? ", completada" : ""}">
        <span class="dot">${l.e}</span><span class="lab">${esc(l.t)}<small>Lección ${i+1}</small></span></button>`; }).join("")}</div>`;
}
function modCard(r, mi){
  const m = r.modulos[mi], open = modOpen(r, mi), done = modDone(r, mi);
  const nd = m.lecciones.filter((_, i) => S.done[`${r.slug}-${mi}-${i}`]).length;
  const miss = m.prereq.filter(k => !S.done[k]).length;
  return `<button class="mod ${open ? "" : "locked"} ${done ? "done" : ""}" style="--rc:${r.color}" data-mod="${r.slug}|${mi}">
    <span class="ic" aria-hidden="true">${open ? r.e : "🔒"}</span>
    <span class="tx"><b>${esc(m.t)}</b><small>${esc(r.t)} · Módulo ${mi+1}${open ? "" : ` · faltan ${miss} requisito${miss > 1 ? "s" : ""}`}</small></span>
    <span class="st">${done ? (S.mis[r.slug+"-"+mi] ? "Misión ✓" : "Completo") : open ? `${nd}/${m.lecciones.length}` : "Bloqueado"}</span></button>`;
}

function arbol(){

/* ───────── LECCIÓN ───────── */
function lensBlock(x){
  if (x.kind !== "tronco" || x.lv.id < 2) return "";

  return `<div class="blk"><h3>Con el lente de tu ruta 🔭</h3>${act.map(sl => `<div class="lens" style="--rc:${ROUTE[sl].color}"><div class="who">${ROUTE[sl].e} ${esc(ROUTE[sl].t)}</div><p style="margin:.3em 0 0">${md(x.l.lentes[sl])}</p></div>`).join("")}</div>`;
}
function nextOf(x){

  const seq = RSEQ[x.r.slug], i = seq.indexOf(x.key), n = seq[i+1];
  return n && modOpen(LES[n].r, LES[n].mi) ? n : null;
}

      <div class="opts">${q.o.map((o, j) => `<button class="opt ${qs && j === q.a ? "ok" : ""}" data-q="${j}" ${qs ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>

/* ───────── TEST VOCACIONAL ───────── */
function openTest(step = 0, answers = []){
  if (step < D.test.length){
    const q = D.test[step];
    return sheet("#0E3B43", `Test vocacional · ${step+1} de ${D.test.length}`, `
      <div class="dots">${D.test.map((_, i) => `<i class="${i < step ? "ok" : ""} ${i === step ? "cur" : ""}"></i>`).join("")}</div>
      <h1 id="sheet-title">${esc(q.q)}</h1><div class="opts">${q.o.map((o, j) => `<button class="opt" data-t="${j}" style="font-family:var(--text)">${esc(o[0])}</button>`).join("")}</div>
      ${step > 0 ? `<div class="finish"><button class="btn ghost" id="t-back">Anterior</button></div>` : ""}`,
    sh => { sh.querySelectorAll("[data-t]").forEach(b => b.onclick = () => openTest(step + 1, [...answers, +b.dataset.t]));
      const bk = sh.querySelector("#t-back"); if (bk) bk.onclick = () => openTest(step - 1, answers.slice(0, -1)); });
  }
  const score = Object.fromEntries(D.tracks.map(t => [t.slug, 0]));
  answers.forEach((a, i) => D.test[i].o[a][1].forEach(sl => score[sl] += 1));
  degScore(score);
  const order = D.tracks.map(t => t.slug).sort((a, b) => score[b] - score[a]);
  const top = order.slice(0, 3), max = Math.max(1, score[order[0]]);
  const firstFull = order.find(sl => ROUTE[sl]);
  const firstTime = !S.test; S.test = {top, date: today()}; firstTime ? gain(20, "test vocacional") : save();
  sheet("#0E3B43", "Tu resultado", `<div class="big" aria-hidden="true">🧭</div><h1 id="sheet-title">Tus rutas afines</h1>
    <p class="muted">Combina tus respuestas con tus aciertos en la degustación. Es una orientación, no una sentencia: puedes cambiar cuando quieras.</p>
    ${order.slice(0, 5).map(sl => `<div class="score" style="--rc:${ROUTE[sl] ? ROUTE[sl].color : "var(--hoja)"}"><span>${TRACK[sl].e} ${esc(TRACK[sl].t)}</span><span class="pill">${ROUTE[sl] ? "disponible" : "próxima fase"}</span><span class="b"><i style="width:${score[sl] / max * 100}%"></i></span></div>`).join("")}
    <div class="blk card"><h3>Recomendación</h3>
      <p>${ROUTE[top[0]] ? `Empieza con <b>${esc(ROUTE[top[0]].t)}</b> como ruta principal.` :
        `Tu mayor afinidad es <b>${esc(TRACK[top[0]].t)}</b>, que llega en una próxima fase. Mientras tanto te sugiero <b>${esc(ROUTE[firstFull].t)}</b>: refuerza bases que vas a usar allí.`}</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn sun" data-route="${firstFull}">Ver ${esc(ROUTE[firstFull].t)}</button>
      <button class="btn ghost" id="t-again">Repetir test</button></div></div>`,
  sh => { sh.querySelector("#t-again").onclick = () => openTest(); });
}
function degScore(score){ D.deg.forEach((d, i) => { if (S.deg[i] === "ok") score[d.slug] += 0.5; }); }

/* ═══════════════ PRÁCTICAS EVALUABLES Y PROYECTO PROGRESIVO ═══════════════
   Motor: Brython (Python en el navegador) cargado desde jsDelivr la primera vez que se evalúa.
   Respaldo 1: revisión de Claude (capacidad "sample") si el motor no puede cargarse.
   Respaldo 2: autorrevisión comparando con la solución. */

const BRYTHON_LOCAL = "vendor/brython/";   // copia incluida en la app instalable (funciona sin conexión)
const BRYTHON = "https://cdn.jsdelivr.net/npm/brython@3.14.3/";
const motor = {estado: "sin-cargar", promesa: null, error: ""};

function cargarScript(src){
  return new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = ok;
    s.onerror = () => mal(new Error("no se pudo descargar " + src.split("/").pop()));
    document.head.appendChild(s);
  });
}
function cargarMotor(){
  if (motor.promesa) return motor.promesa;
  motor.estado = "cargando"; avisarMotor();
  motor.promesa = (async () => {
    if (typeof window.brython !== "function") {
      let base = BRYTHON_LOCAL;
      try { await cargarScript(base + "brython.min.js"); }
      catch (e) { base = BRYTHON; await cargarScript(base + "brython.min.js"); }
      await cargarScript(base + "brython_stdlib.js");
    }
    const s = document.createElement("script");
    s.type = "text/python"; s.id = "arnes-pythonia"; s.textContent = D.arnes;
    document.body.appendChild(s);
    window.brython({debug: 0, ids: ["arnes-pythonia"]});
    const t0 = Date.now();
    while (typeof window.pyEvaluar !== "function") {
      if (Date.now() - t0 > 25000) throw new Error("el motor no respondió a tiempo");
      await new Promise(r => setTimeout(r, 120));
    }
    const prueba = JSON.parse(window.pyEvaluar("x = 1 + 1", "caso('ok', lambda: x, 2)", ""));
    if (!prueba.casos.length || !prueba.casos[0][0]) throw new Error("el motor no pasó la prueba inicial");
    motor.estado = "listo";
  })().catch(e => { motor.estado = "fallo"; motor.error = String(e && e.message || e); throw e; })
      .finally(avisarMotor);
  return motor.promesa;
}

function mdBloque(t){
  return t.split(/\n\n+/).map(par => {
    const lineas = par.split("\n");
    if (lineas.every(l => /^\s*•/.test(l)))
      return "<ul>" + lineas.map(l => `<li>${md(l.replace(/^\s*•\s*/, ""))}</li>`).join("") + "</ul>";
    return "<p>" + lineas.map(l => /^\s*•/.test(l) ? "• " + md(l.replace(/^\s*•\s*/, "")) : md(l)).join("<br>") + "</p>";
  }).join("");
}

function ensamblar(lv){
  const P = lv.proyecto_app, partes = [];
  partes.push(`"""${P.titulo} · Proyecto del Nivel ${lv.id} de Pythonia\n\n${P.intro}\n\nEjecuta este archivo en tu IDE con:  python ${P.archivo}\n"""\n`);
  const caps = [];
  piezas(lv).forEach(o => {
    const p = o.p, hecha = S.prac[o.key] && S.prac[o.key].ok, cod = hecha ? S.prac[o.key].code : null;
    partes.push(`\n# ${"═".repeat(10)} ${p.pieza} (lección ${lv.id}.${o.i + 1}) ${"═".repeat(10)}`);
    if (p.modo === "capitulo") {
      if (cod == null) { partes.push("# Pendiente: aprueba la práctica de esta lección para sumar el capítulo.\n"); return; }
      const nombre = "capitulo_" + (caps.length + 1); caps.push(nombre);
      let cuerpo = `"""${p.pieza}"""\n`;
      if (p.contexto) cuerpo += "# Datos de ejemplo del capítulo\n" + p.contexto + "\n# Tu código\n";
      cuerpo += cod.replace(/\s+$/, "") + "\n";
      (p.mostrar || []).forEach(v => { cuerpo += `print("  ${v} =", repr(${v}))\n`; });
      partes.push(`def ${nombre}():\n${sangrar(cuerpo)}\n`);
    } else {
      partes.push((cod != null ? cod : "# Pendiente: versión provisional hasta que apruebes la práctica.\n" + p.stub).replace(/\s+$/, "") + "\n");
    }
  });
  if (piezas(lv).some(o => o.p.modo === "capitulo")) partes.push(`\nCAPITULOS = [${caps.join(", ")}]\n`);
  partes.push(P.final.replace(/\s+$/, "") + "\n");
  return partes.join("\n");
}
